apply plugin: 'com.android.application'

def musaKeystore = System.getenv('MUSACAD_KEYSTORE_FILE')
def musaStorePassword = System.getenv('MUSACAD_KEYSTORE_PASSWORD')
def musaKeyAlias = System.getenv('MUSACAD_KEY_ALIAS')
def musaKeyPassword = System.getenv('MUSACAD_KEY_PASSWORD')
def musaTrialApiUrl = System.getenv('MUSACAD_TRIAL_API_URL') ?: ''
def musaTrialPublicKeyPem = System.getenv('MUSACAD_TRIAL_PUBLIC_KEY_PEM') ?: ''
def musaPlayProductId = System.getenv('MUSACAD_PLAY_YEARLY_PRODUCT_ID') ?: 'musacad_yearly_renewal'
def musaPlayVerifyUrl = System.getenv('MUSACAD_PLAY_VERIFY_URL') ?: ''
def musaAiApiUrl = System.getenv('MUSACAD_AI_API_URL') ?: ''
def musaAiSessionUrl = System.getenv('MUSACAD_AI_SESSION_URL') ?: ''
def hasReleaseSigning = musaKeystore && musaStorePassword && musaKeyAlias && musaKeyPassword
def productionRelease = ((project.findProperty('musacadProductionRelease')
    ?: System.getenv('MUSACAD_PRODUCTION_RELEASE')
    ?: 'false').toString()).equalsIgnoreCase('true')

def verifyCommonProductionRelease = {
    if (!hasReleaseSigning) {
        throw new GradleException('Production MusaCAD release requires MUSACAD_KEYSTORE_FILE, MUSACAD_KEYSTORE_PASSWORD, MUSACAD_KEY_ALIAS and MUSACAD_KEY_PASSWORD')
    }
    File ks = file(musaKeystore)
    if (!ks.isFile()) throw new GradleException('MUSACAD_KEYSTORE_FILE does not exist: ' + ks)
    if (!musaTrialApiUrl.startsWith('https://')) {
        throw new GradleException('Production MusaCAD release requires an HTTPS MUSACAD_TRIAL_API_URL')
    }
    if (!musaTrialPublicKeyPem.contains('-----BEGIN PUBLIC KEY-----') || !musaTrialPublicKeyPem.contains('-----END PUBLIC KEY-----')) {
        throw new GradleException('Production MusaCAD release requires MUSACAD_TRIAL_PUBLIC_KEY_PEM')
    }
    File paidPublicKey = file('src/main/assets/MUSACAD-LICENSE-PUBLIC.pem')
    if (!paidPublicKey.isFile() || !paidPublicKey.text.contains('-----BEGIN PUBLIC KEY-----')) {
        throw new GradleException('Production MusaCAD release requires a valid offline paid-license public key asset')
    }
}

tasks.register('verifyDirectProductionReleaseConfig') {
    group = 'verification'
    description = 'Fails a production direct release when signing/trial/offline-license configuration is incomplete.'
    doLast {
        if (!productionRelease) {
            logger.lifecycle('MusaCAD production-release enforcement disabled for validation build.')
            return
        }
        verifyCommonProductionRelease()
    }
}

tasks.register('verifyPlayProductionReleaseConfig') {
    group = 'verification'
    description = 'Fails a production Play release when signing/trial/Play verification configuration is incomplete.'
    doLast {
        if (!productionRelease) {
            logger.lifecycle('MusaCAD production-release enforcement disabled for validation build.')
            return
        }
        verifyCommonProductionRelease()
        if (!musaPlayVerifyUrl.startsWith('https://')) {
            throw new GradleException('Production Play release requires an HTTPS MUSACAD_PLAY_VERIFY_URL')
        }
        if (!musaPlayProductId.trim()) {
            throw new GradleException('Production Play release requires MUSACAD_PLAY_YEARLY_PRODUCT_ID')
        }
    }
}

android {
    namespace 'com.musa.cad'
    compileSdkVersion 35
    ndkVersion "27.2.12479018"
    buildFeatures { buildConfig true }
    externalNativeBuild { cmake { path "src/main/cpp/CMakeLists.txt"; version "3.22.1" } }

    signingConfigs {
        musacadDebug {
            storeFile rootProject.file("debug-signing/musacad-debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        if (hasReleaseSigning) {
            release {
                storeFile file(musaKeystore)
                storePassword musaStorePassword
                keyAlias musaKeyAlias
                keyPassword musaKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    defaultConfig {
        applicationId 'com.musa.cad'
        minSdkVersion 24
        targetSdkVersion 35
        ndk { abiFilters "arm64-v8a", "x86_64" }
        versionCode 15
        versionName '1.2.0'
        buildConfigField "String", "TRIAL_API_URL", groovy.json.JsonOutput.toJson(musaTrialApiUrl)
        buildConfigField "String", "TRIAL_PUBLIC_KEY_PEM", groovy.json.JsonOutput.toJson(musaTrialPublicKeyPem)
        buildConfigField "String", "PLAY_YEARLY_PRODUCT_ID", groovy.json.JsonOutput.toJson(musaPlayProductId)
        buildConfigField "String", "PLAY_VERIFY_URL", groovy.json.JsonOutput.toJson(musaPlayVerifyUrl)
        buildConfigField "String", "AI_API_URL", groovy.json.JsonOutput.toJson(musaAiApiUrl)
        buildConfigField "String", "AI_SESSION_URL", groovy.json.JsonOutput.toJson(musaAiSessionUrl)
        buildConfigField "boolean", "ALLOW_LEGACY_SHORT_LICENSE", productionRelease ? "false" : "true"
    }

    flavorDimensions "distribution"
    productFlavors {
        play {
            dimension "distribution"
            buildConfigField "boolean", "PLAY_DISTRIBUTION", "true"
            buildConfigField "String", "DISTRIBUTION_CHANNEL", groovy.json.JsonOutput.toJson("google_play")
        }
        direct {
            dimension "distribution"
            buildConfigField "boolean", "PLAY_DISTRIBUTION", "false"
            buildConfigField "String", "DISTRIBUTION_CHANNEL", groovy.json.JsonOutput.toJson("direct_apk")
        }
    }

    buildTypes {
        debug {
            debuggable true
            signingConfig signingConfigs.musacadDebug
        }
        release {
            debuggable false
            minifyEnabled false
            shrinkResources false
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.configureEach {
    resolutionStrategy {
        // Billing 9.x pulls Kotlin 1.8.x while older AndroidX/Material transitives can
        // still request kotlin-stdlib-jdk7/jdk8 1.6.x. Align them to one version so
        // assembleDebug does not fail with duplicate Kotlin classes.
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.core:core:1.6.0'
    implementation 'com.google.android.material:material:1.4.0'
    playImplementation 'com.android.billingclient:billing:9.1.0'
}

afterEvaluate {
    if (productionRelease) {
        tasks.matching { it.name == 'assembleDirectRelease' || it.name == 'bundleDirectRelease' }.configureEach {
            dependsOn tasks.named('verifyDirectProductionReleaseConfig')
        }
        tasks.matching { it.name == 'assemblePlayRelease' || it.name == 'bundlePlayRelease' }.configureEach {
            dependsOn tasks.named('verifyPlayProductionReleaseConfig')
        }
    }
}
