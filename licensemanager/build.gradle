apply plugin: 'com.android.application'

def managerKeystore = System.getenv('MUSACAD_MANAGER_KEYSTORE_FILE')
def managerStorePassword = System.getenv('MUSACAD_MANAGER_KEYSTORE_PASSWORD')
def managerKeyAlias = System.getenv('MUSACAD_MANAGER_KEY_ALIAS')
def managerKeyPassword = System.getenv('MUSACAD_MANAGER_KEY_PASSWORD')
def hasManagerReleaseSigning = managerKeystore && managerStorePassword && managerKeyAlias && managerKeyPassword
def managerProductionRelease = ((project.findProperty('musacadManagerProductionRelease')
    ?: System.getenv('MUSACAD_MANAGER_PRODUCTION_RELEASE')
    ?: 'false').toString()).equalsIgnoreCase('true')

def expectedPaidPublicKeyFile = rootProject.file('app/src/main/assets/MUSACAD-LICENSE-PUBLIC.pem')
def expectedPaidKeyFingerprint = ''
if(expectedPaidPublicKeyFile.isFile()){
    def pem = expectedPaidPublicKeyFile.text
        .replace('-----BEGIN PUBLIC KEY-----','')
        .replace('-----END PUBLIC KEY-----','')
        .replaceAll('\\s','')
    if(pem){
        def der = java.util.Base64.getDecoder().decode(pem)
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(der)
        def parts=[]
        for(int i=0;i<12;i++) parts << String.format('%02X',digest[i] & 0xff)
        expectedPaidKeyFingerprint = parts[0..3].join('')+'-'+parts[4..7].join('')+'-'+parts[8..11].join('')
    }
}

tasks.register('verifyManagerProductionReleaseConfig') {
    group='verification'
    doLast {
        if(!managerProductionRelease){
            logger.lifecycle('License Manager production-release enforcement disabled for validation build.')
            return
        }
        if(!hasManagerReleaseSigning) throw new GradleException('Production License Manager requires MUSACAD_MANAGER_KEYSTORE_FILE/PASSWORD/ALIAS/KEY_PASSWORD')
        if(!file(managerKeystore).isFile()) throw new GradleException('MUSACAD_MANAGER_KEYSTORE_FILE does not exist')
    }
}

android {
    namespace 'com.musa.cad.licensemanager'
    compileSdkVersion 35

    buildFeatures { buildConfig true }

    signingConfigs {
        musacadDebug {
            storeFile rootProject.file("debug-signing/musacad-debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        if(hasManagerReleaseSigning){
            release {
                storeFile file(managerKeystore)
                storePassword managerStorePassword
                keyAlias managerKeyAlias
                keyPassword managerKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    defaultConfig {
        applicationId 'com.musa.cad.licensemanager'
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 2
        versionName '1.1'
        buildConfigField "String", "EXPECTED_LICENSE_KEY_FINGERPRINT", groovy.json.JsonOutput.toJson(expectedPaidKeyFingerprint)
        buildConfigField "boolean", "ALLOW_LEGACY_SHORT_LICENSE", managerProductionRelease ? "false" : "true"
    }

    buildTypes {
        debug {
            debuggable true
            signingConfig signingConfigs.musacadDebug
        }
        release {
            debuggable false
            minifyEnabled false
            shrinkResources false
            if(hasManagerReleaseSigning) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.core:core:1.6.0'
    implementation 'com.google.android.material:material:1.4.0'
}

afterEvaluate {
    if(managerProductionRelease){
        tasks.matching { it.name == 'assembleRelease' || it.name == 'bundleRelease' }.configureEach {
            dependsOn tasks.named('verifyManagerProductionReleaseConfig')
        }
    }
}
