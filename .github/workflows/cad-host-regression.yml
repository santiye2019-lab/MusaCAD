name: MusaCAD Linux CAD engine regression
on:
  push:
    branches:
      - 'feature/gandalf-drive-server-cad-bridge-*'
    paths:
      - 'app/src/main/cpp/**'
      - 'app/src/main/java/com/musa/cad/**'
      - 'tests/Cad*Test.java'
      - 'tests/SelectionBoundsTest.java'
      - 'tests/SnapPointsTest.java'
      - 'tests/DxfStreamingLargeTest.java'
      - 'tests/DxfColorTest.java'
      - 'tests/DxfPlanarFaceTest.java'
      - 'tests/DxfPolyline3DTest.java'
      - 'tests/DxfAcisCoverageTest.java'
      - 'tests/AcisConversionDiagnosticTest.java'
      - 'tests/native_color_test.c'
      - 'tests/audit_dwg_to_dxf.py'
      - 'tests/audit_acis_roundtrip.py'
      - 'tests/AcisDxfRoundTripProbe.java'
      - 'tests/native_acis_sab_audit.c'
      - 'tests/AcisSatMeshTest.java'
      - 'tests/Dxf3dMeshTest.java'
      - '.github/workflows/cad-host-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-native:
    name: Host compiler and DWG conversion
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Get pinned LibreDWG (same source as Android)
        uses: actions/checkout@v4
        with:
          repository: LibreDWG/libredwg
          ref: 34f02f54b9aacb5708c1d3d2070efb3e4b2d8c43
          path: third_party/libredwg
      - name: Keep experimental SAB history fix out of Android APKs
        run: |
          set -euo pipefail
          # Deliberately request the experimental patch in an Android configure.
          # It must fail with the explicit safety gate (not a missing SDK error).
          if cmake -S app/src/main/cpp -B /tmp/musacad-android-history-negative \
              -DANDROID=ON -DMUSACAD_PRESERVE_R2013_SAB_HISTORY=ON \
              >/tmp/musacad-android-history-negative.log 2>&1; then
            echo 'FAIL: experimental ACIS conversion entered Android build' >&2
            exit 1
          fi
          grep -q 'Experimental R2013 SAB history conversion cannot be included' \
            /tmp/musacad-android-history-negative.log
          grep -q 'set(_MUSACAD_SAB_HISTORY_DEFAULT OFF)' app/src/main/cpp/CMakeLists.txt
          echo 'PASS: host-only ACIS experiment cannot enter Android APK'
      - name: Check host converter does not reject drawings on preview failure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('app/src/main/cpp/dwg_bridge.c').read_text()
          start = src.index('#ifdef MUSA_HOST')
          stop = src.index('#else', start)
          host = src[start:stop]
          assert 'if(scene_status<0||scene.primitives<=0)' in host
          assert 'int result=session_export_dxf(session,argv[2]);' in host
          assert host.index('musa_scene_free(&scene)') < host.index('int result=session_export_dxf(session,argv[2]);')
          assert 'scene.primitives<=0){musa_scene_free(&scene);session_close(session);return 1;}' not in host
          print('PASS: empty model preview no longer blocks full DXF export')
          PY
      - name: Build Linux host CAD converter
        run: |
          cmake -S app/src/main/cpp -B /tmp/musacad-host -DCMAKE_BUILD_TYPE=Release -DMUSACAD_HOST_ACDS_SIGNATURE_AUDIT=ON
          cmake --build /tmp/musacad-host --parallel 2
          test -x /tmp/musacad-host/musacad_dwg_convert
      - name: Validate native color source semantics
        run: |
          cc -std=c11 -Wall -Wextra -Werror tests/native_color_test.c -o /tmp/musacad-native-color-test
          /tmp/musacad-native-color-test
      - name: Audit DXF structure and nonempty entity inventory
        run: |
          python3 tests/audit_dwg_to_dxf.py --self-test
      - name: Verify original DWG external ACIS datastore audit is retained
        run: |
          python3 - <<'PY'
          from pathlib import Path
          native=Path('app/src/main/cpp/dwg_bridge.c').read_text()
          java=Path('app/src/main/java/com/musa/cad/NativeCadEngine.java').read_text()
          assert 'obj->tio.entity->has_ds_data' in native
          assert 'DWG_TYPE__3DSOLID' in native
          assert 'DWG_TYPE_REGION' in native
          assert 'DWG_TYPE_BODY' in native
          assert 'stats.acis_external_data_count++' in native
          assert 'needsAcisDataBridge()' in java
          print('PASS: source AcDs geometry risk tracked before DXF conversion')
          PY
      - name: Convert reference DWG without losing DXF data
        run: |
          /tmp/musacad-host/musacad_dwg_convert third_party/libredwg/test/test-data/example_2013.dwg /tmp/musacad-host-smoke.dxf
          test -s /tmp/musacad-host-smoke.dxf
          grep -aq 'SECTION' /tmp/musacad-host-smoke.dxf
          grep -aq 'ENTITIES' /tmp/musacad-host-smoke.dxf
      - name: DWG release compatibility matrix (2000–2018)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import json
          versions=('2000','2004','2007','2010','2013','2018')
          binary='/tmp/musacad-host/musacad_dwg_convert'
          root=Path('third_party/libredwg/test/test-data')
          baseline_inventory=None
          for version in versions:
              original=root/f'example_{version}.dwg'
              output=Path(f'/tmp/musacad-version-{version}.dxf')
              result=subprocess.run([binary,str(original),str(output)],
                                    capture_output=True,text=True,timeout=90)
              assert result.returncode==0, (f'DWG {version} convert failed: '
                  +result.stderr[-1500:])
              assert output.is_file() and output.stat().st_size>100, (
                  f'DWG {version}: no usable DXF output')
              data=output.read_bytes()
              assert b'SECTION' in data and b'ENTITIES' in data and b'EOF' in data, (
                  f'DWG {version}: DXF sections incomplete')
              audit_output=subprocess.check_output(
                  ['python3','tests/audit_dwg_to_dxf.py',str(output)],
                  text=True,timeout=30)
              inventory=json.loads(audit_output)['entity_types']
              if baseline_inventory is None: baseline_inventory=inventory
              else:
                  assert inventory==baseline_inventory, (
                      f'DWG {version} lost/gained an entity family vs DWG 2000: '
                      f'{inventory} vs {baseline_inventory}')
              print(f'PASS: DWG {version} -> audited DXF ({output.stat().st_size} bytes, '
                    f'{sum(inventory.values())} entity records, {len(inventory)} entity families)')

          PY
      - name: Verify real DWG ACIS solid survives the native conversion
        run: |
          set -euo pipefail
          python3 tests/audit_acis_roundtrip.py --self-test
          # Test a pinned upstream DWG, not just synthetic SAT text.
          /tmp/musacad-host/musacad_dwg_convert third_party/libredwg/test/test-data/2000/Cone.dwg /tmp/musacad-cone-acis.dxf 2>/tmp/musacad-cone-source.log
          python3 tests/audit_acis_roundtrip.py /tmp/musacad-cone-acis.dxf --source-log /tmp/musacad-cone-source.log --require-source
      - name: Probe actual ACIS surface mesh from native-converted DWG
        run: |
          mkdir -p /tmp/musacad-acis-probe
          javac -d /tmp/musacad-acis-probe app/src/main/java/com/musa/cad/AcisSatMesh.java tests/AcisDxfRoundTripProbe.java
          java -cp /tmp/musacad-acis-probe AcisDxfRoundTripProbe /tmp/musacad-cone-acis.dxf
      - name: Audit original public R2013 SAB pointer inventory before DXF conversion
        run: |
          set -euo pipefail
          /tmp/musacad-host/musacad_sab_audit third_party/libredwg/test/test-data/example_2013.dwg | tee /tmp/musacad-public-r2013-acds.log
          echo 'The source binary audit is diagnostic, not B-Rep fidelity certification.'
      - name: Determine source AcDs layout in public R2018 DWG without exposing drawings
        run: |
          set -euo pipefail
          /tmp/musacad-host/musacad_sab_audit third_party/libredwg/test/test-data/example_2018.dwg | tee /tmp/musacad-public-r2018-acds.log
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/musacad-public-r2018-acds.log').read_text().splitlines()
          metadata=next((x for x in lines if x.startswith('ACDS_METADATA ')),None)
          segments=next((x for x in lines if x.startswith('ACDS_SEGMENT_SUMMARY ')),None)
          source=next((x for x in lines if x.startswith('SAB_SOURCE_SUMMARY ')),None)
          assert metadata and segments and source, 'Missing read-only R2018 AcDs diagnostics'
          def fields(line):
              return dict(part.split('=',1) for part in line.split()[1:])
          assert source=='SAB_SOURCE_SUMMARY bodies=3 partial_or_missing=3', source
          v18=fields(metadata);s18=fields(segments)
          assert (v18['version'],v18['sections'],v18['loaded'],v18['datastore_revision'])==('40','7','6','1'),v18
          assert s18['data']=='1' and s18['search']=='1' and s18['blob']=='0',s18
          prior=Path('/tmp/musacad-public-r2013-acds.log').read_text().splitlines()
          v13=fields(next(line for line in prior if line.startswith('ACDS_METADATA ')))
          summary13=next(line for line in prior if line.startswith('SAB_SOURCE_SUMMARY '))
          assert (v13['version'],v13['sections'],v13['loaded'],v13['datastore_revision'])==('38','13','8','2'),v13
          assert summary13=='SAB_SOURCE_SUMMARY bodies=3 partial_or_missing=0',summary13
          print('PASS: both have AcDs sections; R2018 datastore is present, but its external binary SAB was not extracted')
          print('R2013: datastore rev2 / 8 loaded segments / 3 SAB; R2018: rev1 / 6 segments / 0 extracted SAB')
          PY
          /tmp/musacad-host/musacad_dwg_convert third_party/libredwg/test/test-data/example_2018.dwg /tmp/musacad-public-r2018-convert.dxf 2>/tmp/musacad-public-r2018-raw.log
          python3 - <<'PY'
          from pathlib import Path
          log=Path('/tmp/musacad-public-r2018-raw.log').read_text(errors='replace')
          markers=[x for x in log.splitlines() if x.startswith('MUSACAD_PUBLIC_ACDS_MARKERS ')]
          assert len(markers)==1, 'Decoded public R2018 AcDs marker coverage missing'
          fields=dict(part.split('=',1) for part in markers[0].split()[1:])
          assert (fields['starts'],fields['asm_starts'],fields['ends'])==('0','3','3'),fields
          header_lines=[x for x in log.splitlines() if x.startswith('MUSACAD_PUBLIC_ASM_HEADER ')]
          assert len(header_lines)==6, 'Public R2018 ASM numeric header probes unavailable'
          print('PUBLIC R2018 '+markers[0])
          for line in header_lines: print('PUBLIC R2018 '+line)
          PY
      - name: Verify native AcDs SAB-to-SAT conversion from real R2013 DWG
        run: |
          set -euo pipefail
          /tmp/musacad-host/musacad_dwg_convert third_party/libredwg/test/test-data/example_2013.dwg /tmp/musacad-r2013-acds.dxf 2>/tmp/musacad-r2013-acds.log
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/musacad-r2013-acds.log').read_text(errors='replace').splitlines()
          markers=[x for x in lines if x.startswith('MUSACAD_PUBLIC_ACDS_MARKERS ')]
          assert len(markers)==1, 'Public R2013 AcDs raw marker audit not reached'
          fields=dict(part.split('=',1) for part in markers[0].split()[1:])
          assert (fields['starts'],fields['asm_starts'],fields['ends'])==('3','0','3'),fields
          print('PUBLIC R2013 '+markers[0])
          PY
          python3 tests/audit_acis_roundtrip.py /tmp/musacad-r2013-acds.dxf --source-log /tmp/musacad-r2013-acds.log --require-source --require-external
          java -cp /tmp/musacad-acis-probe AcisDxfRoundTripProbe /tmp/musacad-r2013-acds.dxf --public-fixture-debug
      - name: Preserve embedded OLE object payload
        run: |
          /tmp/musacad-host/musacad_dwg_convert third_party/libredwg/test/test-data/2000/TS1.dwg /tmp/musacad-ole.dxf
          python3 - <<'PY'
          from pathlib import Path
          pairs=Path('/tmp/musacad-ole.dxf').read_text(errors='ignore').replace('\r','').split('\n')
          ole='OLE2FRAME' in pairs
          payload=any(pairs[i].strip()=='310' and pairs[i+1].strip() for i in range(len(pairs)-1))
          assert ole, 'OLE2FRAME entity was lost in conversion'
          assert payload, 'OLE2FRAME binary payload was lost'
          print('PASS: OLE2FRAME entity and payload retained')
          PY

      - name: Verify R2013 source-history candidate preserves real B-Rep faces
        run: |
          set -euo pipefail
          # Native converter was already built with the guarded CMake history fix.
          # No source patching occurs inside this validation step.
          /tmp/musacad-host/musacad_dwg_convert third_party/libredwg/test/test-data/example_2013.dwg /tmp/musacad-history-ab.dxf 2>/tmp/musacad-history-ab.log
          python3 tests/audit_acis_roundtrip.py /tmp/musacad-history-ab.dxf --source-log /tmp/musacad-history-ab.log --require-source --require-external
          java -cp /tmp/musacad-acis-probe AcisDxfRoundTripProbe /tmp/musacad-history-ab.dxf --public-fixture-debug | tee /tmp/musacad-history-ab-mesh.log
          python3 - <<'PY'
          from pathlib import Path
          log=Path('/tmp/musacad-history-ab-mesh.log').read_text()
          line=next((x for x in log.splitlines() if x.startswith('ACIS_REAL_DXF_MESH ')),None)
          assert line is not None, 'Experimental R2013 ACIS mesh report missing'
          values=dict(part.split('=',1) for part in line.split()[1:])
          assert values.get('bodies')=='3' and values.get('mesh')=='3' and values.get('faces')=='10', values
          assert int(values['tessellated'])==10 and int(values['unsupported'])==0 and int(values['triangles'])==28, values
          for body,number in ((1,27),(2,32),(3,134)):
              expected=f'ACIS_PUBLIC_RECORD_PARITY body={body} source_records={number} parsed_nodes={number} excess_records=0'
              assert expected in log, expected
          assert 'PASS: two public R2013 nested triangular openings stay EMPTY' in log
          print('PASS: retained 193 original SAB records, all 10 planar faces and both genuine triangular holes')
          PY
          /tmp/musacad-host/musacad_dwg_convert third_party/libredwg/test/test-data/2000/Cone.dwg /tmp/musacad-history-ab-cone.dxf 2>/tmp/musacad-history-ab-cone.log
          python3 tests/audit_acis_roundtrip.py /tmp/musacad-history-ab-cone.dxf --source-log /tmp/musacad-history-ab-cone.log --require-source
          java -cp /tmp/musacad-acis-probe AcisDxfRoundTripProbe /tmp/musacad-history-ab-cone.dxf
          # R2018 has 3 original ACIS entities but no binary SAB exposed.
          # Report the limitation separately; do not certify missing geometry.
          echo 'Development-only native ACIS candidate passed its public fixture gate; APK not built.'

      - name: Investigate R2018 ASM envelope with isolated read-only host alias
        run: |
          set -euo pipefail
          # This is an OBSERVATIONAL test with a disposable GitHub runner.
          # The source DWG, main branch, Android compiler and APK are unchanged.
          # A 15-byte ASM BinaryFile4 prefix is normalized ONLY in memory,
          # before the existing SAB-to-SAT test decoder. No success is presumed.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('third_party/libredwg/src/acds.spec')
          src=p.read_text()
          old='const char start[] = "ACIS BinaryFile";'
          marker='memcpy (acis_sab_data, s, size);'
          assert src.count(old)==1 and src.count(marker)==1, 'Pinned AcDs finder changed'
          src=src.replace(old,'const char start[] = "ASM BinaryFile4";')
          src=src.replace(marker,marker+'\n            memcpy (acis_sab_data, "ACIS BinaryFile", 15);')
          p.write_text(src)
          print('TEST ONLY: decode public R2018 ASM envelope using a byte-aligned 15-character alias')
          PY
          cmake --build /tmp/musacad-host --parallel 2
          set +e
          timeout 45s /tmp/musacad-host/musacad_dwg_convert third_party/libredwg/test/test-data/example_2018.dwg /tmp/musacad-r2018-asm-alias.dxf 2>/tmp/musacad-r2018-asm-alias.log
          result=$?
          set -e
          echo "MUSACAD_R2018_ASM_ALIAS_CONVERTER_EXIT=$result"
          grep -E 'MUSACAD_ACIS_SOURCE|MUSACAD_PUBLIC_ACDS_MARKERS|MusaCAD converter status' /tmp/musacad-r2018-asm-alias.log || true
          if [ "$result" -eq 0 ] && [ -s /tmp/musacad-r2018-asm-alias.dxf ]; then
            if python3 tests/audit_acis_roundtrip.py /tmp/musacad-r2018-asm-alias.dxf --source-log /tmp/musacad-r2018-asm-alias.log --require-source --require-external; then
              echo 'MUSACAD_R2018_ASM_ALIAS_SAT_TRANSPORT=1'
              if java -cp /tmp/musacad-acis-probe AcisDxfRoundTripProbe /tmp/musacad-r2018-asm-alias.dxf --public-fixture-debug | tee /tmp/musacad-r2018-asm-mesh.log; then
                echo 'MUSACAD_R2018_ASM_ALIAS_MESH_PROBE=1 (not B-Rep fidelity)'
              else
                echo 'MUSACAD_R2018_ASM_ALIAS_MESH_PROBE=0'
              fi
            else
              echo 'MUSACAD_R2018_ASM_ALIAS_SAT_TRANSPORT=0'
            fi
          else
            echo 'MUSACAD_R2018_ASM_ALIAS_SAT_TRANSPORT=0'
          fi
          echo 'OBSERVATIONAL ONLY: alias test must never be merged into the Android/native production decoder.'

  edit-regression:
    name: Android drawing and editing logic (no APK)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test drawing, snapping, selection and editable geometry
        run: |
          set -euo pipefail
          mkdir -p /tmp/musacad-edit-tests
          java_src=app/src/main/java/com/musa/cad
          javac -d /tmp/musacad-edit-tests "$java_src/SelectionBounds.java" tests/SelectionBoundsTest.java
          java -cp /tmp/musacad-edit-tests SelectionBoundsTest
          javac -d /tmp/musacad-edit-tests "$java_src/SnapPoints.java" tests/SnapPointsTest.java
          java -cp /tmp/musacad-edit-tests SnapPointsTest
          javac -d /tmp/musacad-edit-tests "$java_src/CadEdit.java" tests/CadEditStylusTest.java
          java -cp /tmp/musacad-edit-tests CadEditStylusTest
          javac -d /tmp/musacad-edit-tests "$java_src/CadEdit.java" "$java_src/SourceRange.java" tests/CadEditTransformTest.java
          java -cp /tmp/musacad-edit-tests CadEditTransformTest
          javac -d /tmp/musacad-edit-tests "$java_src/CadEdit.java" "$java_src/CadBlock.java" tests/CadBlockTest.java
          java -cp /tmp/musacad-edit-tests CadBlockTest
          javac -d /tmp/musacad-edit-tests "$java_src/CadEdit.java" "$java_src/CadDimension.java" tests/CadDimensionTest.java
          java -cp /tmp/musacad-edit-tests CadDimensionTest
          javac -d /tmp/musacad-edit-tests "$java_src/CadEdit.java" "$java_src/CadBlock.java" "$java_src/CadBlockLibrary.java" tests/CadBlockLibraryTest.java
          java -cp /tmp/musacad-edit-tests CadBlockLibraryTest
      - name: Stress streaming DXF with 70,000 entities (no APK)
        run: |
          set -euo pipefail
          java_src=app/src/main/java/com/musa/cad
          mkdir -p /tmp/musacad-large-stream
          javac -sourcepath app/src/main/java -d /tmp/musacad-large-stream tests/DxfStreamingLargeTest.java
          java -Xmx768m -cp /tmp/musacad-large-stream DxfStreamingLargeTest 70000
          java -Xmx768m -cp /tmp/musacad-large-stream DxfStreamingLargeTest 250000
      - name: Verify full ACI/TrueColor display values
        run: |
          mkdir -p /tmp/musacad-palette
          javac -d /tmp/musacad-palette app/src/main/java/com/musa/cad/DxfColor.java tests/DxfColorTest.java
          java -cp /tmp/musacad-palette DxfColorTest
      - name: Audit ACIS body/payload preservation without retaining geometry in RAM
        run: |
          mkdir -p /tmp/musacad-acis
          javac -sourcepath app/src/main/java -d /tmp/musacad-acis tests/DxfAcisCoverageTest.java
          java -cp /tmp/musacad-acis DxfAcisCoverageTest
      - name: Verify ACIS DWG-to-DXF diagnostics never claim unproven fidelity
        run: |
          mkdir -p /tmp/musacad-acis-diagnostic
          javac -d /tmp/musacad-acis-diagnostic app/src/main/java/com/musa/cad/DxfAcisCoverage.java app/src/main/java/com/musa/cad/AcisConversionDiagnostic.java tests/AcisConversionDiagnosticTest.java
          java -cp /tmp/musacad-acis-diagnostic AcisConversionDiagnosticTest
      - name: Verify genuine SAT edge fallback when faces are unsupported
        run: |
          mkdir -p /tmp/musacad-acis-sat
          javac -d /tmp/musacad-acis-sat app/src/main/java/com/musa/cad/AcisSatMesh.java tests/AcisSatMeshTest.java
          java -cp /tmp/musacad-acis-sat AcisSatMeshTest
      - name: Test 3D CAD mesh and missing ACIS face reporting
        run: |
          mkdir -p /tmp/musacad-full-3d-tests
          javac -sourcepath app/src/main/java -d /tmp/musacad-full-3d-tests tests/Dxf3dMeshTest.java
          java -cp /tmp/musacad-full-3d-tests Dxf3dMeshTest
          python3 - <<'PY'
          from pathlib import Path
          ui=Path('app/src/main/java/com/musa/cad/Mesh3dActivity.java').read_text()
          assert 'mesh.acisMissingGeometrySolids' in ui
          assert 'mesh.acisTessellatedFaces' in ui
          assert 'bu katılar görünümde YOK' in ui
          assert 'gerçek B-Rep kenarları gösterildi' not in ui
          print('PASS: 3D screen identifies missing rather than imaginary ACIS geometry')
          PY
      - name: Verify SOLID TRACE and 3DFACE geometry fidelity
        run: |
          mkdir -p /tmp/musacad-face
          javac -d /tmp/musacad-face app/src/main/java/com/musa/cad/DxfPlanarFace.java tests/DxfPlanarFaceTest.java
          java -cp /tmp/musacad-face DxfPlanarFaceTest
      - name: Test 3D polyline, polyface and polygon-mesh projection
        run: |
          mkdir -p /tmp/musacad-poly3d
          javac -d /tmp/musacad-poly3d app/src/main/java/com/musa/cad/DxfPolyline3D.java tests/DxfPolyline3DTest.java
          java -cp /tmp/musacad-poly3d DxfPolyline3DTest

  java-android-compile:
    name: Android CAD compile and navigation regression (no APK)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch pinned DWG source required by Android native build
        uses: actions/checkout@v4
        with:
          repository: LibreDWG/libredwg
          ref: 34f02f54b9aacb5708c1d3d2070efb3e4b2d8c43
          path: third_party/libredwg
      - name: Verify navigation hot path and unchanged full-fidelity renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          parser=Path('app/src/main/java/com/musa/cad/DxfParser.java').read_text()
          view=Path('app/src/main/java/com/musa/cad/CadView.java').read_text()
          assert 'MATRIX_SCALE_SCRATCH.get()' in parser
          assert '(linePattern==null||linePattern.continuous())?null' in parser
          assert 'spatialIndex.draw(canvas,navigationPaint' in parser
          assert 'vectorDrawing.drawVectorNavigation(c,imageMatrix' in view
          assert 'vectorDrawing.drawVector(c,imageMatrix' in view
          assert 'drawEdits(c);drawLiveFreehand(c)' in view
          activity=Path('app/src/main/java/com/musa/cad/MainActivity.java').read_text()
          assert 'loaded.sourceExternalAcisEntities=originalStats.acisExternalDataCount' in activity
          assert 'AcisConversionDiagnostic.status(' in activity
          assert 'activeDxf.acisCoverage' in activity
          acis=Path('app/src/main/java/com/musa/cad/AcisConversionDiagnostic.java').read_text()
