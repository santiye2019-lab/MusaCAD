name: License backend hardening gate

on:
  push:
    branches: [ main, 'gandalf/**' ]
    paths:
      - 'app/src/main/java/com/musa/cad/DeviceIdentityHash.java'
      - 'app/src/main/java/com/musa/cad/DeviceIdentity.java'
      - 'app/src/main/java/com/musa/cad/LicenseManager.java'
      - 'app/src/main/java/com/musa/cad/TrialPolicy.java'
      - 'app/src/main/java/com/musa/cad/SignedTrialPolicy.java'
      - 'app/src/main/java/com/musa/cad/TrialService.java'
      - 'app/src/main/java/com/musa/cad/TrialToken.java'
      - 'app/src/main/java/com/musa/cad/LicenseToken.java'
      - 'app/src/main/java/com/musa/cad/PlayBillingManager.java'
      - 'app/src/main/java/com/musa/cad/PlayPurchaseVerifier.java'
      - 'app/build.gradle'
      - 'tests/DeviceIdentityHashTest.java'
      - 'tests/SignedTrialPolicyTest.java'
      - 'tests/TrialTokenTest.java'
      - 'server/trial-worker/**'
      - '.github/workflows/trial-hardening.yml'
  workflow_dispatch:

jobs:
  trial-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test stable device identity
        run: |
          mkdir -p /tmp/musacad-trial-tests
          javac -d /tmp/musacad-trial-tests app/src/main/java/com/musa/cad/DeviceIdentityHash.java tests/DeviceIdentityHashTest.java
          java -cp /tmp/musacad-trial-tests DeviceIdentityHashTest
      - name: Test signed trial time policy
        run: |
          javac -d /tmp/musacad-trial-tests app/src/main/java/com/musa/cad/TrialPolicy.java app/src/main/java/com/musa/cad/SignedTrialPolicy.java tests/SignedTrialPolicyTest.java
          java -cp /tmp/musacad-trial-tests SignedTrialPolicyTest
      - name: Test separation of trial and paid tokens
        run: |
          javac -d /tmp/musacad-trial-tests app/src/main/java/com/musa/cad/LicenseToken.java app/src/main/java/com/musa/cad/TrialToken.java tests/TrialTokenTest.java
          java -cp /tmp/musacad-trial-tests TrialTokenTest
      - name: Check trial service source
        run: node --check server/trial-worker/src/index.js
      - name: Test trial and Google Play backend
        run: cd server/trial-worker && npm test
      - name: Check secure Play client routing
        run: |
          grep -q 'setObfuscatedAccountId(LicenseManager.installationId(context))' app/src/main/java/com/musa/cad/PlayBillingManager.java
          grep -q 'PlayPurchaseVerifier.verify(context,purchaseToken)' app/src/main/java/com/musa/cad/PlayBillingManager.java
          grep -q 'secureVerificationConfigured()' app/src/main/java/com/musa/cad/PlayBillingManager.java
          grep -q 'endpoint.startsWith("https://")' app/src/main/java/com/musa/cad/PlayBillingManager.java
          if grep -q 'acknowledgePurchase' app/src/main/java/com/musa/cad/PlayBillingManager.java; then exit 1; fi
