name: Gandalf AI staging validation
on:
  push:
    branches:
      - 'feature/**'
    paths:
      - 'server/ai-worker/**'
      - 'app/src/main/java/com/musa/cad/MusaGoogleDriveSync.java'
      - '.github/workflows/gandalf-ai-staging.yml'
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: "Deploy isolated staging Worker after tests (never production)"
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths:
      - 'server/ai-worker/**'
      - '.github/workflows/gandalf-ai-staging.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate AI Worker and Drive/DXF modules
        run: |
          cd server/ai-worker
          npm run check
          npm test
  staging-deploy:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_staging == 'true'
    runs-on: ubuntu-latest
    environment: gandalf-staging
    steps:
      - uses: actions/checkout@v4
      - name: Check isolated staging credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy isolated staging Worker
        working-directory: server/ai-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 deploy src/index.js \
            --name musacad-ai-staging \
            --compatibility-date 2025-04-01
      - name: Staging status
        run: |
          echo "Staging Worker uploaded; runtime AI provider and Drive broker bindings are not configured by this workflow."
          echo "Do not interpret deployment as a successful end-to-end analysis test."
