name: One-shot fit SPLINE patch

on:
  push:
    branches: [ fix-1b-hatch-geometry ]
    paths: [ '.github/workflows/patch-fit-spline-stage.yml' ]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-shot fit SPLINE workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-1b-hatch-geometry
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Patch fit-point SPLINE fallback
        run: python3 .github/scripts/patch_fit_spline_stage.py
      - name: Test curves and cumulative renderer regressions
        run: |
          rm -rf /tmp/musacad-fit && mkdir -p /tmp/musacad-fit
          javac -d /tmp/musacad-fit app/src/main/java/com/musa/cad/DxfCurves.java tests/DxfCurvesTest.java
          java -cp /tmp/musacad-fit DxfCurvesTest
          javac -d /tmp/musacad-fit app/src/main/java/com/musa/cad/DxfPolylineWidth.java tests/DxfPolylineWidthTest.java
          java -cp /tmp/musacad-fit DxfPolylineWidthTest
          javac -d /tmp/musacad-fit app/src/main/java/com/musa/cad/DxfDimStyles.java app/src/main/java/com/musa/cad/DxfLeader.java tests/DxfDimStylesTest.java tests/DxfLeaderTest.java
          java -cp /tmp/musacad-fit DxfDimStylesTest
          java -cp /tmp/musacad-fit DxfLeaderTest
          javac -d /tmp/musacad-fit app/src/main/java/com/musa/cad/DxfColor.java app/src/main/java/com/musa/cad/DxfStyle.java app/src/main/java/com/musa/cad/DxfLineTypes.java tests/DxfLineTypesTest.java
          java -cp /tmp/musacad-fit DxfLineTypesTest
          javac -d /tmp/musacad-fit app/src/main/java/com/musa/cad/DxfPolyMesh.java app/src/main/java/com/musa/cad/DxfFace.java tests/DxfPolyMeshTest.java tests/DxfFaceTest.java
          java -cp /tmp/musacad-fit DxfPolyMeshTest
          java -cp /tmp/musacad-fit DxfFaceTest
          javac -d /tmp/musacad-fit app/src/main/java/com/musa/cad/DxfVisibility.java tests/DxfVisibilityTest.java
          java -cp /tmp/musacad-fit DxfVisibilityTest
          javac -d /tmp/musacad-fit app/src/main/java/com/musa/cad/DxfUnits.java tests/DxfUnitsTest.java
          java -cp /tmp/musacad-fit DxfUnitsTest
          javac -d /tmp/musacad-fit app/src/main/java/com/musa/cad/DxfSnapGeometry.java tests/DxfSnapGeometryTest.java
          java -cp /tmp/musacad-fit DxfSnapGeometryTest
          javac -d /tmp/musacad-fit app/src/main/java/com/musa/cad/DxfColor.java app/src/main/java/com/musa/cad/DxfStyle.java app/src/main/java/com/musa/cad/DxfTransparency.java app/src/main/java/com/musa/cad/DxfDrawOrder.java app/src/main/java/com/musa/cad/DxfOcs.java app/src/main/java/com/musa/cad/DxfSpace.java app/src/main/java/com/musa/cad/DxfVisibility.java app/src/main/java/com/musa/cad/DxfBlocks.java tests/DxfBlocksTest.java
          java -cp /tmp/musacad-fit DxfBlocksTest
          javac -d /tmp/musacad-fit app/src/main/java/com/musa/cad/DxfViewport.java tests/DxfViewportTest.java
          java -cp /tmp/musacad-fit DxfViewportTest
          javac -d /tmp/musacad-fit app/src/main/java/com/musa/cad/DxfHatchPattern.java tests/DxfHatchPatternTest.java
          java -cp /tmp/musacad-fit DxfHatchPatternTest
          javac -d /tmp/musacad-fit app/src/main/java/com/musa/cad/DxfText.java app/src/main/java/com/musa/cad/DxfTextStyles.java app/src/main/java/com/musa/cad/DxfTextLayout.java tests/DxfTextTest.java tests/DxfTextStylesTest.java tests/DxfTextLayoutTest.java
          java -cp /tmp/musacad-fit DxfTextTest
          java -cp /tmp/musacad-fit DxfTextStylesTest
          java -cp /tmp/musacad-fit DxfTextLayoutTest
      - name: Fetch pinned LibreDWG for Android compile
        uses: actions/checkout@v4
        with:
          repository: LibreDWG/libredwg
          ref: 34f02f54b9aacb5708c1d3d2070efb3e4b2d8c43
          path: third_party/libredwg
      - name: Compile Android Java sources
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:compileDebugJavaWithJavac
      - name: Commit fit SPLINE support
        run: |
          git config user.name 'MusaCAD CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/musa/cad/DxfParser.java
          git commit -m 'Smooth fit-point SPLINE rendering'
          git push origin HEAD:fix-1b-hatch-geometry
