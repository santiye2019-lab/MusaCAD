name: MusaCAD shared native core portability

on:
  pull_request:
    branches: [main]
    paths:
      - 'core/native/**'
      - 'app/src/main/java/com/musa/cad/**'
      - 'tests/**'
      - '.github/workflows/android.yml'
      - '.github/workflows/cad-fast-regression.yml'
      - 'app/src/main/cpp/native_nurbs.h'
      - 'app/src/main/cpp/native_scene.c'
      - 'app/src/main/cpp/CMakeLists.txt'
      - '.github/workflows/cad-crossplatform-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-c-core:
    name: C ABI geometry • ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure portable core (no Android SDK, no LibreDWG)
        run: cmake -S core/native -B build/shared-core -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Compile portable C geometry
        run: cmake --build build/shared-core --config Debug --parallel 2
      - name: Run common C ABI rational NURBS regression
        run: ctest --test-dir build/shared-core -C Debug --output-on-failure
      - name: Check shared core ABI, Android adapter, and cross-platform PR contract
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s tests -p 'test_shared_core_portability_contract.py' -v

      - name: Cross-compile the SAME first-party CAD core for Android arm64 and x86_64 (no APK)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_NDK_HOME:-}" && -f "${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" ]]; then
            ndk="${ANDROID_NDK_HOME}"
          else
            sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
            test -d "$sdk/ndk"
            ndk="$(find "$sdk/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          fi
          test -n "$ndk"
          test -f "$ndk/build/cmake/android.toolchain.cmake"
          test -x "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          for abi in arm64-v8a x86_64; do
            build="build/shared-android-$abi"
            cmake -S core/native -B "$build" \
              -DCMAKE_TOOLCHAIN_FILE="$ndk/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$abi" -DANDROID_PLATFORM=android-24 \
              -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
            cmake --build "$build" --config Release --parallel 2
            archive="$build/libmusacad_core.a"
            test -s "$archive"
            "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" \
              --defined-only "$archive" > "$build/symbols.txt"
            grep -Eq '(^|[[:space:]])musa_bits_read
        run: cmake -S core/native/affine -B build/shared-affine -DCMAKE_BUILD_TYPE=Debug
      - name: Compile portable CAD affine operations
        run: cmake --build build/shared-affine --config Debug --parallel 2
      - name: Verify nested transform and reverse hit-test parity
        run: ctest --test-dir build/shared-affine -C Debug --output-on-failure


      - name: Check pre-existing legacy NURBS code uses identical canonical source (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -I app/src/main/cpp tests/native_nurbs_test.c -lm -o /tmp/musacad-legacy-nurbs-check
          /tmp/musacad-legacy-nurbs-check

      - name: Compile ALL shared core C sources for iOS arm64 (compile-only, no device claim)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          # Build the exact same C sources listed by the shared-core target, not
          # a manually selected subset that silently misses future CAD modules.
          python3 - <<'PY' > "$RUNNER_TEMP/musacad-core-ios-sources.txt"
          from pathlib import Path
          import re
          cmake = Path("core/native/CMakeLists.txt").read_text(encoding="utf-8")
          match = re.search(r"add_library\(musacad_core STATIC\s+(.*?)\)", cmake, re.S)
          if not match:
              raise SystemExit("Missing canonical shared C target")
          sources = re.findall(r"src/[A-Za-z0-9_]+\.c", match.group(1))
          if not sources or len(sources) != len(set(sources)):
              raise SystemExit("Shared core must have a unique, nonempty source inventory")
          tracked = {str(path.relative_to(Path("core/native"))) for path in Path("core/native/src").glob("*.c")}
          if set(sources) != tracked:
              raise SystemExit(f"Unregistered shared C sources: {sorted(tracked - set(sources))}")
          print("\n".join("core/native/" + source for source in sources))
          PY
          test -s "$RUNNER_TEMP/musacad-core-ios-sources.txt"
          compiled=0
          while IFS= read -r source; do
            test -f "$source"
            out="$RUNNER_TEMP/musacad-ios-$(basename "${source%.c}").o"
            xcrun --sdk iphoneos clang -std=c11 -arch arm64 -isysroot "$SDK" \
              -I core/native/include -c "$source" -o "$out"
            test -s "$out"
            compiled=$((compiled+1))
          done < "$RUNNER_TEMP/musacad-core-ios-sources.txt"
          test "$compiled" -gt 0
          echo "Compiled all $compiled common CAD core C units for iPhoneOS ARM64."
          # Also ensure the full original shared-core source set forms one
          # linkable static archive for the actual iPhoneOS target.
          archive="$RUNNER_TEMP/libmusacad_core-iphoneos-arm64.a"
          xcrun --sdk iphoneos ar -rcs "$archive" "$RUNNER_TEMP"/musacad-ios-*.o
          test -s "$archive"
          xcrun --sdk iphoneos nm -g "$archive" > "$RUNNER_TEMP/musacad-ios-core-symbols.txt"
          grep -Eq '_musa_bits_read
 "$build/symbols.txt"
            grep -Eq '(^|[[:space:]])musa_core_mesh_mass_verified_f32
        run: cmake -S core/native/affine -B build/shared-affine -DCMAKE_BUILD_TYPE=Debug
      - name: Compile portable CAD affine operations
        run: cmake --build build/shared-affine --config Debug --parallel 2
      - name: Verify nested transform and reverse hit-test parity
        run: ctest --test-dir build/shared-affine -C Debug --output-on-failure


      - name: Check pre-existing legacy NURBS code uses identical canonical source (Linux)
        if: runner.os == 'Linux'
