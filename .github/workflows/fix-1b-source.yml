name: Fix 1B source typo

on:
  push:
    branches: [ fix-1b-hatch-geometry ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-1b-hatch-geometry
      - name: Apply one-line source correction
        run: |
          if grep -q 'y1=b' app/src/main/java/com/musa/cad/DxfParser.java; then
            sed -i 's/x=a;y1=b;r=c/x=a;y=b;r=c/' app/src/main/java/com/musa/cad/DxfParser.java
          fi
      - name: Commit correction if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/musa/cad/DxfParser.java
          git commit -m 'Fix Circle constructor in 1B parser'
          git push origin HEAD:fix-1b-hatch-geometry
