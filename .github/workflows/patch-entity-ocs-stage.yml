name: One-shot entity OCS patch

on:
  push:
    branches: [ fix-1b-hatch-geometry ]
    paths: [ '.github/workflows/patch-entity-ocs-stage.yml' ]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-shot entity OCS patch workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-1b-hatch-geometry
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Patch planar entity OCS projection
        run: python3 .github/scripts/patch_entity_ocs_stage.py
      - name: Test OCS transforms and block expansion
        run: |
          rm -rf /tmp/musacad-ocs-test && mkdir -p /tmp/musacad-ocs-test
          javac -d /tmp/musacad-ocs-test app/src/main/java/com/musa/cad/DxfColor.java app/src/main/java/com/musa/cad/DxfStyle.java app/src/main/java/com/musa/cad/DxfOcs.java app/src/main/java/com/musa/cad/DxfBlocks.java tests/DxfOcsTest.java tests/DxfBlocksTest.java
          java -cp /tmp/musacad-ocs-test DxfOcsTest
          java -cp /tmp/musacad-ocs-test DxfBlocksTest
      - name: Fetch pinned LibreDWG for Android compile
        uses: actions/checkout@v4
        with:
          repository: LibreDWG/libredwg
          ref: 34f02f54b9aacb5708c1d3d2070efb3e4b2d8c43
          path: third_party/libredwg
      - name: Compile Android Java sources
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:compileDebugJavaWithJavac
      - name: Commit renderer patch
        run: |
          git config user.name 'MusaCAD CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/musa/cad/DxfParser.java
          git commit -m 'Project planar DXF entities from OCS to WCS'
          git push origin HEAD:fix-1b-hatch-geometry
