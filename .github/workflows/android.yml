name: Android APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned LibreDWG source
        uses: actions/checkout@v4
        with:
          repository: LibreDWG/libredwg
          ref: 34f02f54b9aacb5708c1d3d2070efb3e4b2d8c43
          path: third_party/libredwg
      - name: Build and smoke-test native converter
        run: |
          cmake -S app/src/main/cpp -B /tmp/musa-native -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/musa-native --parallel 2
          /tmp/musa-native/musacad_dwg_convert third_party/libredwg/test/test-data/example_2013.dwg /tmp/musa-smoke.dxf
          test -s /tmp/musa-smoke.dxf
          mkdir -p app/src/main/assets
          cp third_party/libredwg/COPYING app/src/main/assets/COPYING-LibreDWG.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test DXF text decoding
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfText.java tests/DxfTextTest.java
          java -cp /tmp/musacad-tests DxfTextTest
      - name: Test selection bounds
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/SelectionBounds.java tests/SelectionBoundsTest.java
          java -cp /tmp/musacad-tests SelectionBoundsTest
      - name: Test endpoint snapping
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/SnapPoints.java tests/SnapPointsTest.java tests/SnapIndexTest.java
          java -cp /tmp/musacad-tests SnapPointsTest
          java -cp /tmp/musacad-tests SnapIndexTest
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/MeasurementMath.java tests/MeasurementMathTest.java
          java -cp /tmp/musacad-tests MeasurementMathTest
      - name: Test DXF block expansion
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfBlocks.java app/src/main/java/com/musa/cad/DxfStream.java tests/DxfBlocksTest.java tests/DxfStreamTest.java
          java -cp /tmp/musacad-tests DxfBlocksTest
          java -Xmx64m -cp /tmp/musacad-tests DxfStreamTest
      - name: Test polyline arcs
        run: |
          javac -cp /tmp/musacad-tests -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfPolyline.java tests/DxfPolylineTest.java
          java -cp /tmp/musacad-tests DxfPolylineTest
      - name: Test cancellable file transfer
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/FileTransfer.java tests/FileTransferTest.java
          java -cp /tmp/musacad-tests FileTransferTest
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Build Android verification APK
        run: |
          mkdir -p app/src/androidTest/assets
          cp third_party/libredwg/test/test-data/example_2013.dwg app/src/androidTest/assets/reference.dwg
          ./gradlew --no-daemon assembleDebugAndroidTest
      - name: Verify on Android emulator
        timeout-minutes: 12
        run: |
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "system-images;android-35;google_apis;x86_64"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n musa-verify -k "system-images;android-35;google_apis;x86_64" --force
          "$ANDROID_HOME/emulator/emulator" -avd musa-verify -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > /tmp/musa-emulator.log 2>&1 &
          adb wait-for-device
          timeout 180 bash -c 'until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == "1" ]]; do sleep 2; done'
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          mkdir -p verification
          adb shell am instrument -w com.musa.cad.test/com.musa.cad.VerificationRunner | tee verification/instrumentation.txt
          grep -q MUSACAD_VERIFIED verification/instrumentation.txt
          adb exec-out run-as com.musa.cad tar -C files -cf - verification > verification/evidence.tar
      - name: Upload Android verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MusaCAD-Android-verification
          path: |
            verification/
            /tmp/musa-emulator.log
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MusaCAD-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Package corresponding source
        run: |
          tar --exclude='.git' --exclude='.cxx' --exclude='build' -czf /tmp/MusaCAD-source.tar.gz app third_party gradle gradlew build.gradle settings.gradle gradle.properties .github NATIVE_BUILD.md LICENSE README.md
      - name: Upload native converter and corresponding source
        uses: actions/upload-artifact@v4
        with:
          name: MusaCAD-native-and-source
          path: |
            /tmp/musa-native/musacad_dwg_convert
            /tmp/MusaCAD-source.tar.gz
