name: Android quality gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: musacad-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned LibreDWG source
        uses: actions/checkout@v4
        with:
          repository: LibreDWG/libredwg
          ref: 34f02f54b9aacb5708c1d3d2070efb3e4b2d8c43
          path: third_party/libredwg
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test DXF attribute visibility
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfAttributeVisibility.java tests/DxfAttributeVisibilityTest.java
          java -cp /tmp/musacad-tests DxfAttributeVisibilityTest
      - name: Test DXF text OCS placement
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfTextOcs.java tests/DxfTextOcsTest.java
          java -cp /tmp/musacad-tests DxfTextOcsTest
      - name: Test DXF text decoding
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfText.java tests/DxfTextTest.java
          java -cp /tmp/musacad-tests DxfTextTest
      - name: Test rich MTEXT formatting
