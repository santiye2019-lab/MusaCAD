name: Android quality gate

on:
  push:
    branches: [ main, 'gandalf/**' ]
  workflow_dispatch:

concurrency:
  group: musacad-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned LibreDWG source
        uses: actions/checkout@v4
        with:
          repository: LibreDWG/libredwg
          ref: 34f02f54b9aacb5708c1d3d2070efb3e4b2d8c43
          path: third_party/libredwg
      - name: Build and smoke-test native converter
        run: |
          cmake -S app/src/main/cpp -B /tmp/musa-native -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/musa-native --parallel 2
          /tmp/musa-native/musacad_dwg_convert third_party/libredwg/test/test-data/example_2013.dwg /tmp/musa-smoke.dxf
          test -s /tmp/musa-smoke.dxf
          mkdir -p app/src/main/assets
          cp third_party/libredwg/COPYING app/src/main/assets/COPYING-LibreDWG.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test DXF text decoding
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfText.java tests/DxfTextTest.java
          java -cp /tmp/musacad-tests DxfTextTest
      - name: Test selection bounds
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/SelectionBounds.java tests/SelectionBoundsTest.java
          java -cp /tmp/musacad-tests SelectionBoundsTest
      - name: Test endpoint snapping
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/SnapPoints.java tests/SnapPointsTest.java
          java -cp /tmp/musacad-tests SnapPointsTest
      - name: Test stylus freehand persistence
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/CadEdit.java tests/CadEditStylusTest.java
          java -cp /tmp/musacad-tests CadEditStylusTest
      - name: Test source entity edit transforms
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/CadEdit.java app/src/main/java/com/musa/cad/SourceRange.java tests/CadEditTransformTest.java
          java -cp /tmp/musacad-tests CadEditTransformTest
      - name: Test source entity edit session
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfLineStyle.java app/src/main/java/com/musa/cad/CadEdit.java app/src/main/java/com/musa/cad/SourceRange.java app/src/main/java/com/musa/cad/SourceReplacement.java app/src/main/java/com/musa/cad/SourceEditSession.java tests/SourceEditSessionTest.java
          java -cp /tmp/musacad-tests SourceEditSessionTest
      - name: Test DXF color palette
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfColor.java tests/DxfColorTest.java
          java -cp /tmp/musacad-tests DxfColorTest
      - name: Test DXF linetype and lineweight
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfLineStyle.java tests/DxfLineStyleTest.java
          java -cp /tmp/musacad-tests DxfLineStyleTest
      - name: Test DXF hatch boundaries and patterns
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfHatch.java tests/DxfHatchTest.java
          java -cp /tmp/musacad-tests DxfHatchTest
      - name: Test CAD print scale math
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/CadPrintMath.java tests/CadPrintMathTest.java
          java -cp /tmp/musacad-tests CadPrintMathTest
      - name: Test one-day trial policy
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/TrialPolicy.java tests/TrialPolicyTest.java
          java -cp /tmp/musacad-tests TrialPolicyTest
      - name: Test signed license tokens
        run: |
          javac -d /tmp/musacad-license-tests app/src/main/java/com/musa/cad/LicenseToken.java tests/LicenseTokenTest.java
          java -cp /tmp/musacad-license-tests LicenseTokenTest
      - name: Compile offline license generator
        run: |
          javac -d /tmp/musacad-license-tool app/src/main/java/com/musa/cad/LicenseToken.java tools/license-generator/LicenseGenerator.java tools/license-generator/LicenseGeneratorApp.java
          java -cp /tmp/musacad-license-tool LicenseGenerator >/tmp/license-generator-usage.txt || test $? -eq 2
          grep -q "MusaCAD License Generator" /tmp/license-generator-usage.txt
      - name: Test DXF block expansion, colors, styles and source origins
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfColor.java app/src/main/java/com/musa/cad/DxfLineStyle.java app/src/main/java/com/musa/cad/DxfBlocks.java tests/DxfBlocksTest.java
          java -cp /tmp/musacad-tests DxfBlocksTest
      - name: Test cancellable file transfer
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/FileTransfer.java tests/FileTransferTest.java
          java -cp /tmp/musacad-tests FileTransferTest
      - name: Android lint and unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon lintDebug testDebugUnitTest
      - name: Build debug and release variants
        run: |
          ./gradlew --no-daemon assembleDebug assembleRelease
      - name: Upload internal debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MusaCAD-internal-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Package corresponding source
        run: |
          tar --exclude='.git' --exclude='.cxx' --exclude='build' -czf /tmp/MusaCAD-source.tar.gz app third_party tools tests gradle gradlew build.gradle settings.gradle gradle.properties .github NATIVE_BUILD.md LICENSE README.md
      - name: Upload native converter and corresponding source
        uses: actions/upload-artifact@v4
        with:
          name: MusaCAD-native-and-source
          path: |
            /tmp/musa-native/musacad_dwg_convert
            /tmp/MusaCAD-source.tar.gz
