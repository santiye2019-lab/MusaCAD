name: Android quality gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_approved:
        description: "Final acceptance complete and APK creation explicitly approved"
        type: boolean
        required: false
        default: false

concurrency:
  group: musacad-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned LibreDWG source
        uses: actions/checkout@v4
        with:
          repository: LibreDWG/libredwg
          ref: 34f02f54b9aacb5708c1d3d2070efb3e4b2d8c43
          path: third_party/libredwg
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test guarded production trial Worker deployment invariants
        run: |
          python3 -m unittest discover -s tests -p 'test_trial_worker_deploy_guard.py' -v
          python3 - <<'PY'
          from pathlib import Path
          old=Path('.github/workflows/deploy-gandalf-ai.yml').read_text()
          new=Path('.github/workflows/deploy-license-worker-safe.yml').read_text()
          assert 'refreshing the existing trial Worker' not in old
          assert "Use the dedicated guarded license Worker workflow" in old
          for expected in ('--keep-vars', '--dry-run', 'DEPLOY_MUSACAD_TRIAL',
                           'trial_worker_deploy_guard.py', 'musacad-trial-api'):
              assert expected in new, expected
          print('PASS: License Worker deployment is explicit and guarded.')
          PY
      - name: Test Qwen vision response normalization and signed pilot approval gate
        run: |
          python3 -m unittest discover -s tests -p 'test_qwen_pilot_vision_preflight.py' -v
          python3 -m unittest discover -s tests -p 'test_qwen_vision_reply_validator.py' -v
      - name: Test Gandalf AI Worker including provider timeout
        run: |
          node --check server/ai-worker/src/index.js
          node --test server/ai-worker/test.mjs
      - name: P0 Android app must not link or invoke LibreDWG
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_android_firstparty_runtime.py' -v
          python3 -m unittest discover -s tests -p 'test_original_dwg_2d_diagnostic_isolation.py' -v
      - name: MC1032 own-engine v1-v2 lossless migration JNI and no-core proof
        run: |
          set -euo pipefail
          mkdir -p /tmp/musacad-mc1032-migrate-java
          javac -encoding UTF-8 -d /tmp/musacad-mc1032-migrate-java \
            app/src/main/java/com/musa/cad/Mc1032Native.java \
            app/src/main/java/com/musa/cad/Mc1032V2Native.java \
            app/src/main/java/com/musa/cad/Mc1032Migration.java \
            tests/Mc1032MigrationTest.java tests/Mc1032MigrationMissingCoreTest.java
          java -cp /tmp/musacad-mc1032-migrate-java Mc1032MigrationMissingCoreTest
          bash tests/build_mc1032_migrate_jni_host.sh
          java -Djava.library.path=/tmp/musacad-mc1032-migrate \
            -cp /tmp/musacad-mc1032-migrate-java Mc1032MigrationTest
      - name: MC1032 rev2 native layers 3D JNI and old-core refusal
        run: |
          set -euo pipefail
          mkdir -p /tmp/musacad-mc1032-v2-java
          javac -encoding UTF-8 -d /tmp/musacad-mc1032-v2-java \
            app/src/main/java/com/musa/cad/Mc1032V2Native.java \
            tests/Mc1032V2NativeTest.java tests/Mc1032V2MissingCoreTest.java
          java -cp /tmp/musacad-mc1032-v2-java Mc1032V2MissingCoreTest
          bash tests/build_mc1032_v2_jni_host.sh
          java -Djava.library.path=/tmp/musacad-mc1032-v2-host \
            -cp /tmp/musacad-mc1032-v2-java Mc1032V2NativeTest
      - name: MC1032 first-party binary JNI read/write, corruption and missing-core proof
        run: |
          set -euo pipefail
          mkdir -p /tmp/musacad-mc1032-java
          javac -encoding UTF-8 -d /tmp/musacad-mc1032-java \
            app/src/main/java/com/musa/cad/Mc1032Native.java \
            tests/Mc1032NativeTest.java tests/Mc1032MissingCoreTest.java
          java -cp /tmp/musacad-mc1032-java Mc1032MissingCoreTest
          bash tests/build_mc1032_jni_host.sh
          java -Djava.library.path=/tmp/musacad-mc1032-host \
            -cp /tmp/musacad-mc1032-java Mc1032NativeTest
      - name: P0 shared native saved DXF handle-set JNI and no-core regression
        run: |
          set -euo pipefail
          mkdir -p /tmp/musacad-native-saved-handles
          javac -encoding UTF-8 -d /tmp/musacad-native-saved-handles \
            app/src/main/java/com/musa/cad/DxfSavedHandleSet.java \
            tests/DxfSavedHandleSetTest.java tests/DxfSavedHandleSetMissingCoreTest.java
          java -cp /tmp/musacad-native-saved-handles DxfSavedHandleSetMissingCoreTest
          bash tests/build_dxf_handle_jni_host.sh
          java -Djava.library.path=/tmp/musacad-dxf-handle-host -cp /tmp/musacad-native-saved-handles DxfSavedHandleSetTest
      - name: P0 portable DXF bytes-to-lines JNI and missing-core contract
        run: |
          set -euo pipefail
          mkdir -p /tmp/musacad-dxf-line-jni
          javac -encoding UTF-8 -d /tmp/musacad-dxf-line-jni \
            app/src/main/java/com/musa/cad/FileTransfer.java \
            app/src/main/java/com/musa/cad/DxfPortableLines.java \
            tests/DxfPortableLinesTest.java tests/DxfPortableLinesMissingCoreTest.java
          java -cp /tmp/musacad-dxf-line-jni DxfPortableLinesMissingCoreTest
          bash tests/build_dxf_handle_jni_host.sh
          java -Djava.library.path=/tmp/musacad-dxf-handle-host -cp /tmp/musacad-dxf-line-jni DxfPortableLinesTest
      - name: P0 seekable DXF source record reader uses one portable C framer
        run: |
          set -euo pipefail
          mkdir -p /tmp/musacad-stream-seek-native
          javac -encoding UTF-8 -d /tmp/musacad-stream-seek-native \
            app/src/main/java/com/musa/cad/FileTransfer.java \
            app/src/main/java/com/musa/cad/DxfColor.java \
            app/src/main/java/com/musa/cad/DxfLineStyle.java \
            app/src/main/java/com/musa/cad/DxfLineTypeParser.java \
            app/src/main/java/com/musa/cad/DxfTextStyle.java \
            app/src/main/java/com/musa/cad/DxfGroupCode.java \
            app/src/main/java/com/musa/cad/DxfPortableLines.java \
            app/src/main/java/com/musa/cad/DxfStream.java \
            app/src/main/java/com/musa/cad/DxfLayerState.java \
            app/src/main/java/com/musa/cad/DxfBlocks.java \
            tests/DxfStreamNativeSeekTest.java tests/DxfStreamMissingCoreTest.java
          java -cp /tmp/musacad-stream-seek-native DxfStreamMissingCoreTest
          bash tests/build_dxf_handle_jni_host.sh
          java -Djava.library.path=/tmp/musacad-dxf-handle-host -cp /tmp/musacad-stream-seek-native DxfStreamNativeSeekTest
      - name: Native ARC culling uses exact bounded sub-arc envelopes (Android UI only)
        run: |
          javac -encoding UTF-8 -d /tmp/musacad-native-arc-cull \
            app/src/main/java/com/musa/cad/NativeSceneViewportBounds.java \
            tests/NativeArcCullingBoundsTest.java
          java -cp /tmp/musacad-native-arc-cull com.musa.cad.NativeArcCullingBoundsTest
          grep -q 'NativeSceneViewportBounds.arcCullingBounds(' app/src/main/java/com/musa/cad/NativeScene.java
      - name: Test DXF attribute visibility
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfAttributeVisibility.java tests/DxfAttributeVisibilityTest.java
          java -cp /tmp/musacad-tests DxfAttributeVisibilityTest
      - name: Test DXF text OCS placement
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfTextOcs.java tests/DxfTextOcsTest.java
