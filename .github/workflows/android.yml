name: Android quality gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: musacad-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned LibreDWG source
        uses: actions/checkout@v4
        with:
          repository: LibreDWG/libredwg
          ref: 34f02f54b9aacb5708c1d3d2070efb3e4b2d8c43
          path: third_party/libredwg
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test DXF text decoding
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfText.java tests/DxfTextTest.java
          java -cp /tmp/musacad-tests DxfTextTest
      - name: Test rich MTEXT formatting
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfMText.java tests/DxfMTextTest.java
          java -cp /tmp/musacad-tests DxfMTextTest
      - name: Test selection bounds
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/SelectionBounds.java tests/SelectionBoundsTest.java
          java -cp /tmp/musacad-tests SelectionBoundsTest
      - name: Test endpoint snapping
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/SnapPoints.java tests/SnapPointsTest.java
          java -cp /tmp/musacad-tests SnapPointsTest
      - name: Test stylus freehand persistence
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/CadEdit.java tests/CadEditStylusTest.java
          java -cp /tmp/musacad-tests CadEditStylusTest
      - name: Test source entity edit transforms
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/CadEdit.java app/src/main/java/com/musa/cad/SourceRange.java tests/CadEditTransformTest.java
          java -cp /tmp/musacad-tests CadEditTransformTest
      - name: Test block and insert geometry
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/CadEdit.java app/src/main/java/com/musa/cad/CadBlock.java tests/CadBlockTest.java
          java -cp /tmp/musacad-tests CadBlockTest
      - name: Test dimension geometry
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/CadEdit.java app/src/main/java/com/musa/cad/CadDimension.java tests/CadDimensionTest.java
          java -cp /tmp/musacad-tests CadDimensionTest
      - name: Test command routing
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/CadCommand.java tests/CadCommandTest.java
          java -cp /tmp/musacad-tests CadCommandTest
      - name: Test source entity edit session
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfLineStyle.java app/src/main/java/com/musa/cad/CadEdit.java app/src/main/java/com/musa/cad/SourceRange.java app/src/main/java/com/musa/cad/SourceReplacement.java app/src/main/java/com/musa/cad/SourceEditSession.java tests/SourceEditSessionTest.java
          java -cp /tmp/musacad-tests SourceEditSessionTest
      - name: Test command routing completeness
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/CadCommand.java tests/CadCommandTest.java
          java -cp /tmp/musacad-tests CadCommandTest
      - name: Test reference UI tool parity
        run: |
          javac -d /tmp/musacad-tests tests/ReferenceToolParityTest.java
          java -cp /tmp/musacad-tests ReferenceToolParityTest
      - name: Test DXF color palette
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfColor.java tests/DxfColorTest.java
          java -cp /tmp/musacad-tests DxfColorTest
      - name: Test DXF text styles and font metadata
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfTextStyle.java tests/DxfTextStyleTest.java
          java -cp /tmp/musacad-tests DxfTextStyleTest
      - name: Test DXF TEXT alignment modes
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfTextAlign.java tests/DxfTextAlignTest.java
          java -cp /tmp/musacad-tests DxfTextAlignTest
      - name: Test DXF polyline bulge arcs
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfBulge.java tests/DxfBulgeTest.java
          java -cp /tmp/musacad-tests DxfBulgeTest
      - name: Test DXF NURBS spline geometry
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfSpline.java tests/DxfSplineTest.java
          java -cp /tmp/musacad-tests DxfSplineTest
      - name: Test DXF linetype and lineweight
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfLineStyle.java tests/DxfLineStyleTest.java
          java -cp /tmp/musacad-tests DxfLineStyleTest
      - name: Test DXF complex linetype metadata
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfLineStyle.java app/src/main/java/com/musa/cad/DxfLineTypeParser.java tests/DxfComplexLineTypeTest.java
          java -cp /tmp/musacad-tests DxfComplexLineTypeTest
      - name: Test DXF complex linetype text placement
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfLineStyle.java app/src/main/java/com/musa/cad/DxfComplexLineText.java tests/DxfComplexLineTextTest.java
          java -cp /tmp/musacad-tests DxfComplexLineTextTest
      - name: Test DXF hatch boundaries and patterns
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfHatch.java tests/DxfHatchTest.java
          java -cp /tmp/musacad-tests DxfHatchTest
      - name: Test DXF multileader decoding
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfMLeader.java tests/DxfMLeaderTest.java
          java -cp /tmp/musacad-tests DxfMLeaderTest
      - name: Test DXF wipeout clipping
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfWipeout.java tests/DxfWipeoutTest.java
          java -cp /tmp/musacad-tests DxfWipeoutTest
      - name: Test DXF paper-space viewport geometry
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfViewport.java tests/DxfViewportTest.java
          java -cp /tmp/musacad-tests DxfViewportTest
      - name: Test CAD print scale math
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/CadPrintMath.java tests/CadPrintMathTest.java
          java -cp /tmp/musacad-tests CadPrintMathTest
      - name: Test one-day trial policy
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/TrialPolicy.java tests/TrialPolicyTest.java
          java -cp /tmp/musacad-tests TrialPolicyTest
      - name: Test stable hashed license identity
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DeviceIdentityHash.java tests/DeviceIdentityHashTest.java
          java -cp /tmp/musacad-tests DeviceIdentityHashTest
      - name: Test signed license tokens
        run: |
          javac -d /tmp/musacad-license-tests app/src/main/java/com/musa/cad/LicenseToken.java tests/LicenseTokenTest.java
          java -cp /tmp/musacad-license-tests LicenseTokenTest
      - name: Check trial service source
        run: node --check server/trial-worker/src/index.js
      - name: Compile offline license generator
        run: |
          javac -d /tmp/musacad-license-tool app/src/main/java/com/musa/cad/LicenseToken.java tools/license-generator/LicenseGenerator.java tools/license-generator/LicenseGeneratorApp.java
          java -cp /tmp/musacad-license-tool LicenseGenerator >/tmp/license-generator-usage.txt || test $? -eq 2
          grep -q "MusaCAD License Generator" /tmp/license-generator-usage.txt
      - name: Test displayed device ID to offline license round trip
        run: |
          grep -q 'LicenseManager.installationId(this)' app/src/main/java/com/musa/cad/LicenseActivity.java
          grep -q 'Cihaz / Lisans Kimliği' app/src/main/java/com/musa/cad/LicenseActivity.java
          javac -d /tmp/musacad-license-roundtrip app/src/main/java/com/musa/cad/LicenseToken.java tools/license-generator/LicenseGenerator.java tests/LicenseGeneratorRoundTripTest.java
          java -cp /tmp/musacad-license-roundtrip LicenseGeneratorRoundTripTest
      - name: Test secure Google Play entitlement flow
        run: |
          grep -q 'setObfuscatedAccountId(LicenseManager.installationId(context))' app/src/main/java/com/musa/cad/PlayBillingManager.java
          grep -q 'PlayPurchaseVerifier.verify(context,purchaseToken)' app/src/main/java/com/musa/cad/PlayBillingManager.java
          grep -q 'PLAY_VERIFY_URL' app/build.gradle
          if grep -q 'acknowledgePurchase' app/src/main/java/com/musa/cad/PlayBillingManager.java; then
            echo "Client-side purchase acknowledgement must not be used when secure backend verification is enabled"
            exit 1
          fi
          cd server/trial-worker
          npm test
      - name: Test DXF block expansion, colors, styles and source origins
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/FileTransfer.java app/src/main/java/com/musa/cad/DxfColor.java app/src/main/java/com/musa/cad/DxfLineStyle.java app/src/main/java/com/musa/cad/DxfLineTypeParser.java app/src/main/java/com/musa/cad/DxfTextStyle.java app/src/main/java/com/musa/cad/DxfStream.java app/src/main/java/com/musa/cad/DxfBlocks.java tests/DxfBlocksTest.java
          java -cp /tmp/musacad-tests DxfBlocksTest
      - name: Test 3D DXF surface geometry
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/FileTransfer.java app/src/main/java/com/musa/cad/DxfColor.java app/src/main/java/com/musa/cad/DxfLineStyle.java app/src/main/java/com/musa/cad/DxfLineTypeParser.java app/src/main/java/com/musa/cad/DxfTextStyle.java app/src/main/java/com/musa/cad/DxfStream.java app/src/main/java/com/musa/cad/DxfBlocks.java app/src/main/java/com/musa/cad/Dxf3dMesh.java app/src/main/java/com/musa/cad/Dxf3dEditor.java tests/Dxf3dMeshTest.java
          java -cp /tmp/musacad-tests Dxf3dMeshTest
      - name: Test cancellable file transfer
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/FileTransfer.java tests/FileTransferTest.java
          java -cp /tmp/musacad-tests FileTransferTest
      - name: Test large DXF streaming under bounded heap
        run: |
          javac -d /tmp/musacad-tests \
            app/src/main/java/com/musa/cad/FileTransfer.java \
            app/src/main/java/com/musa/cad/DxfColor.java \
            app/src/main/java/com/musa/cad/DxfLineStyle.java \
            app/src/main/java/com/musa/cad/DxfLineTypeParser.java \
            app/src/main/java/com/musa/cad/DxfTextStyle.java \
            app/src/main/java/com/musa/cad/DxfStream.java \
            app/src/main/java/com/musa/cad/DxfBlocks.java \
            tests/DxfStreamingLargeTest.java
          java -Xmx64m -cp /tmp/musacad-tests DxfStreamingLargeTest
      - name: Android lint and unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon lintDebug testDebugUnitTest compileReleaseJavaWithJavac
      - name: Build and smoke-test native converter
        run: |
          cmake -S app/src/main/cpp -B /tmp/musa-native -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/musa-native --parallel 2
          /tmp/musa-native/musacad_dwg_convert third_party/libredwg/test/test-data/example_2013.dwg /tmp/musa-smoke.dxf
          test -s /tmp/musa-smoke.dxf
          mkdir -p app/src/main/assets
          cp third_party/libredwg/COPYING app/src/main/assets/COPYING-LibreDWG.txt
      - name: Build approved installable MusaCAD APK
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-apk]')) }}
        run: |
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/MusaCAD-latest.apk
          test -s /tmp/MusaCAD-latest.apk
      - name: Upload approved MusaCAD APK
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-apk]')) }}
        uses: actions/upload-artifact@v4
        with:
          name: MusaCAD-installable-apk
          path: /tmp/MusaCAD-latest.apk
          if-no-files-found: error
      - name: Package corresponding source
        run: |
          tar --exclude='.git' --exclude='.cxx' --exclude='build' -czf /tmp/MusaCAD-source.tar.gz app third_party tools tests server gradle gradlew build.gradle settings.gradle gradle.properties .github NATIVE_BUILD.md LICENSE README.md
      - name: Upload native converter and corresponding source
        uses: actions/upload-artifact@v4
        with:
          name: MusaCAD-native-and-source
          path: |
            /tmp/musa-native/musacad_dwg_convert
            /tmp/MusaCAD-source.tar.gz
