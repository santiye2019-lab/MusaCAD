      - name: Build and smoke-test native converter
        run: |
          cmake -S app/src/main/cpp -B /tmp/musa-native -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/musa-native --parallel 2
          /tmp/musa-native/musacad_dwg_convert third_party/libredwg/test/test-data/example_2013.dwg /tmp/musa-smoke.dxf
          test -s /tmp/musa-smoke.dxf
          # Real DWG -> DXF OLE regression: preserve the embedded OLE2FRAME payload
          # so MusaCAD can render an Excel/Word/PowerPoint/PDF presentation preview.
          /tmp/musa-native/musacad_dwg_convert third_party/libredwg/test/test-data/2000/TS1.dwg /tmp/musa-ole.dxf
          python3 - <<'PY'
          from pathlib import Path
          text=Path("/tmp/musa-ole.dxf").read_text(errors="ignore")
          pairs=[line.strip() for line in text.replace("\r","").split("\n")]
          ole=False
          payload=False
          for i in range(0,len(pairs)-1,2):
              code,value=pairs[i],pairs[i+1]
              if code=="0":
                  ole=value.upper()=="OLE2FRAME"
              elif ole and code=="310" and value.strip():
                  payload=True
                  break
          assert "OLE2FRAME" in text, "Converted DWG lost OLE2FRAME entity"
          assert payload, "Converted DWG lost OLE2FRAME group-310 embedded payload"
          print("Native DWG OLE payload preservation passed")
          PY
          mkdir -p app/src/main/assets
          cp third_party/libredwg/COPYING app/src/main/assets/COPYING-LibreDWG.txt
      - name: Build approved installable MusaCAD APK
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-apk]')) }}
        run: |
          ./gradlew --no-daemon assembleDirectDebug
          cp app/build/outputs/apk/direct/debug/app-direct-debug.apk /tmp/MusaCAD-latest.apk
          test -s /tmp/MusaCAD-latest.apk
      - name: Upload approved MusaCAD APK
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-apk]')) }}
        uses: actions/upload-artifact@v4
        with:
          name: MusaCAD-installable-apk
          path: /tmp/MusaCAD-latest.apk
          if-no-files-found: error
      - name: Package corresponding source
        run: |
          tar --exclude='.git' --exclude='.cxx' --exclude='build' -czf /tmp/MusaCAD-source.tar.gz app licensemanager third_party tools tests server gradle gradlew build.gradle settings.gradle gradle.properties .github NATIVE_BUILD.md LICENSE README.md RELEASE_SIGNING.md DEVICE_FINAL_QA.md LICENSE_MANAGER.md PRODUCTION_SETUP.md
      - name: Upload native converter and corresponding source
        uses: actions/upload-artifact@v4
        with:
          name: MusaCAD-native-and-source
          path: |
            /tmp/musa-native/musacad_dwg_convert
            /tmp/MusaCAD-source.tar.gz
