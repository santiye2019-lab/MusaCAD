name: Android APK

on:
  push:
    branches: [ main, fix-1a-dwg-open-reliability ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned LibreDWG source
        uses: actions/checkout@v4
        with:
          repository: LibreDWG/libredwg
          ref: 34f02f54b9aacb5708c1d3d2070efb3e4b2d8c43
          path: third_party/libredwg
      - name: Build and smoke-test native converter
        run: |
          cmake -S app/src/main/cpp -B /tmp/musa-native -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/musa-native --parallel 2
          /tmp/musa-native/musacad_dwg_convert third_party/libredwg/test/test-data/example_2013.dwg /tmp/musa-smoke.dxf
          test -s /tmp/musa-smoke.dxf
          mkdir -p app/src/main/assets
          cp third_party/libredwg/COPYING app/src/main/assets/COPYING-LibreDWG.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test DXF text decoding, styles and alignment
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfText.java app/src/main/java/com/musa/cad/DxfTextStyles.java app/src/main/java/com/musa/cad/DxfTextLayout.java tests/DxfTextTest.java tests/DxfTextStylesTest.java tests/DxfTextLayoutTest.java
          java -cp /tmp/musacad-tests DxfTextTest
          java -cp /tmp/musacad-tests DxfTextStylesTest
          java -cp /tmp/musacad-tests DxfTextLayoutTest
      - name: Test selection bounds
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/SelectionBounds.java tests/SelectionBoundsTest.java
          java -cp /tmp/musacad-tests SelectionBoundsTest
      - name: Test endpoint snapping
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/SnapPoints.java tests/SnapPointsTest.java
          java -cp /tmp/musacad-tests SnapPointsTest
      - name: Test CAD snap geometry
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfSnapGeometry.java tests/DxfSnapGeometryTest.java
          java -cp /tmp/musacad-tests DxfSnapGeometryTest
      - name: Test DXF entity visibility
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfVisibility.java tests/DxfVisibilityTest.java
          java -cp /tmp/musacad-tests DxfVisibilityTest
      - name: Test classic mesh and 3DFACE geometry
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfPolyMesh.java app/src/main/java/com/musa/cad/DxfFace.java tests/DxfPolyMeshTest.java tests/DxfFaceTest.java
          java -cp /tmp/musacad-tests DxfPolyMeshTest
          java -cp /tmp/musacad-tests DxfFaceTest
      - name: Test DXF drawing units
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfUnits.java tests/DxfUnitsTest.java
          java -cp /tmp/musacad-tests DxfUnitsTest
      - name: Test DXF colors
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfColor.java tests/DxfColorTest.java
          java -cp /tmp/musacad-tests DxfColorTest
      - name: Test DXF layer table
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfColor.java app/src/main/java/com/musa/cad/DxfStyle.java app/src/main/java/com/musa/cad/DxfTransparency.java app/src/main/java/com/musa/cad/DxfLayerTable.java tests/DxfLayerTableTest.java
          java -cp /tmp/musacad-tests DxfLayerTableTest
      - name: Test DXF display styles
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfColor.java app/src/main/java/com/musa/cad/DxfStyle.java app/src/main/java/com/musa/cad/DxfLineTypes.java app/src/main/java/com/musa/cad/DxfWipeout.java tests/DxfStyleTest.java tests/DxfLineTypesTest.java tests/DxfWipeoutTest.java
          java -cp /tmp/musacad-tests DxfStyleTest
          java -cp /tmp/musacad-tests DxfLineTypesTest
          java -cp /tmp/musacad-tests DxfWipeoutTest
      - name: Test DXF curved geometry
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfCurves.java tests/DxfCurvesTest.java
          java -cp /tmp/musacad-tests DxfCurvesTest
      - name: Test DXF geometric and variable polyline widths
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfPolylineWidth.java tests/DxfPolylineWidthTest.java
          java -cp /tmp/musacad-tests DxfPolylineWidthTest
      - name: Test classic LEADER geometry
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfCurves.java app/src/main/java/com/musa/cad/DxfDimStyles.java app/src/main/java/com/musa/cad/DxfLeader.java tests/DxfDimStylesTest.java tests/DxfLeaderTest.java
          java -cp /tmp/musacad-tests DxfDimStylesTest
          java -cp /tmp/musacad-tests DxfLeaderTest
      - name: Test DXF RAY and XLINE clipping
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfInfiniteLine.java tests/DxfInfiniteLineTest.java
          java -cp /tmp/musacad-tests DxfInfiniteLineTest
      - name: Test DXF MULTILEADER context parsing
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfMLeader.java tests/DxfMLeaderTest.java
          java -cp /tmp/musacad-tests DxfMLeaderTest
      - name: Test DXF HATCH pattern geometry
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfHatchPattern.java tests/DxfHatchPatternTest.java
          java -cp /tmp/musacad-tests DxfHatchPatternTest
      - name: Test DXF transparency and draw order
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfColor.java app/src/main/java/com/musa/cad/DxfTransparency.java app/src/main/java/com/musa/cad/DxfDrawOrder.java tests/DxfTransparencyTest.java tests/DxfDrawOrderTest.java
          java -cp /tmp/musacad-tests DxfTransparencyTest
          java -cp /tmp/musacad-tests DxfDrawOrderTest
      - name: Test DXF model and paper spaces
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfSpace.java tests/DxfSpaceTest.java
          java -cp /tmp/musacad-tests DxfSpaceTest
      - name: Test DXF paper viewports
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfViewport.java tests/DxfViewportTest.java
          java -cp /tmp/musacad-tests DxfViewportTest
      - name: Test DXF OCS transforms
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfOcs.java tests/DxfOcsTest.java
          java -cp /tmp/musacad-tests DxfOcsTest
      - name: Test DXF block expansion and real-drawing ceiling
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/DxfColor.java app/src/main/java/com/musa/cad/DxfStyle.java app/src/main/java/com/musa/cad/DxfTransparency.java app/src/main/java/com/musa/cad/DxfDrawOrder.java app/src/main/java/com/musa/cad/DxfOcs.java app/src/main/java/com/musa/cad/DxfSpace.java app/src/main/java/com/musa/cad/DxfVisibility.java app/src/main/java/com/musa/cad/DxfBlocks.java tests/DxfBlocksTest.java tests/DxfExpansionLimitTest.java
          java -cp /tmp/musacad-tests DxfBlocksTest
          java -cp /tmp/musacad-tests DxfExpansionLimitTest
      - name: Test cancellable file transfer
        run: |
          javac -d /tmp/musacad-tests app/src/main/java/com/musa/cad/FileTransfer.java tests/FileTransferTest.java
          java -cp /tmp/musacad-tests FileTransferTest
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MusaCAD-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Package corresponding source
        run: |
          tar --exclude='.git' --exclude='.cxx' --exclude='build' -czf /tmp/MusaCAD-source.tar.gz app third_party gradle gradlew build.gradle settings.gradle gradle.properties .github NATIVE_BUILD.md LICENSE README.md
      - name: Upload native converter and corresponding source
        uses: actions/upload-artifact@v4
        with:
          name: MusaCAD-native-and-source
          path: |
            /tmp/musa-native/musacad_dwg_convert
            /tmp/MusaCAD-source.tar.gz
