name: One-shot INSERT OCS patch

on:
  push:
    branches: [ fix-1b-hatch-geometry ]
    paths: [ '.github/workflows/patch-insert-stage.yml' ]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-shot INSERT OCS patch workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-1b-hatch-geometry
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Patch streaming INSERT handling and CI
        run: python3 .github/scripts/patch_insert_stage.py
      - name: Test OCS transforms and block expansion
        run: |
          rm -rf /tmp/musacad-insert-test && mkdir -p /tmp/musacad-insert-test
          javac -d /tmp/musacad-insert-test app/src/main/java/com/musa/cad/DxfColor.java app/src/main/java/com/musa/cad/DxfStyle.java app/src/main/java/com/musa/cad/DxfOcs.java app/src/main/java/com/musa/cad/DxfBlocks.java tests/DxfOcsTest.java tests/DxfBlocksTest.java
          java -cp /tmp/musacad-insert-test DxfOcsTest
          java -cp /tmp/musacad-insert-test DxfBlocksTest
      - name: Commit renderer patch
        run: |
          git config user.name 'MusaCAD CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/musa/cad/DxfParser.java .github/workflows/android.yml
          git commit -m 'Render INSERT arrays and OCS extrusion projection'
          git push origin HEAD:fix-1b-hatch-geometry
