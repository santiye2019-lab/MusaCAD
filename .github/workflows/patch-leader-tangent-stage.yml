name: One-shot LEADER tangent patch

on:
  push:
    branches: [ fix-1b-hatch-geometry ]
    paths: [ '.github/workflows/patch-leader-tangent-stage.yml' ]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-shot LEADER tangent workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-1b-hatch-geometry
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Patch stored LEADER end tangents
        run: python3 .github/scripts/patch_leader_tangent_stage.py
      - name: Test LEADER tangents and cumulative renderer regressions
        run: |
          rm -rf /tmp/musacad-ltangent && mkdir -p /tmp/musacad-ltangent
          javac -d /tmp/musacad-ltangent app/src/main/java/com/musa/cad/DxfCurves.java app/src/main/java/com/musa/cad/DxfDimStyles.java app/src/main/java/com/musa/cad/DxfLeader.java tests/DxfCurvesTest.java tests/DxfDimStylesTest.java tests/DxfLeaderTest.java
          java -cp /tmp/musacad-ltangent DxfCurvesTest
          java -cp /tmp/musacad-ltangent DxfDimStylesTest
          java -cp /tmp/musacad-ltangent DxfLeaderTest
          javac -d /tmp/musacad-ltangent app/src/main/java/com/musa/cad/DxfInfiniteLine.java tests/DxfInfiniteLineTest.java
          java -cp /tmp/musacad-ltangent DxfInfiniteLineTest
          javac -d /tmp/musacad-ltangent app/src/main/java/com/musa/cad/DxfPolylineWidth.java tests/DxfPolylineWidthTest.java
          java -cp /tmp/musacad-ltangent DxfPolylineWidthTest
          javac -d /tmp/musacad-ltangent app/src/main/java/com/musa/cad/DxfColor.java app/src/main/java/com/musa/cad/DxfStyle.java app/src/main/java/com/musa/cad/DxfLineTypes.java tests/DxfLineTypesTest.java
          java -cp /tmp/musacad-ltangent DxfLineTypesTest
          javac -d /tmp/musacad-ltangent app/src/main/java/com/musa/cad/DxfPolyMesh.java app/src/main/java/com/musa/cad/DxfFace.java tests/DxfPolyMeshTest.java tests/DxfFaceTest.java
          java -cp /tmp/musacad-ltangent DxfPolyMeshTest
          java -cp /tmp/musacad-ltangent DxfFaceTest
          javac -d /tmp/musacad-ltangent app/src/main/java/com/musa/cad/DxfVisibility.java tests/DxfVisibilityTest.java
          java -cp /tmp/musacad-ltangent DxfVisibilityTest
          javac -d /tmp/musacad-ltangent app/src/main/java/com/musa/cad/DxfUnits.java tests/DxfUnitsTest.java
          java -cp /tmp/musacad-ltangent DxfUnitsTest
          javac -d /tmp/musacad-ltangent app/src/main/java/com/musa/cad/DxfSnapGeometry.java tests/DxfSnapGeometryTest.java
          java -cp /tmp/musacad-ltangent DxfSnapGeometryTest
          javac -d /tmp/musacad-ltangent app/src/main/java/com/musa/cad/DxfColor.java app/src/main/java/com/musa/cad/DxfStyle.java app/src/main/java/com/musa/cad/DxfTransparency.java app/src/main/java/com/musa/cad/DxfDrawOrder.java app/src/main/java/com/musa/cad/DxfOcs.java app/src/main/java/com/musa/cad/DxfSpace.java app/src/main/java/com/musa/cad/DxfVisibility.java app/src/main/java/com/musa/cad/DxfBlocks.java tests/DxfBlocksTest.java
          java -cp /tmp/musacad-ltangent DxfBlocksTest
          javac -d /tmp/musacad-ltangent app/src/main/java/com/musa/cad/DxfViewport.java tests/DxfViewportTest.java
          java -cp /tmp/musacad-ltangent DxfViewportTest
          javac -d /tmp/musacad-ltangent app/src/main/java/com/musa/cad/DxfHatchPattern.java tests/DxfHatchPatternTest.java
          java -cp /tmp/musacad-ltangent DxfHatchPatternTest
          javac -d /tmp/musacad-ltangent app/src/main/java/com/musa/cad/DxfText.java app/src/main/java/com/musa/cad/DxfTextStyles.java app/src/main/java/com/musa/cad/DxfTextLayout.java tests/DxfTextTest.java tests/DxfTextStylesTest.java tests/DxfTextLayoutTest.java
          java -cp /tmp/musacad-ltangent DxfTextTest
          java -cp /tmp/musacad-ltangent DxfTextStylesTest
          java -cp /tmp/musacad-ltangent DxfTextLayoutTest
      - name: Fetch pinned LibreDWG for Android compile
        uses: actions/checkout@v4
        with:
          repository: LibreDWG/libredwg
          ref: 34f02f54b9aacb5708c1d3d2070efb3e4b2d8c43
          path: third_party/libredwg
      - name: Compile Android Java sources
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:compileDebugJavaWithJavac
      - name: Commit LEADER tangent support
        run: |
          git config user.name 'MusaCAD CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/musa/cad/DxfParser.java
          git commit -m 'Honor stored spline LEADER end tangents'
          git push origin HEAD:fix-1b-hatch-geometry
