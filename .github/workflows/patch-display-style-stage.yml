name: One-shot display style patch

on:
  push:
    branches: [ fix-1b-hatch-geometry ]
    paths:
      - '.github/workflows/patch-display-style-stage.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run display style renderer patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-1b-hatch-geometry
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Patch parser
        run: python3 .github/scripts/patch_display_style.py
      - name: Test pure display helpers
        run: |
          rm -rf /tmp/musacad-display-test && mkdir -p /tmp/musacad-display-test
          javac -d /tmp/musacad-display-test app/src/main/java/com/musa/cad/DxfColor.java app/src/main/java/com/musa/cad/DxfStyle.java app/src/main/java/com/musa/cad/DxfLineTypes.java app/src/main/java/com/musa/cad/DxfWipeout.java tests/DxfStyleTest.java tests/DxfLineTypesTest.java tests/DxfWipeoutTest.java
          java -cp /tmp/musacad-display-test DxfStyleTest
          java -cp /tmp/musacad-display-test DxfLineTypesTest
          java -cp /tmp/musacad-display-test DxfWipeoutTest
      - name: Commit parser patch
        run: |
          git config user.name 'MusaCAD CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/musa/cad/DxfParser.java
          git commit -m 'Render WIPEOUT linetypes and lineweights'
          git push origin HEAD:fix-1b-hatch-geometry
