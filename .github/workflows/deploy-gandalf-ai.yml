name: Deploy Gandalf AI and build APK

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Gandalf sağlayıcısı: Gemini / Cloudflare Qwen / özel Qwen sunucusu"
        type: choice
        required: true
        default: gemini
        options:
          - gemini
          - cloudflare
          - selfhosted
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  deploy-and-build:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-gandalf-apk]') }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SELFHOSTED_AI_ENDPOINT: ${{ secrets.MUSACAD_SELFHOSTED_AI_ENDPOINT }}
      SELFHOSTED_AI_API_KEY: ${{ secrets.MUSACAD_SELFHOSTED_AI_API_KEY }}
      SELFHOSTED_MODEL: ${{ vars.MUSACAD_SELFHOSTED_MODEL || 'qwen3.5:4b' }}
      AI_PROVIDER_SELECTED: ${{ github.event.inputs.provider || 'gemini' }}
      MUSACAD_TRIAL_API_URL: ${{ secrets.MUSACAD_TRIAL_API_URL }}
      MUSACAD_TRIAL_PUBLIC_KEY_PEM: ${{ secrets.MUSACAD_TRIAL_PUBLIC_KEY_PEM }}
      MUSACAD_PRODUCTION_RELEASE: "true"
      MUSACAD_KEYSTORE_FILE: /tmp/musacad-release.jks
      MUSACAD_RELEASE_KEYSTORE_B64: ${{ secrets.MUSACAD_RELEASE_KEYSTORE_B64 }}
      MUSACAD_KEYSTORE_PASSWORD: ${{ secrets.MUSACAD_KEYSTORE_PASSWORD }}
      MUSACAD_KEY_ALIAS: ${{ secrets.MUSACAD_KEY_ALIAS }}
      MUSACAD_KEY_PASSWORD: ${{ secrets.MUSACAD_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate Gandalf deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID MUSACAD_TRIAL_API_URL MUSACAD_TRIAL_PUBLIC_KEY_PEM MUSACAD_RELEASE_KEYSTORE_B64 MUSACAD_KEYSTORE_PASSWORD MUSACAD_KEY_ALIAS MUSACAD_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing repository secret: $name"
              missing=1
            fi
          done
          case "$AI_PROVIDER_SELECTED" in
            gemini)
              if [ -z "${GEMINI_API_KEY:-}" ]; then
                echo "::error::Gemini provider requires GEMINI_API_KEY secret"
                missing=1
              fi
              ;;
            cloudflare)
              if ! [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]] ||
                 [ -z "${CLOUDFLARE_AI_API_TOKEN:-}" ]; then
                echo "::error::Cloudflare Qwen requires 32-hex Cloudflare account ID and the separate CLOUDFLARE_AI_API_TOKEN secret"
                missing=1
              fi
              ;;
            selfhosted)
              if ! [[ "$SELFHOSTED_MODEL" =~ ^[A-Za-z0-9._:/-]{1,100}$ ]]; then
                echo "::error::Selfhosted model ID contains unsupported characters"
                missing=1
              fi
              if [ -z "${SELFHOSTED_AI_ENDPOINT:-}" ] || [ -z "${SELFHOSTED_AI_API_KEY:-}" ]; then
                echo "::error::Selfhosted provider requires both MUSACAD_SELFHOSTED_AI_ENDPOINT and MUSACAD_SELFHOSTED_AI_API_KEY secrets"
                missing=1
              fi
              if [ -n "${SELFHOSTED_AI_ENDPOINT:-}" ]; then
                case "$SELFHOSTED_AI_ENDPOINT" in
                  https://*/v1/chat/completions) ;;
                  *) echo "::error::Selfhosted endpoint must be HTTPS /v1/chat/completions (no query parameters)"; missing=1 ;;
                esac
              fi
              ;;
            *) echo "::error::Unsupported AI provider selection"; missing=1 ;;
          esac
          if [ "$missing" -ne 0 ]; then exit 1; fi
          case "$MUSACAD_TRIAL_API_URL" in
            https://*) ;;
            *) echo "::error::MUSACAD_TRIAL_API_URL must use HTTPS"; exit 1 ;;
          esac

      - name: Verify or refresh AI session endpoint
        shell: bash
        run: |
          set -euo pipefail
          case "$MUSACAD_TRIAL_API_URL" in
            */v1/trial/start) BASE_URL="${MUSACAD_TRIAL_API_URL%/v1/trial/start}" ;;
            *) echo "::error::MUSACAD_TRIAL_API_URL must end with /v1/trial/start"; exit 1 ;;
          esac
          SESSION_URL="$BASE_URL/v1/ai/session"

          probe_session() {
            curl --silent --show-error --max-time 20               --output /tmp/gandalf-session-probe.json               --write-out '%{http_code}'               --request POST               --header 'content-type: application/json'               --data '{"deviceId":"INVALID-PREFLIGHT-ID","packageName":"com.musa.cad","entitlementProof":""}'               "$SESSION_URL" || true
          }

          status="$(probe_session)"
          # Never mutate the license database/Worker as a side effect of an
          # AI/APK release. Older license Workers may return 403 while still
          # lacking current developer-allowlist code; status alone is not a
          # version or binding-preservation check.
          if [ "$status" = "404" ]; then
            echo "::error::License AI-session route is absent. Use the dedicated guarded license Worker workflow in inspect mode, then explicit deploy mode."
            exit 1
          fi

          if [ "$status" != "403" ] && [ "$status" != "400" ]; then
            echo "::error::MusaCAD license Worker does not expose a healthy /v1/ai/session endpoint (HTTP $status)."
            # Do not echo remote content from production auth services into public build logs.
            exit 1
          fi
          echo "MUSACAD_AI_SESSION_URL=$SESSION_URL" >> "$GITHUB_ENV"

      - name: Check self-hosted Qwen readiness (no deployment)
        shell: bash
        if: env.AI_PROVIDER_SELECTED == 'selfhosted'
        run: |
          set -euo pipefail
          # Probe a single tiny inference before touching production Cloudflare.
          # Never print the endpoint credential, response body or project data.
          code="$(curl --silent --show-error --max-time 75 \
            --output /tmp/musacad-qwen-preflight.json --write-out '%{http_code}' \
            --request POST --header "Authorization: Bearer $SELFHOSTED_AI_API_KEY" \
            --header 'Content-Type: application/json' \
            --data "{\"model\":\"$SELFHOSTED_MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"Say OK.\"}],\"max_tokens\":64,\"stream\":false}" \
            "$SELFHOSTED_AI_ENDPOINT" || true)"
          if [ "$code" != "200" ]; then
            echo "::error::Self-hosted AI preflight failed (HTTP $code). No production Worker was modified."
            exit 1
          fi
          echo "Self-hosted Qwen responded to a bounded text completion probe."

      - name: Preflight Cloudflare Qwen before changing the production Worker
        shell: bash
        if: env.AI_PROVIDER_SELECTED == 'cloudflare'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          with open('/tmp/musacad-cf-qwen-preflight.json','w') as f:
              json.dump({
                "model":"@cf/qwen/qwen3.8-27b",
                "messages":[{"role":"user","content":"Türkçe yalnız OK yaz."}],
                "reasoning_effort":"low",
                "max_completion_tokens":1536,
                "stream":False
              },f)
          PY
          status="$(curl --silent --show-error --max-time 75 \
            --output /tmp/musacad-cf-qwen-preflight-response.json --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $CLOUDFLARE_AI_API_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/musacad-cf-qwen-preflight.json \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/v1/chat/completions" || true)"
          if [ "$status" != "200" ]; then
            echo "::error::Cloudflare Qwen preflight failed (HTTP $status); the production Worker has NOT been modified."
            exit 1
          fi
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/musacad-cf-qwen-preflight-response.json'))
          payload=data.get('result') if isinstance(data.get('result'),dict) and not data.get('choices') else data
          choices=payload.get('choices') or []
          answer=choices[0].get('message',{}).get('content','') if choices else ''
          if not isinstance(answer,str) or not answer.strip():
              raise SystemExit('Qwen returned no visible response; production Worker was not modified.')
          print('Cloudflare Qwen preflight successful; response text redacted.')
          PY

      - name: Prepare Gandalf Worker config
        shell: bash
        working-directory: server/ai-worker
        run: |
          set -euo pipefail
          if [ "$AI_PROVIDER_SELECTED" = "selfhosted" ]; then
            cat > wrangler.toml <<EOF
          name = "musacad-ai"
          main = "src/index.js"
          compatibility_date = "2026-09-01"
          [vars]
          AI_PROVIDER = "selfhosted"
          SELFHOSTED_MODEL = "$SELFHOSTED_MODEL"
          AI_MAX_OUTPUT_TOKENS = "3200"
          EOF
          elif [ "$AI_PROVIDER_SELECTED" = "cloudflare" ]; then
            cat > wrangler.toml <<EOF
          name = "musacad-ai"
          main = "src/index.js"
          compatibility_date = "2026-09-01"
          [vars]
          AI_PROVIDER = "cloudflare"
          CLOUDFLARE_AI_ACCOUNT_ID = "$CLOUDFLARE_ACCOUNT_ID"
          AI_MAX_OUTPUT_TOKENS = "3200"
          EOF
          else
            cat > wrangler.toml <<'EOF'
          name = "musacad-ai"
          main = "src/index.js"
          compatibility_date = "2026-09-01"
          [vars]
          AI_PROVIDER = "gemini"
          GEMINI_API_MODE = "native"
          GEMINI_MODEL = "gemini-3.8-flash"
          AI_MAX_OUTPUT_TOKENS = "3200"
          EOF
          fi

      - name: Test Gandalf Worker code
        shell: bash
        working-directory: server/ai-worker
        run: |
          set -euo pipefail
          npm test

      - name: Bootstrap Gandalf Worker
        shell: bash
        working-directory: server/ai-worker
        run: |
          set -euo pipefail
          npx --yes wrangler@latest deploy --name musacad-ai >/tmp/gandalf-bootstrap.log 2>&1
          cat /tmp/gandalf-bootstrap.log

      - name: Install Gandalf Worker secrets
        shell: bash
        working-directory: server/ai-worker
        run: |
          set -euo pipefail
          if [ "$AI_PROVIDER_SELECTED" = "selfhosted" ]; then
            printf '%s' "$SELFHOSTED_AI_ENDPOINT" | npx --yes wrangler@latest secret put SELFHOSTED_AI_ENDPOINT --name musacad-ai
            printf '%s' "$SELFHOSTED_AI_API_KEY" | npx --yes wrangler@latest secret put SELFHOSTED_AI_API_KEY --name musacad-ai
          elif [ "$AI_PROVIDER_SELECTED" = "cloudflare" ]; then
            printf '%s' "$CLOUDFLARE_AI_API_TOKEN" | npx --yes wrangler@latest secret put CLOUDFLARE_AI_API_TOKEN --name musacad-ai
          else
            printf '%s' "$GEMINI_API_KEY" | npx --yes wrangler@latest secret put GEMINI_API_KEY --name musacad-ai
          fi
          printf '%s' "$MUSACAD_TRIAL_PUBLIC_KEY_PEM" | npx --yes wrangler@latest secret put MUSACAD_AI_SESSION_PUBLIC_KEY_PEM --name musacad-ai

      - name: Deploy Gandalf Worker
        shell: bash
        working-directory: server/ai-worker
        run: |
          set -euo pipefail
          npx --yes wrangler@latest deploy --name musacad-ai 2>&1 | tee /tmp/gandalf-deploy.log
          AI_BASE=$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/gandalf-deploy.log | tail -1 || true)
          if [ -z "$AI_BASE" ]; then
            echo "::error::Could not determine deployed Gandalf Worker URL from Wrangler output."
            exit 1
          fi
          AI_URL="$AI_BASE/v1/analyze"
          HEALTH_URL="$AI_BASE/health"
          health_status="000"
          for attempt in $(seq 1 12); do
            health_status="$(curl --silent --show-error --max-time 20 -o /tmp/gandalf-health.json -w '%{http_code}' "$HEALTH_URL" || true)"
            if [ "$health_status" = "200" ]; then break; fi
            echo "Gandalf Worker health not ready yet (HTTP $health_status), retry $attempt/12..."
            sleep 5
          done
          if [ "$health_status" != "200" ]; then
            echo "::error::Gandalf Worker health check failed after retries (HTTP $health_status)."
            cat /tmp/gandalf-health.json || true
            exit 1
          fi
          cat /tmp/gandalf-health.json
          echo "MUSACAD_AI_API_URL=$AI_URL" >> "$GITHUB_ENV"
          echo "GANDALF_WORKER_BASE=$AI_BASE" >> "$GITHUB_ENV"


      - name: Fetch pinned LibreDWG source
        uses: actions/checkout@v4
        with:
          repository: LibreDWG/libredwg
          ref: 34f02f54b9aacb5708c1d3d2070efb3e4b2d8c43
          path: third_party/libredwg

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare production signing keystore
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$MUSACAD_RELEASE_KEYSTORE_B64" | base64 -d > "$MUSACAD_KEYSTORE_FILE"
          chmod 600 "$MUSACAD_KEYSTORE_FILE"
          keytool -list -keystore "$MUSACAD_KEYSTORE_FILE" -storepass "$MUSACAD_KEYSTORE_PASSWORD" -alias "$MUSACAD_KEY_ALIAS" >/dev/null

      - name: Build Gandalf-enabled production APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleDirectRelease
          apk="app/build/outputs/apk/direct/release/app-direct-release.apk"
          test -s "$apk"
          cp "$apk" /tmp/MusaCAD-v1.2.2-Gandalf-Cloud-production.apk
          sha256sum /tmp/MusaCAD-v1.2.2-Gandalf-Cloud-production.apk | tee /tmp/MusaCAD-v1.2.2-Gandalf-Cloud-production.sha256

      - name: Upload Gandalf-enabled APK
        uses: actions/upload-artifact@v4
        with:
          name: MusaCAD-Gandalf-Cloud-production-v1.2.2
          path: |
            /tmp/MusaCAD-v1.2.2-Gandalf-Cloud-production.apk
            /tmp/MusaCAD-v1.2.2-Gandalf-Cloud-production.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        shell: bash
        run: |
          {
            echo '## Gandalf AI deployment complete'
            echo "- AI Worker: $GANDALF_WORKER_BASE"
            echo "- Analyze endpoint: $MUSACAD_AI_API_URL"
            echo "- Session endpoint: $MUSACAD_AI_SESSION_URL"
            echo "- Provider selected: $AI_PROVIDER_SELECTED"
            if [ "$AI_PROVIDER_SELECTED" = "selfhosted" ]; then
              echo "- Model: $SELFHOSTED_MODEL (operator-hosted, capacity-limited, no Gemini API quota)"
            elif [ "$AI_PROVIDER_SELECTED" = "cloudflare" ]; then
              echo '- Model: @cf/qwen/qwen3.8-27b (Workers AI Neuron quota applies)'
            else
              echo '- Model: gemini-3.8-flash'
            fi
            echo '- APK: MusaCAD-Gandalf-Cloud-production-v1.2.2'
            echo '- Gemini API key remains server-side only'
          } >> "$GITHUB_STEP_SUMMARY"
