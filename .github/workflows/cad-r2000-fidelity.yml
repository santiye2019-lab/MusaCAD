name: R2000 host fidelity proof
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/src/main/cpp/dwg_write_pilot.c'
      - 'tests/r2000_generate_variants.py'
      - 'tests/r2000_generate_stress.py'
      - 'app/src/main/cpp/dwg_primitive_fidelity.h'
      - 'app/src/main/cpp/dwg_polyline_fidelity.h'
      - '.github/workflows/android.yml'
      - '.github/workflows/cad-r2000-fidelity.yml'
  workflow_dispatch:

concurrency:
  group: r2000-fidelity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned LibreDWG source
        uses: actions/checkout@v4
        with:
          repository: LibreDWG/libredwg
          ref: 34f02f54b9aacb5708c1d3d2070efb3e4b2d8c43
          path: third_party/libredwg
      - name: Host-only R2000 DWG writer proof and safe-failure checks
        run: |
          # Deliberately separate from Android/read-only build; this is NOT release enablement.
          cmake -S app/src/main/cpp -B /tmp/musa-writer-proof -DCMAKE_BUILD_TYPE=Release -DMUSACAD_HOST_DWG_WRITE_PILOT=ON
          cmake --build /tmp/musa-writer-proof --parallel 2
          cp third_party/libredwg/test/test-data/2007/Line.dxf /tmp/musa-writer-input.dxf
          cp /tmp/musa-writer-input.dxf /tmp/musa-writer-reference.dxf
          /tmp/musa-writer-proof/musacad_dxf2dwg_pilot /tmp/musa-writer-input.dxf /tmp/musa-pilot-output.dwg
          test -s /tmp/musa-pilot-output.dwg
          cmp /tmp/musa-writer-input.dxf /tmp/musa-writer-reference.dxf
          # Inject distinct real DXF primitives into the proven LibreDWG fixture.
          # This exercises multiple coordinates, entity kinds and a fresh DWG read.
          python3 - <<'PY'
          from pathlib import Path
          src = Path('/tmp/musa-writer-input.dxf').read_text()
          start = src.index('\n  0\nSECTION\n  2\nENTITIES\n')
          end = src.index('\n  0\nENDSEC\n', start)
          def entity(kind, handle, subclasses, pairs):
              lines = ['  0', kind, '  5', handle, '330', '1F',
                       '100', 'AcDbEntity', '  8', '0']
              for cls in subclasses:
                  lines.extend(('100', cls))
              for group, value in pairs:
                  lines.extend((str(group), str(value)))
              return '\n'.join(lines) + '\n'
          extra = ''.join((
              entity('LINE', 'F001', ['AcDbLine'],
                     [(10, 101.25), (20, -23.5), (30, 7.5),
                      (11, 302.75), (21, -18.125), (31, 9.25)]),
              entity('LINE', 'F002', ['AcDbLine'],
                     [(10, -400.125), (20, 1000.5), (30, 0),
                      (11, -390.75), (21, 1001.25), (31, 0)]),
              entity('CIRCLE', 'F003', ['AcDbCircle'],
                     [(10, 52.25), (20, -10.5), (30, 0), (40, 12.75)]),
              entity('ARC', 'F004', ['AcDbCircle', 'AcDbArc'],
                     [(10, -5.125), (20, 71.25), (30, 0), (40, 5.75),
                      (50, 15.0), (51, 185.0)]),
              entity('POINT', 'F005', ['AcDbPoint'],
                     [(10, 4.5), (20, 8.25), (30, 2.75)]),
              entity('LWPOLYLINE', 'F006', ['AcDbPolyline'],
                     [(90, 4), (70, 1), (10, 0.0), (20, 0.0),
                      (10, 22.75), (20, 0.0), (10, 22.75), (20, 13.25),
                      (10, 0.0), (20, 13.25)]),
          ))
          Path('/tmp/musa-writer-multi.dxf').write_text(
              src[:end+1] + extra + src[end+1:])
          print('Multi-entity DXF fixture created: 3 LINE, CIRCLE, ARC, POINT, LWPOLYLINE')
          PY
          # An ordered closed polyline must survive alongside basic primitives.
          /tmp/musa-writer-proof/musacad_dxf2dwg_pilot /tmp/musa-writer-multi.dxf /tmp/musa-writer-multi.dwg
          test -s /tmp/musa-writer-multi.dwg
          test "$(head -c 6 /tmp/musa-writer-multi.dwg)" = AC1015
          if /tmp/musa-writer-proof/musacad_dxf2dwg_pilot /tmp/musa-writer-input.dxf /tmp/musa-pilot-output.dwg; then
            echo "Writer must never overwrite an existing destination"
            exit 1
          fi
          printf 'not a DXF\\n' >/tmp/musa-malformed.dxf
          if /tmp/musa-writer-proof/musacad_dxf2dwg_pilot /tmp/musa-malformed.dxf /tmp/musa-malformed-output.dwg; then
            echo "Malformed input must never produce DWG"
            exit 1
          fi
          test ! -e /tmp/musa-malformed-output.dwg

      - name: R2000 complex polyline and 3DFACE roundtrip acceptance
        run: |
          set -euo pipefail
          mkdir -p /tmp/musa-advanced-r2000
          python3 tests/r2000_generate_variants.py \
            third_party/libredwg/test/test-data/2007/Line.dxf /tmp/musa-advanced-r2000
          failures=0
          for kind in bulge-width bulge-only width-only face3d classic-polyline; do
            input="/tmp/musa-advanced-r2000/${kind}.dxf"
            output="/tmp/musa-advanced-r2000/${kind}.dwg"
            cp "$input" "${input}.original"
            echo "Checking R2000 roundtrip: ${kind}"
            if /usr/bin/time -f "R2000 ${kind} elapsed %e seconds peak RSS %M KB" \
                /tmp/musa-writer-proof/musacad_dxf2dwg_pilot "$input" "$output"; then
              if test -s "$output" && test "$(head -c 6 "$output")" = AC1015; then
                echo "PASS R2000 advanced case: ${kind}"
              else
                echo "FAIL R2000 advanced case: ${kind} output/header"
                failures=$((failures+1))
              fi
            else
              echo "FAIL R2000 advanced case: ${kind} rejected by fidelity audit"
              test ! -e "$output"
              failures=$((failures+1))
            fi
            cmp "$input" "${input}.original"
          done
          echo "R2000 advanced acceptance failures: $failures"
          test "$failures" -eq 0


      - name: R2000 deterministic mixed-object and dense-polyline stress
        run: |
          set -euo pipefail
          mkdir -p /tmp/musa-stress-r2000
          python3 tests/r2000_generate_stress.py \
            third_party/libredwg/test/test-data/2007/Line.dxf /tmp/musa-stress-r2000
          # These are CI acceptance limits, not claimed real-world performance.
          # 120s per fixture; virtual-memory limit of 1.5 GiB per writer process.
          ulimit -v 1572864
          for kind in mixed-512 mixed-8192 dense-polyline-8192; do
            case "$kind" in
              mixed-512) expected=513 ;;
              mixed-8192) expected=8193 ;;
              dense-polyline-8192) expected=2 ;;
            esac
            input="/tmp/musa-stress-r2000/${kind}.dxf"
            output="/tmp/musa-stress-r2000/${kind}.dwg"
            log="/tmp/musa-stress-r2000/${kind}.log"
            metrics="/tmp/musa-stress-r2000/${kind}.time"
            checksum="$(sha256sum "$input" | cut -d ' ' -f1)"
            echo "R2000 STRESS START: ${kind} expected_geometry=$expected"
            /usr/bin/time -f "elapsed_sec=%e peak_rss_kib=%M" -o "$metrics" \
              timeout --signal=TERM --kill-after=5s 120s \
              /tmp/musa-writer-proof/musacad_dxf2dwg_pilot "$input" "$output" \
              >"$log" 2>&1 || { cat "$log"; cat "$metrics"; exit 1; }
            cat "$log"
            cat "$metrics"
            test -s "$output"
            test "$(head -c 6 "$output")" = AC1015
            grep -F "geometry entities=$expected)." "$log"
            test "$(sha256sum "$input" | cut -d ' ' -f1)" = "$checksum"
            # In addition to timeout and VM ceiling, gate observable peak RSS.
            peak="$(sed -n 's/.*peak_rss_kib=\([0-9][0-9]*\).*/\1/p' "$metrics")"
            test -n "$peak"
            test "$peak" -le 900000
            echo "PASS R2000 STRESS: ${kind} peak_rss_kib=$peak"
          done
