          grep -F 'Exact leaf-instance context used' /tmp/musa-context-dynblocks.log
          grep -F 'Exact leaf-instance context used' /tmp/musa-context-ts1.log
          grep -F 'Context Nested paged scene verified: pages=50 primitives=33479 legacy_count=33479 legacy_status=0' \
