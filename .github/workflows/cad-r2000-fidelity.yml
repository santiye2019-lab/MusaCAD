name: Modern DWG AC1032 reader and legacy writer proof
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/src/main/cpp/dwg_write_pilot.c'
      - 'app/src/main/cpp/dwg_source_snapshot.h'
      - 'tests/dwg_source_snapshot_test.c'
      - 'app/src/main/cpp/native_scene.c'
      - 'app/src/main/cpp/native_color.h'
      - 'core/native/**'
      - 'docs/AUTOCAD_2027_TARGET.json'
      - 'app/src/main/cpp/native_nurbs.h'
      - 'tests/native_nurbs_test.c'
      - 'tests/native_fit_spline_test.c'
      - 'app/src/main/cpp/native_fit_spline.h'
      - 'app/src/main/cpp/native_scene.h'
      - 'app/src/main/cpp/dwg_bridge.c'
      - 'app/src/main/cpp/ac1032_firstparty_preview_jni.c'
      - 'app/src/main/java/com/musa/cad/FirstPartyDwgPreview.java'
      - 'tests/real_dwg_model_identity.py'
      - 'tests/test_real_dwg_model_identity.py'
      - 'tests/r2000_generate_variants.py'
      - 'tests/r2000_generate_stress.py'
      - 'tests/private_dwg_read_audit.py'
      - 'tests/test_private_dwg_spline_diagnostics.py'
      - 'tests/native_preview_type_audit.py'
      - 'tests/dwg_entity_identity_audit.py'
      - 'tests/test_dwg_entity_identity_audit.py'
      - 'tests/dwg_layer_table_audit.py'
      - 'tests/test_dwg_layer_table_audit.py'
      - 'tests/dwg_block_reference_audit.py'
      - 'tests/test_dwg_block_reference_audit.py'
      - 'tests/dwg_layout_viewport_audit.py'
      - 'tests/test_dwg_layout_viewport_audit.py'
      - 'tests/test_native_preview_type_audit.py'
      - 'tests/dwg_dxf_semantic_parity.py'
      - 'tests/test_dwg_dxf_semantic_parity.py'
      - 'tests/modern_dwg_acceptance.py'
      - 'tests/test_modern_dwg_acceptance.py'
      - 'tests/test_modern_color_inventory.py'
      - 'tests/test_native_point_payload_guard.py'
      - 'tests/test_native_modern_scene_guards.py'
      - 'app/src/main/cpp/dwg_primitive_fidelity.h'
      - 'app/src/main/cpp/dwg_polyline_fidelity.h'
      - '.github/workflows/android.yml'
      - '.github/workflows/cad-r2000-fidelity.yml'
  workflow_dispatch:

concurrency:
  group: modern-dwg-fidelity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned LibreDWG source
        uses: actions/checkout@v4
        with:
          repository: LibreDWG/libredwg
          ref: 34f02f54b9aacb5708c1d3d2070efb3e4b2d8c43
          path: third_party/libredwg
      - name: P0 FIRST-PARTY real AC1032 protected header / all section pages / opaque extraction
        run: |
          set -euo pipefail
          # Real public upstream AC1032 source; no LibreDWG decoder library
          # is linked or invoked in the independent MusaCAD C11 probe.
          file=third_party/libredwg/test/test-data/2018/Dynblocks.dwg
          test -s "$file"
          test "$(head -c 6 "$file")" = AC1032
          source_before="$(sha256sum "$file" | cut -d ' ' -f1)"
          cmake -S core/native -B /tmp/musacad-real-ac1032-core \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build /tmp/musacad-real-ac1032-core --parallel 2
          cc -std=c11 -Wall -Wextra -Werror \
            -Icore/native/include \
            core/native/tests/core_dwg_ac1032_real_fixture_probe.c \
            /tmp/musacad-real-ac1032-core/libmusacad_core.a -lm \
            -o /tmp/musacad-ac1032-real-probe
          timeout 60s /tmp/musacad-ac1032-real-probe "$file"
          source_after="$(sha256sum "$file" | cut -d ' ' -f1)"
          test "$source_before" = "$source_after"

      - name: P0 original AC1032 AutoCAD LINE indexed source + reference provenance
        run: |
          set -euo pipefail
          # An ORIGINAL 2018-family DWG with matching AutoCAD property text;
          # the first-party probe links ONLY musacad_core (NO LibreDWG).
          file=third_party/libredwg/test/test-data/2018/Line.dwg
          oracle=third_party/libredwg/test/test-data/2018/Line.txt
          test -s "$file"
          test -s "$oracle"
          test "$(head -c 6 "$file")" = AC1032
          grep -F 'Handle (RO) = "1CA"' "$oracle"
          grep -F 'StartPoint = (21.6078 2.81192 0.0)' "$oracle"
          grep -F 'EndPoint = (11.0307 16.6375 0.0)' "$oracle"
          before="$(sha256sum "$file" | cut -d ' ' -f1)"
          cc -std=c11 -Wall -Wextra -Werror -Icore/native/include \
            core/native/tests/core_dwg_ac1032_real_line_oracle.c \
            /tmp/musacad-real-ac1032-core/libmusacad_core.a -lm \
            -o /tmp/musa-original-ac1032-line
          timeout 60s /tmp/musa-original-ac1032-line "$file"
          after="$(sha256sum "$file" | cut -d ' ' -f1)"
          test "$before" = "$after"
          echo "PASS genuine original AC1032 LINE XYZ compared with AutoCAD oracle"

      - name: P0 original AC1032 AutoCAD ARC and CIRCLE geometry reference
        run: |
          set -euo pipefail
          arc=third_party/libredwg/test/test-data/2018/Arc.dwg
          circle=third_party/libredwg/test/test-data/2018/circle.dwg
          arcref=third_party/libredwg/test/test-data/2018/Arc.txt
          circleref=third_party/libredwg/test/test-data/2018/circle.txt
          for f in "$arc" "$circle" "$arcref" "$circleref"; do
            test -s "$f"
          done
          test "$(head -c 6 "$arc")" = AC1032
          test "$(head -c 6 "$circle")" = AC1032
          grep -F 'Handle (RO) = "1BD"' "$arcref"
          grep -F 'Center = (-18.1933 6.68652 0.0)' "$arcref"
          grep -F 'Radius = 8.2931' "$arcref"
          grep -F 'StartAngle = 2.00242' "$arcref"
          grep -F 'EndAngle = 1.51876' "$arcref"
          grep -F 'Handle (RO) = "1BD"' "$circleref"
          grep -F 'Center = (23.4493 -1.09239 0.0)' "$circleref"
          grep -F 'Radius = 13.5304' "$circleref"
          a_before="$(sha256sum "$arc" | cut -d ' ' -f1)"
          c_before="$(sha256sum "$circle" | cut -d ' ' -f1)"
          cc -std=c11 -Wall -Wextra -Werror -Icore/native/include \
            core/native/tests/core_dwg_ac1032_real_curve_oracle.c \
            /tmp/musacad-real-ac1032-core/libmusacad_core.a -lm \
            -o /tmp/musa-original-ac1032-curves
          timeout 60s /tmp/musa-original-ac1032-curves "$arc" "$circle"
          test "$(sha256sum "$arc" | cut -d ' ' -f1)" = "$a_before"
          test "$(sha256sum "$circle" | cut -d ' ' -f1)" = "$c_before"
          echo "PASS real ARC/CIRCLE source geometry and immutable DWG"

      - name: P0 original AC1032 AutoCAD POINT indexed XYZ reference
        run: |
          set -euo pipefail
          file=third_party/libredwg/test/test-data/2018/Point.dwg
          oracle=third_party/libredwg/test/test-data/2018/Point.txt
          test -s "$file"
          test -s "$oracle"
          test "$(head -c 6 "$file")" = AC1032
          grep -F 'Handle (RO) = "1C0"' "$oracle"
          grep -F 'Coordinates = (27.928 8.65308 0.0)' "$oracle"
          grep -F 'Extrusion = (0.0 0.0 1.0)' "$oracle"
          before="$(sha256sum "$file" | cut -d ' ' -f1)"
          cc -std=c11 -Wall -Wextra -Werror -Icore/native/include \
            core/native/tests/core_dwg_ac1032_real_point_oracle.c \
            /tmp/musacad-real-ac1032-core/libmusacad_core.a -lm \
            -o /tmp/musa-original-ac1032-point
          timeout 60s /tmp/musa-original-ac1032-point "$file"
          test "$(sha256sum "$file" | cut -d ' ' -f1)" = "$before"
          echo "PASS real first-party POINT XYZ from unchanged DWG"

      - name: P0 original AC1032 AutoCAD LWPOLYLINE OCS vertex oracle
        run: |
          set -euo pipefail
          file=third_party/libredwg/test/test-data/2018/Polyline.dwg
          oracle=third_party/libredwg/test/test-data/2018/Polyline.txt
          test -s "$file"
          test -s "$oracle"
          test "$(head -c 6 "$file")" = AC1032
          grep -F 'Handle (RO) = "1BD"' "$oracle"
          grep -F 'ObjectName (RO) = "AcDbPolyline"' "$oracle"
          grep -F 'Coordinates = (9.00535 12.2913 17.1819 14.7267 20.7826 8.24476' "$oracle"
          before="$(sha256sum "$file" | cut -d ' ' -f1)"
          cc -std=c11 -Wall -Wextra -Werror -Icore/native/include \
            core/native/tests/core_dwg_ac1032_real_lwpolyline_oracle.c \
            /tmp/musacad-real-ac1032-core/libmusacad_core.a -lm \
            -o /tmp/musa-original-ac1032-lwpolyline
          timeout 60s /tmp/musa-original-ac1032-lwpolyline "$file"
          test "$(sha256sum "$file" | cut -d ' ' -f1)" = "$before"
          echo "PASS real original AC1032 LWPOLYLINE OCS vertex XYZ oracle"

      - name: P0 genuine AutoCAD R2018 POLYLINE3D header and independent vertex oracles
        run: |
          set -euo pipefail
          file=third_party/libredwg/test/test-data/2018/PolyLine3D.dwg
          oracle=third_party/libredwg/test/test-data/2018/PolyLine3D.txt
          test -s "$file"
          test -s "$oracle"
          test "$(head -c 6 "$file")" = AC1032
          grep -F 'Handle (RO) = "1C1"' "$oracle"
          grep -F 'ObjectName (RO) = "AcDb3dPolyline"' "$oracle"
          grep -F 'Closed = 0' "$oracle"
          grep -F 'Coordinates = (21.4409 14.6498 0.0 20.8962 5.65378 0.0' "$oracle"
          before="$(sha256sum "$file" | cut -d ' ' -f1)"
          cc -std=c11 -Wall -Wextra -Werror -Icore/native/include \
            core/native/tests/core_dwg_ac1032_real_polyline3d_oracle.c \
            /tmp/musacad-real-ac1032-core/libmusacad_core.a -lm \
            -o /tmp/musa-original-ac1032-polyline3d
          timeout 60s /tmp/musa-original-ac1032-polyline3d "$file"
          test "$(sha256sum "$file" | cut -d ' ' -f1)" = "$before"
          echo "PASS original R2018 3D POLYLINE header and individual vertex records"

      - name: P0 diagnose original 3D POLYLINE and VERTEX handle stream before owner-graph implementation
        run: |
          set -euo pipefail
          file=third_party/libredwg/test/test-data/2018/PolyLine3D.dwg
          test -s "$file"
          cc -std=c11 -Wall -Wextra -Werror -Icore/native/include \
            core/native/tests/core_dwg_ac1032_polyline3d_handles_probe.c \
            /tmp/musacad-real-ac1032-core/libmusacad_core.a -lm \
            -o /tmp/musa-polyline3d-handle-probe
          timeout 60s /tmp/musa-polyline3d-handle-probe "$file"

      - name: P0 original R2018 ordered POLYLINE3D hard-owner graph and XYZ
        run: |
          set -euo pipefail
          file=third_party/libredwg/test/test-data/2018/PolyLine3D.dwg
          oracle=third_party/libredwg/test/test-data/2018/PolyLine3D.txt
          test -s "$file"
          test -s "$oracle"
          grep -F 'Handle (RO) = "1C1"' "$oracle"
          grep -F 'Coordinates = (21.4409 14.6498 0.0 20.8962 5.65378 0.0' "$oracle"
          before="$(sha256sum "$file" | cut -d ' ' -f1)"
          cc -std=c11 -Wall -Wextra -Werror -Icore/native/include \
            core/native/tests/core_dwg_ac1032_real_polyline3d_graph_oracle.c \
            /tmp/musacad-real-ac1032-core/libmusacad_core.a -lm \
            -o /tmp/musa-original-polyline3d-graph
          timeout 60s /tmp/musa-original-polyline3d-graph "$file"
          test "$(sha256sum "$file" | cut -d ' ' -f1)" = "$before"
          echo "PASS original R2018 3D POLYLINE six ordered vertices with reverse owner graph"

      - name: P0 original AC1032 source-free cached 3D POLYLINE ordered owner graph
        run: |
          set -euo pipefail
          file=third_party/libredwg/test/test-data/2018/PolyLine3D.dwg
          oracle=third_party/libredwg/test/test-data/2018/PolyLine3D.txt
          test -s "$file"
          test -s "$oracle"
          grep -F 'Handle (RO) = "1C1"' "$oracle"
          grep -F 'Coordinates = (21.4409 14.6498 0.0 20.8962 5.65378 0.0' "$oracle"
          before="$(sha256sum "$file" | cut -d ' ' -f1)"
          cc -std=c11 -Wall -Wextra -Werror -Icore/native/include \
            core/native/tests/core_dwg_ac1032_real_scene_polyline3d_oracle.c \
            /tmp/musacad-real-ac1032-core/libmusacad_core.a -lm \
            -o /tmp/musa-original-ac1032-cached-poly3d
          timeout 90s /tmp/musa-original-ac1032-cached-poly3d "$file"
          test "$(sha256sum "$file" | cut -d ' ' -f1)" = "$before"
          echo "PASS source-free cached AC1032 OT16 original H-ordered 3D geometry"

      - name: P0 original full indexed R2018 cached geometry coverage without opaque omission
        run: |
          set -euo pipefail
          directory=third_party/libredwg/test/test-data/2018
          before="$(sha256sum "$directory/Line.dwg" "$directory/Arc.dwg" "$directory/circle.dwg" "$directory/Point.dwg" "$directory/Polyline.dwg" "$directory/PolyLine3D.dwg")"
          cc -std=c11 -Wall -Wextra -Werror -Icore/native/include \
            core/native/tests/core_dwg_ac1032_scene_geometry_scan_test.c \
            /tmp/musacad-real-ac1032-core/libmusacad_core.a -lm \
            -o /tmp/musa-original-r2018-full-geometry-index-audit
          timeout 120s /tmp/musa-original-r2018-full-geometry-index-audit \
            "$directory/Line.dwg" "$directory/Arc.dwg" "$directory/circle.dwg" \
            "$directory/Point.dwg" "$directory/Polyline.dwg" "$directory/PolyLine3D.dwg"
          test "$(sha256sum "$directory/Line.dwg" "$directory/Arc.dwg" "$directory/circle.dwg" "$directory/Point.dwg" "$directory/Polyline.dwg" "$directory/PolyLine3D.dwg")" = "$before"
          echo "PASS original 6-fixture indexed geometry acceptance vs explicit opaque/rejected counts"

      - name: P0 original R2018 five 2D entities H5 to real LAYER OT51 graph
        run: |
          set -euo pipefail
          directory=third_party/libredwg/test/test-data/2018
          for name in Line Point Arc circle Polyline; do
            test -s "$directory/$name.dwg"
          done
          before="$(sha256sum "$directory/Line.dwg" "$directory/Point.dwg" \
            "$directory/Arc.dwg" "$directory/circle.dwg" "$directory/Polyline.dwg")"
          cc -std=c11 -Wall -Wextra -Werror -Icore/native/include \
            core/native/tests/core_dwg_ac1032_original_entity_layer_ref_test.c \
            /tmp/musacad-real-ac1032-core/libmusacad_core.a -lm \
            -o /tmp/musa-original-r2018-layer-edge
          timeout 120s /tmp/musa-original-r2018-layer-edge \
            "$directory/Line.dwg" "$directory/Point.dwg" \
            "$directory/Arc.dwg" "$directory/circle.dwg" "$directory/Polyline.dwg"
          test "$(sha256sum "$directory/Line.dwg" "$directory/Point.dwg" \
            "$directory/Arc.dwg" "$directory/circle.dwg" "$directory/Polyline.dwg")" = "$before"
          echo "PASS five genuine original source R2018 H5->LAYER edges, not BYLAYER color"

      - name: P0 original R2018 indexed LINE POINT direct ACI color source and provisional BYLAYER v6
        run: |
          set -euo pipefail
          folder=third_party/libredwg/test/test-data/2018
          test -s "$folder/Line.dwg"
          test -s "$folder/Point.dwg"
          before="$(sha256sum "$folder/Line.dwg" "$folder/Point.dwg")"
          cc -std=c11 -Wall -Wextra -Werror -Icore/native/include \
            core/native/tests/core_dwg_ac1032_original_preview_v6_aci_test.c \
            /tmp/musacad-real-ac1032-core/libmusacad_core.a -lm \
            -o /tmp/musa-original-r2018-aci-v6
          timeout 120s /tmp/musa-original-r2018-aci-v6 \
            "$folder/Line.dwg" "$folder/Point.dwg"
          test "$(sha256sum "$folder/Line.dwg" "$folder/Point.dwg")" = "$before"
          echo "PASS genuine R2018 source per-entity direct ACI + explicit incomplete BYLAYER"

      - name: P0 original R2018 owned flat POLYLINE3D exact XY to native v6
        run: |
          set -euo pipefail
          folder=third_party/libredwg/test/test-data/2018
          test -s "$folder/PolyLine3D.dwg"
          before="$(sha256sum "$folder/PolyLine3D.dwg")"
          cc -std=c11 -Wall -Wextra -Werror -Icore/native/include \
            core/native/tests/core_dwg_ac1032_original_preview_v6_flat_polyline3d_test.c \
            /tmp/musacad-real-ac1032-core/libmusacad_core.a -lm \
            -o /tmp/musa-original-r2018-flat-polyline3d-v6
          timeout 120s /tmp/musa-original-r2018-flat-polyline3d-v6 "$folder/PolyLine3D.dwg"
          test "$(sha256sum "$folder/PolyLine3D.dwg")" = "$before"
          echo "PASS source-graph-verified original planar POLYLINE3D to native v6"
          
      - name: P0 original R2018 LWPOLYLINE planar poly and authentic geometry to v6
        run: |
          set -euo pipefail
          folder=third_party/libredwg/test/test-data/2018
          test -s "$folder/Polyline.dwg"
          before="$(sha256sum "$folder/Polyline.dwg")"
          cc -std=c11 -Wall -Wextra -Werror -Icore/native/include \
            core/native/tests/core_dwg_ac1032_original_preview_v6_lwpolyline_test.c \
            /tmp/musacad-real-ac1032-core/libmusacad_core.a -lm \
            -o /tmp/musa-original-r2018-lwpoly-v6-preview
          timeout 120s /tmp/musa-original-r2018-lwpoly-v6-preview "$folder/Polyline.dwg"
          test "$(sha256sum "$folder/Polyline.dwg")" = "$before"
          echo "PASS original source LWPOLYLINE -> bounded independent native v6 poly data"

      - name: P0 original R2018 ARC CIRCLE to MusaCAD independent v6 preview geometry
        run: |
          set -euo pipefail
          folder=third_party/libredwg/test/test-data/2018
          before="$(sha256sum "$folder/Arc.dwg" "$folder/circle.dwg")"
          cc -std=c11 -Wall -Wextra -Werror -Icore/native/include \
            core/native/tests/core_dwg_ac1032_original_preview_v6_curve_test.c \
            /tmp/musacad-real-ac1032-core/libmusacad_core.a -lm \
            -o /tmp/musa-ac1032-original-preview-v6-curves
          timeout 120s /tmp/musa-ac1032-original-preview-v6-curves \
            "$folder/Arc.dwg" "$folder/circle.dwg"
          test "$(sha256sum "$folder/Arc.dwg" "$folder/circle.dwg")" = "$before"
          echo "PASS original source ARC + CIRCLE to exact v6 curve words"

      - name: P0 original R2018 LINE POINT to MusaCAD independent v6 preview geometry
        run: |
          set -euo pipefail
          folder=third_party/libredwg/test/test-data/2018
          test -s "$folder/Line.dwg"
          test -s "$folder/Point.dwg"
          before="$(sha256sum "$folder/Line.dwg" "$folder/Point.dwg")"
          cc -std=c11 -Wall -Wextra -Werror -Icore/native/include \
            core/native/tests/core_dwg_ac1032_original_preview_v6_test.c \
            /tmp/musacad-real-ac1032-core/libmusacad_core.a -lm \
            -o /tmp/musa-ac1032-original-preview-v6
          timeout 120s /tmp/musa-ac1032-original-preview-v6 \
            "$folder/Line.dwg" "$folder/Point.dwg"
          test "$(sha256sum "$folder/Line.dwg" "$folder/Point.dwg")" = "$before"
          echo "PASS original source LINE + POINT exact-to-float v6 scene, explicit partial flag"

      - name: P0 original AC1032 one-open scene indexed cached geometry parity
        run: |
          set -euo pipefail
          directory=third_party/libredwg/test/test-data/2018
          cc -std=c11 -Wall -Wextra -Werror -Icore/native/include \
            core/native/tests/core_dwg_ac1032_real_scene_index_oracle.c \
            /tmp/musacad-real-ac1032-core/libmusacad_core.a -lm \
            -o /tmp/musa-original-scene-index
          for descriptor in \
            '19:1CA:Line.dwg' '17:1BD:Arc.dwg' \
            '18:1BD:circle.dwg' '27:1C0:Point.dwg' \
            '77:1BD:Polyline.dwg' '11:1C3:PolyLine3D.dwg'; do
            IFS=: read -r type handle filename <<< "$descriptor"
            test -s "$directory/$filename"
            before="$(sha256sum "$directory/$filename" | cut -d ' ' -f1)"
            timeout 90s /tmp/musa-original-scene-index \
              "$type" "$handle" "$directory/$filename"
            test "$(sha256sum "$directory/$filename" | cut -d ' ' -f1)" = "$before"
          done
          echo "PASS genuine original indexed 6-type source-free repeated geometry read"

      - name: P0 audit complete original AC1032 handle index and all record CRCs without dropping opaque objects
        run: |
          set -euo pipefail
          line=third_party/libredwg/test/test-data/2018/Line.dwg
          lw=third_party/libredwg/test/test-data/2018/Polyline.dwg
          poly3d=third_party/libredwg/test/test-data/2018/PolyLine3D.dwg
          for file in "$line" "$lw" "$poly3d"; do test -s "$file"; done
          sha_before="$(sha256sum "$line" "$lw" "$poly3d")"
          cc -std=c11 -Wall -Wextra -Werror -Icore/native/include \
            core/native/tests/core_dwg_ac1032_indexed_audit_test.c \
            /tmp/musacad-real-ac1032-core/libmusacad_core.a -lm \
            -o /tmp/musa-ac1032-indexed-audit
          timeout 90s /tmp/musa-ac1032-indexed-audit "$line" "$lw" "$poly3d"
          test "$(sha256sum "$line" "$lw" "$poly3d")" = "$sha_before"
          echo "PASS all indexed real R2018 source records CRC and nonoverlap"

      - name: P0 genuine AC1015 original-byte header and section CRC acceptance
        run: |
          set -euo pipefail
          # Public upstream reference data is pinned at checkout above.
          # Never downgrade a failed real-file acceptance to a warning.
          fixture=third_party/libredwg/test/test-data/2000/TS1.dwg
          modern=third_party/libredwg/test/test-data/example_2013.dwg
          test -s "$fixture"
          test -s "$modern"
          test "$(head -c 6 "$fixture")" = "AC1015"
          test "$(head -c 6 "$modern")" != "AC1015"
          cc -std=c11 -Wall -Wextra -Werror -Icore/native/include \
            core/native/src/musacad_dwg_ac1015_frame.c \
            core/native/src/musacad_dwg_ac1015_handles.c \
            core/native/src/musacad_dwg_ac1015_object.c \
            core/native/src/musacad_dwg_ac1015_values.c \
            core/native/src/musacad_dwg_ac1015.c \
            core/native/src/musacad_dwg_regions.c \
            core/native/src/musacad_dwg_signature.c \
            core/native/src/musacad_crc16.c \
            core/native/src/musacad_bits.c \
            core/native/tests/core_ac1015_real_fixture_probe.c \
            -o /tmp/musacad-ac1015-real-fixture
          before="$(sha256sum "$fixture" | cut -d ' ' -f1)"
          /tmp/musacad-ac1015-real-fixture accept-r2000 "$fixture"
