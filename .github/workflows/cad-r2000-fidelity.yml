          # treat the audit's nonzero exit as a passing reader.
          audit_exit=0
          python3 tests/private_dwg_read_audit.py \
            --converter /tmp/musa-writer-proof/musacad_dwg_convert \
            --report /tmp/musacad-upstream-dwg-reader.json \
            third_party/libredwg/test/test-data/example_2013.dwg \
            third_party/libredwg/test/test-data/2000/TS1.dwg || audit_exit=$?
          python3 - <<'PY'
          import json
          from pathlib import Path
          doc = json.loads(Path("/tmp/musacad-upstream-dwg-reader.json").read_text())
          assert len(doc["files"]) == 2
          violations=[]
          for item in doc["files"]:
              print("DWG reader audit:", item["dwg_release"],
                    "status=",item["status"],
                    "scene_status=",item["native_scene_status"],
                    "spline_missing_knots=",item.get("native_spline_fit_only_rejections",0),
                    "spline_bad_weights=",item.get("native_spline_invalid_weight_rejections",0),
                    "spline_details=", item.get("native_spline_rejection_details",[]),
                    "fit_stages=", item.get("native_fit_spline_stage_diagnostics",[]),
                    flush=True)
              if not item["source_unchanged"]:
                  violations.append(item["dwg_release"]+": source modified")
              if item["status"] != "decoded_dxf_inventory":
                  violations.append(item["dwg_release"]+": decoded scene is incomplete")
              if item["model_entity_count"] + item["block_geometry_entity_count"] <= 0:
                  violations.append(item["dwg_release"]+": empty decoded geometry")
              if item["status"] == "decoded_dxf_inventory":
                  print("PASS DWG READER:", item["dwg_release"],
                        "layers=", item["layer_count"],
                        "blocks=", item["block_definition_count"],
                        "model_entities=", item["model_entity_count"])
          assert not violations, violations
          PY
          test "$audit_exit" -eq 0

