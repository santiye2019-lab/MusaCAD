name: Modern DWG AC1032 reader and legacy writer proof
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/src/main/cpp/dwg_write_pilot.c'
      - 'app/src/main/cpp/dwg_source_snapshot.h'
      - 'tests/dwg_source_snapshot_test.c'
      - 'app/src/main/cpp/native_scene.c'
      - 'app/src/main/cpp/native_color.h'
      - 'core/native/**'
      - 'docs/AUTOCAD_2027_TARGET.json'
      - 'app/src/main/cpp/native_nurbs.h'
      - 'tests/native_nurbs_test.c'
      - 'tests/native_fit_spline_test.c'
      - 'app/src/main/cpp/native_fit_spline.h'
      - 'app/src/main/cpp/native_scene.h'
      - 'app/src/main/cpp/dwg_bridge.c'
      - 'app/src/main/cpp/ac1032_firstparty_preview_jni.c'
      - 'app/src/main/cpp/ac1032_insert_line_diagnostic_jni.c'
      - 'app/src/main/cpp/ac1032_all_insert_line_diagnostic_jni.c'
      - 'app/src/main/cpp/ac1032_insert_circle_numeric_wireframe_jni.c'
      - 'tests/FirstPartyAc1032AllInsertJNIHostTest.java'
      - 'tests/test_ac1032_all_insert_android_bridge.py'
      - 'app/src/main/java/com/musa/cad/FirstPartyDwgPreviewDialog.java'
      - 'tests/test_original_dwg_2d_diagnostic_isolation.py'
      - 'app/src/main/java/com/musa/cad/FirstPartyDwgPreview.java'
      - 'app/src/main/java/com/musa/cad/NativeScene.java'
      - 'app/src/main/java/com/musa/cad/OriginalSourceV6Merge.java'
      - 'tests/OriginalSourceV6MergeTest.java'
      - 'tests/real_dwg_model_identity.py'
      - 'tests/test_real_dwg_model_identity.py'
      - 'tests/r2000_generate_variants.py'
      - 'tests/r2000_generate_stress.py'
      - 'tests/private_dwg_read_audit.py'
      - 'tests/test_private_dwg_spline_diagnostics.py'
      - 'tests/native_preview_type_audit.py'
      - 'tests/dwg_entity_identity_audit.py'
      - 'tests/test_dwg_entity_identity_audit.py'
      - 'tests/dwg_layer_table_audit.py'
      - 'tests/test_dwg_layer_table_audit.py'
      - 'tests/dwg_block_reference_audit.py'
      - 'tests/test_dwg_block_reference_audit.py'
      - 'tests/dwg_layout_viewport_audit.py'
      - 'tests/test_dwg_layout_viewport_audit.py'
      - 'tests/test_native_preview_type_audit.py'
      - 'tests/dwg_dxf_semantic_parity.py'
      - 'tests/test_dwg_dxf_semantic_parity.py'
      - 'tests/modern_dwg_acceptance.py'
      - 'tests/test_modern_dwg_acceptance.py'
      - 'tests/test_modern_color_inventory.py'
      - 'tests/test_native_point_payload_guard.py'
      - 'tests/test_native_modern_scene_guards.py'
      - 'app/src/main/cpp/dwg_primitive_fidelity.h'
      - 'app/src/main/cpp/dwg_polyline_fidelity.h'
      - '.github/workflows/android.yml'
      - '.github/workflows/cad-r2000-fidelity.yml'
  workflow_dispatch:

concurrency:
  group: modern-dwg-fidelity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned LibreDWG source
        uses: actions/checkout@v4
        with:
          repository: LibreDWG/libredwg
          ref: 34f02f54b9aacb5708c1d3d2070efb3e4b2d8c43
          path: third_party/libredwg
      - name: P0 FIRST-PARTY real AC1032 protected header / all section pages / opaque extraction
        run: |
          set -euo pipefail
          # Real public upstream AC1032 source; no LibreDWG decoder library
          # is linked or invoked in the independent MusaCAD C11 probe.
          file=third_party/libredwg/test/test-data/2018/Dynblocks.dwg
          test -s "$file"
          test "$(head -c 6 "$file")" = AC1032
          source_before="$(sha256sum "$file" | cut -d ' ' -f1)"
          cmake -S core/native -B /tmp/musacad-real-ac1032-core \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build /tmp/musacad-real-ac1032-core --parallel 2
          cc -std=c11 -Wall -Wextra -Werror \
            -Icore/native/include \
            core/native/tests/core_dwg_ac1032_real_fixture_probe.c \
            /tmp/musacad-real-ac1032-core/libmusacad_core.a -lm \
            -o /tmp/musacad-ac1032-real-probe
          timeout 60s /tmp/musacad-ac1032-real-probe "$file"
          source_after="$(sha256sum "$file" | cut -d ' ' -f1)"
          test "$source_before" = "$source_after"

      - name: P0 R2018 CIRCLE H1BB to H8A original LAYER numeric CMC ACI4 oracle
        run: |
          set -euo pipefail
          original=third_party/libredwg/test/test-data/example_2018.dwg
          oracle=third_party/libredwg/test/test-data/example_2018.dxf
          before="$(sha256sum "$original" | cut -d ' ' -f1)"
          test "$(head -c 6 "$original")" = AC1032
          test -s "$oracle"
          cmake -S core/native -B /tmp/musacad-circle-layer-cmc -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build /tmp/musacad-circle-layer-cmc --parallel 2
          cc -std=c11 -Wall -Wextra -Werror -Icore/native/include \
            core/native/tests/core_dwg_ac1032_circle_layer_cmc_test.c \
            /tmp/musacad-circle-layer-cmc/libmusacad_core.a -lm \
            -o /tmp/musacad-r2018-circle-layer-cmc
          timeout 120s /tmp/musacad-r2018-circle-layer-cmc "$original" "$oracle"
          test "$before" = "$(sha256sum "$original" | cut -d ' ' -f1)"
          echo "PASS original CIRCLE relative owner -> LAYER source CMC ACI4, paint blocked"

      - name: P0 R2018 INSERT CIRCLE relative-owner H chain to LAYER CMC oracle
        run: |
          set -euo pipefail
          original=third_party/libredwg/test/test-data/example_2018.dwg
          oracle=third_party/libredwg/test/test-data/example_2018.dxf
          before="$(sha256sum "$original" | cut -d ' ' -f1)"
          test "$(head -c 6 "$original")" = AC1032
          test -s "$oracle"
          cmake -S core/native -B /tmp/musacad-insert-circle-cmc -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build /tmp/musacad-insert-circle-cmc --parallel 2
          cc -std=c11 -Wall -Wextra -Werror -Icore/native/include \
            core/native/tests/core_dwg_ac1032_insert_circle_layer_cmc_chain_test.c \
            /tmp/musacad-insert-circle-cmc/libmusacad_core.a -lm \
            -o /tmp/musacad-r2018-insert-circle-cmc
          timeout 120s /tmp/musacad-r2018-insert-circle-cmc "$original" "$oracle"
          test "$before" = "$(sha256sum "$original" | cut -d ' ' -f1)"
          echo "PASS original R2018 INSERT-CIRCLE-LAYER CMC ACI source, paint blocked"

      - name: P0 R2018 INSERT CIRCLE BYLAYER versus LAYER CMC independent DXF oracle
        run: |
          set -euo pipefail
          original=third_party/libredwg/test/test-data/example_2018.dwg
          oracle=third_party/libredwg/test/test-data/example_2018.dxf
          before="$(sha256sum "$original" | cut -d ' ' -f1)"
          test "$(head -c 6 "$original")" = AC1032
          test -s "$oracle"
          cmake -S core/native -B /tmp/musacad-bylayer-crosscheck -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build /tmp/musacad-bylayer-crosscheck --parallel 2
          cc -std=c11 -Wall -Wextra -Werror -Icore/native/include \
            core/native/tests/core_dwg_ac1032_insert_circle_bylayer_crosscheck_test.c \
            /tmp/musacad-bylayer-crosscheck/libmusacad_core.a -lm \
            -o /tmp/musacad-r2018-bylayer-crosscheck
          timeout 120s /tmp/musacad-r2018-bylayer-crosscheck "$original" "$oracle"
          test "$before" = "$(sha256sum "$original" | cut -d ' ' -f1)"
          echo "PASS source BYLAYER CIRCLE vs LAYER ACI; no final visibility or paint"

      - name: P0 R2018 CIRCLE source layer status bit preflight and separate DXF 70 oracle
