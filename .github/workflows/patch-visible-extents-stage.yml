name: One-shot visible extents patch

on:
  push:
    branches: [ fix-1b-hatch-geometry ]
    paths: [ '.github/workflows/patch-visible-extents-stage.yml' ]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Retry visible extents workflow 2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-1b-hatch-geometry
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Patch initial fit extents
        run: python3 .github/scripts/patch_visible_extents_stage.py
      - name: Test cumulative renderer regressions
        run: |
          rm -rf /tmp/musacad-extents && mkdir -p /tmp/musacad-extents
          javac -d /tmp/musacad-extents app/src/main/java/com/musa/cad/DxfUnits.java tests/DxfUnitsTest.java
          java -cp /tmp/musacad-extents DxfUnitsTest
          javac -d /tmp/musacad-extents app/src/main/java/com/musa/cad/DxfSnapGeometry.java tests/DxfSnapGeometryTest.java
          java -cp /tmp/musacad-extents DxfSnapGeometryTest
          javac -d /tmp/musacad-extents app/src/main/java/com/musa/cad/DxfColor.java app/src/main/java/com/musa/cad/DxfStyle.java app/src/main/java/com/musa/cad/DxfTransparency.java app/src/main/java/com/musa/cad/DxfDrawOrder.java app/src/main/java/com/musa/cad/DxfOcs.java app/src/main/java/com/musa/cad/DxfSpace.java app/src/main/java/com/musa/cad/DxfBlocks.java tests/DxfBlocksTest.java
          java -cp /tmp/musacad-extents DxfBlocksTest
          javac -d /tmp/musacad-extents app/src/main/java/com/musa/cad/DxfViewport.java tests/DxfViewportTest.java
          java -cp /tmp/musacad-extents DxfViewportTest
          javac -d /tmp/musacad-extents app/src/main/java/com/musa/cad/DxfHatchPattern.java tests/DxfHatchPatternTest.java
          java -cp /tmp/musacad-extents DxfHatchPatternTest
      - name: Fetch pinned LibreDWG for Android compile
        uses: actions/checkout@v4
        with:
          repository: LibreDWG/libredwg
          ref: 34f02f54b9aacb5708c1d3d2070efb3e4b2d8c43
          path: third_party/libredwg
      - name: Compile Android Java sources
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:compileDebugJavaWithJavac
      - name: Commit visible-layer extents
        run: |
          git config user.name 'MusaCAD CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/musa/cad/DxfParser.java
          git commit -m 'Fit drawings to visible source layers'
          git push origin HEAD:fix-1b-hatch-geometry
