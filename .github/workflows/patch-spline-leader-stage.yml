name: One-shot spline LEADER patch

on:
  push:
    branches: [ fix-1b-hatch-geometry ]
    paths: [ '.github/workflows/patch-spline-leader-stage.yml' ]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-shot spline LEADER workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-1b-hatch-geometry
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Patch spline LEADER paths
        run: python3 .github/scripts/patch_spline_leader_stage.py
      - name: Test LEADER and cumulative renderer regressions
        run: |
          rm -rf /tmp/musacad-sleader && mkdir -p /tmp/musacad-sleader
          javac -d /tmp/musacad-sleader app/src/main/java/com/musa/cad/DxfCurves.java app/src/main/java/com/musa/cad/DxfDimStyles.java app/src/main/java/com/musa/cad/DxfLeader.java tests/DxfCurvesTest.java tests/DxfDimStylesTest.java tests/DxfLeaderTest.java
          java -cp /tmp/musacad-sleader DxfCurvesTest
          java -cp /tmp/musacad-sleader DxfDimStylesTest
          java -cp /tmp/musacad-sleader DxfLeaderTest
          javac -d /tmp/musacad-sleader app/src/main/java/com/musa/cad/DxfPolylineWidth.java tests/DxfPolylineWidthTest.java
          java -cp /tmp/musacad-sleader DxfPolylineWidthTest
          javac -d /tmp/musacad-sleader app/src/main/java/com/musa/cad/DxfColor.java app/src/main/java/com/musa/cad/DxfStyle.java app/src/main/java/com/musa/cad/DxfLineTypes.java tests/DxfLineTypesTest.java
          java -cp /tmp/musacad-sleader DxfLineTypesTest
          javac -d /tmp/musacad-sleader app/src/main/java/com/musa/cad/DxfPolyMesh.java app/src/main/java/com/musa/cad/DxfFace.java tests/DxfPolyMeshTest.java tests/DxfFaceTest.java
          java -cp /tmp/musacad-sleader DxfPolyMeshTest
          java -cp /tmp/musacad-sleader DxfFaceTest
          javac -d /tmp/musacad-sleader app/src/main/java/com/musa/cad/DxfVisibility.java tests/DxfVisibilityTest.java
          java -cp /tmp/musacad-sleader DxfVisibilityTest
          javac -d /tmp/musacad-sleader app/src/main/java/com/musa/cad/DxfUnits.java tests/DxfUnitsTest.java
          java -cp /tmp/musacad-sleader DxfUnitsTest
          javac -d /tmp/musacad-sleader app/src/main/java/com/musa/cad/DxfSnapGeometry.java tests/DxfSnapGeometryTest.java
          java -cp /tmp/musacad-sleader DxfSnapGeometryTest
          javac -d /tmp/musacad-sleader app/src/main/java/com/musa/cad/DxfColor.java app/src/main/java/com/musa/cad/DxfStyle.java app/src/main/java/com/musa/cad/DxfTransparency.java app/src/main/java/com/musa/cad/DxfDrawOrder.java app/src/main/java/com/musa/cad/DxfOcs.java app/src/main/java/com/musa/cad/DxfSpace.java app/src/main/java/com/musa/cad/DxfVisibility.java app/src/main/java/com/musa/cad/DxfBlocks.java tests/DxfBlocksTest.java
          java -cp /tmp/musacad-sleader DxfBlocksTest
          javac -d /tmp/musacad-sleader app/src/main/java/com/musa/cad/DxfViewport.java tests/DxfViewportTest.java
          java -cp /tmp/musacad-sleader DxfViewportTest
          javac -d /tmp/musacad-sleader app/src/main/java/com/musa/cad/DxfHatchPattern.java tests/DxfHatchPatternTest.java
          java -cp /tmp/musacad-sleader DxfHatchPatternTest
          javac -d /tmp/musacad-sleader app/src/main/java/com/musa/cad/DxfText.java app/src/main/java/com/musa/cad/DxfTextStyles.java app/src/main/java/com/musa/cad/DxfTextLayout.java tests/DxfTextTest.java tests/DxfTextStylesTest.java tests/DxfTextLayoutTest.java
          java -cp /tmp/musacad-sleader DxfTextTest
          java -cp /tmp/musacad-sleader DxfTextStylesTest
          java -cp /tmp/musacad-sleader DxfTextLayoutTest
      - name: Fetch pinned LibreDWG for Android compile
        uses: actions/checkout@v4
        with:
          repository: LibreDWG/libredwg
          ref: 34f02f54b9aacb5708c1d3d2070efb3e4b2d8c43
          path: third_party/libredwg
      - name: Compile Android Java sources
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:compileDebugJavaWithJavac
      - name: Commit spline LEADER support
        run: |
          git config user.name 'MusaCAD CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/musa/cad/DxfParser.java
          git commit -m 'Render spline LEADER paths'
          git push origin HEAD:fix-1b-hatch-geometry
