name: One-shot MTEXT background mask patch

on:
  push:
    branches: [ fix-1b-hatch-geometry ]
    paths: [ '.github/workflows/patch-mtext-background-stage.yml' ]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-shot MTEXT background workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-1b-hatch-geometry
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Patch MTEXT background masks
        run: python3 .github/scripts/patch_mtext_background_stage.py
      - name: Test MTEXT background and cumulative renderer regressions
        run: |
          rm -rf /tmp/musacad-mtext-bg && mkdir -p /tmp/musacad-mtext-bg
          javac -d /tmp/musacad-mtext-bg app/src/main/java/com/musa/cad/DxfColor.java app/src/main/java/com/musa/cad/DxfMTextBackground.java tests/DxfMTextBackgroundTest.java
          java -cp /tmp/musacad-mtext-bg DxfMTextBackgroundTest
          javac -d /tmp/musacad-mtext-bg app/src/main/java/com/musa/cad/DxfVisibility.java tests/DxfVisibilityTest.java
          java -cp /tmp/musacad-mtext-bg DxfVisibilityTest
          javac -d /tmp/musacad-mtext-bg app/src/main/java/com/musa/cad/DxfColor.java app/src/main/java/com/musa/cad/DxfStyle.java app/src/main/java/com/musa/cad/DxfTransparency.java app/src/main/java/com/musa/cad/DxfDrawOrder.java app/src/main/java/com/musa/cad/DxfOcs.java app/src/main/java/com/musa/cad/DxfSpace.java app/src/main/java/com/musa/cad/DxfVisibility.java app/src/main/java/com/musa/cad/DxfBlocks.java tests/DxfBlocksTest.java tests/DxfExpansionLimitTest.java
          java -cp /tmp/musacad-mtext-bg DxfBlocksTest
          java -cp /tmp/musacad-mtext-bg DxfExpansionLimitTest
          javac -d /tmp/musacad-mtext-bg app/src/main/java/com/musa/cad/DxfText.java app/src/main/java/com/musa/cad/DxfTextStyles.java app/src/main/java/com/musa/cad/DxfTextLayout.java tests/DxfTextTest.java tests/DxfTextStylesTest.java tests/DxfTextLayoutTest.java
          java -cp /tmp/musacad-mtext-bg DxfTextTest
          java -cp /tmp/musacad-mtext-bg DxfTextStylesTest
          java -cp /tmp/musacad-mtext-bg DxfTextLayoutTest
          javac -d /tmp/musacad-mtext-bg app/src/main/java/com/musa/cad/DxfHatchPattern.java tests/DxfHatchPatternTest.java
          java -cp /tmp/musacad-mtext-bg DxfHatchPatternTest
          javac -d /tmp/musacad-mtext-bg app/src/main/java/com/musa/cad/DxfViewport.java tests/DxfViewportTest.java
          java -cp /tmp/musacad-mtext-bg DxfViewportTest
          javac -d /tmp/musacad-mtext-bg app/src/main/java/com/musa/cad/DxfDimStyles.java app/src/main/java/com/musa/cad/DxfCurves.java app/src/main/java/com/musa/cad/DxfLeader.java tests/DxfDimStylesTest.java tests/DxfLeaderTest.java
          java -cp /tmp/musacad-mtext-bg DxfDimStylesTest
          java -cp /tmp/musacad-mtext-bg DxfLeaderTest
          javac -d /tmp/musacad-mtext-bg app/src/main/java/com/musa/cad/DxfMLeader.java tests/DxfMLeaderTest.java
          java -cp /tmp/musacad-mtext-bg DxfMLeaderTest
      - name: Fetch pinned LibreDWG for Android compile
        uses: actions/checkout@v4
        with:
          repository: LibreDWG/libredwg
          ref: 34f02f54b9aacb5708c1d3d2070efb3e4b2d8c43
          path: third_party/libredwg
      - name: Compile Android Java sources
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:compileDebugJavaWithJavac
      - name: Commit MTEXT background support
        run: |
          git config user.name 'MusaCAD CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/musa/cad/DxfParser.java
          git commit -m 'Render MTEXT background masks'
          git push origin HEAD:fix-1b-hatch-geometry
