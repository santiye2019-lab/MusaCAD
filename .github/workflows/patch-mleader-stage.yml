name: One-shot MULTILEADER patch

on:
  push:
    branches: [ fix-1b-hatch-geometry ]
    paths: [ '.github/workflows/patch-mleader-stage.yml' ]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-shot MULTILEADER workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-1b-hatch-geometry
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Patch MULTILEADER rendering
        run: python3 .github/scripts/patch_mleader_stage.py
      - name: Test MULTILEADER and cumulative renderer regressions
        run: |
          rm -rf /tmp/musacad-mleader && mkdir -p /tmp/musacad-mleader
          javac -d /tmp/musacad-mleader app/src/main/java/com/musa/cad/DxfMLeader.java tests/DxfMLeaderTest.java
          java -cp /tmp/musacad-mleader DxfMLeaderTest
          javac -d /tmp/musacad-mleader app/src/main/java/com/musa/cad/DxfViewport.java tests/DxfViewportTest.java
          java -cp /tmp/musacad-mleader DxfViewportTest
          javac -d /tmp/musacad-mleader app/src/main/java/com/musa/cad/DxfOcs.java tests/DxfOcsTest.java
          java -cp /tmp/musacad-mleader DxfOcsTest
          javac -d /tmp/musacad-mleader app/src/main/java/com/musa/cad/DxfPolylineWidth.java tests/DxfPolylineWidthTest.java
          java -cp /tmp/musacad-mleader DxfPolylineWidthTest
          javac -d /tmp/musacad-mleader app/src/main/java/com/musa/cad/DxfCurves.java app/src/main/java/com/musa/cad/DxfDimStyles.java app/src/main/java/com/musa/cad/DxfLeader.java tests/DxfDimStylesTest.java tests/DxfLeaderTest.java
          java -cp /tmp/musacad-mleader DxfDimStylesTest
          java -cp /tmp/musacad-mleader DxfLeaderTest
          javac -d /tmp/musacad-mleader app/src/main/java/com/musa/cad/DxfInfiniteLine.java tests/DxfInfiniteLineTest.java
          java -cp /tmp/musacad-mleader DxfInfiniteLineTest
          javac -d /tmp/musacad-mleader app/src/main/java/com/musa/cad/DxfHatchPattern.java tests/DxfHatchPatternTest.java
          java -cp /tmp/musacad-mleader DxfHatchPatternTest
          javac -d /tmp/musacad-mleader app/src/main/java/com/musa/cad/DxfText.java app/src/main/java/com/musa/cad/DxfTextStyles.java app/src/main/java/com/musa/cad/DxfTextLayout.java tests/DxfTextTest.java tests/DxfTextStylesTest.java tests/DxfTextLayoutTest.java
          java -cp /tmp/musacad-mleader DxfTextTest
          java -cp /tmp/musacad-mleader DxfTextStylesTest
          java -cp /tmp/musacad-mleader DxfTextLayoutTest
          javac -d /tmp/musacad-mleader app/src/main/java/com/musa/cad/DxfColor.java app/src/main/java/com/musa/cad/DxfStyle.java app/src/main/java/com/musa/cad/DxfTransparency.java app/src/main/java/com/musa/cad/DxfDrawOrder.java app/src/main/java/com/musa/cad/DxfOcs.java app/src/main/java/com/musa/cad/DxfSpace.java app/src/main/java/com/musa/cad/DxfVisibility.java app/src/main/java/com/musa/cad/DxfBlocks.java tests/DxfBlocksTest.java
          java -cp /tmp/musacad-mleader DxfBlocksTest
      - name: Fetch pinned LibreDWG for Android compile
        uses: actions/checkout@v4
        with:
          repository: LibreDWG/libredwg
          ref: 34f02f54b9aacb5708c1d3d2070efb3e4b2d8c43
          path: third_party/libredwg
      - name: Compile Android Java sources
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:compileDebugJavaWithJavac
      - name: Commit MULTILEADER support
        run: |
          git config user.name 'MusaCAD CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/musa/cad/DxfParser.java
          git commit -m 'Render DXF MULTILEADER annotations'
          git push origin HEAD:fix-1b-hatch-geometry

# rerun after aligning the streaming patch with expanded vector-code preservation
