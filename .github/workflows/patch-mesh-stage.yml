name: One-shot modern MESH patch

on:
  push:
    branches: [ fix-1b-hatch-geometry ]
    paths: [ '.github/workflows/patch-mesh-stage.yml' ]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-shot modern MESH workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-1b-hatch-geometry
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Patch modern MESH rendering
        run: python3 .github/scripts/patch_mesh_stage.py
      - name: Test modern MESH and cumulative renderer regressions
        run: |
          rm -rf /tmp/musacad-mesh && mkdir -p /tmp/musacad-mesh
          javac -d /tmp/musacad-mesh app/src/main/java/com/musa/cad/DxfMesh.java tests/DxfMeshTest.java
          java -cp /tmp/musacad-mesh DxfMeshTest
          javac -d /tmp/musacad-mesh app/src/main/java/com/musa/cad/DxfColor.java app/src/main/java/com/musa/cad/DxfMPolygon.java tests/DxfMPolygonTest.java
          java -cp /tmp/musacad-mesh DxfMPolygonTest
          javac -d /tmp/musacad-mesh app/src/main/java/com/musa/cad/DxfHatchGradient.java tests/DxfHatchGradientTest.java
          java -cp /tmp/musacad-mesh DxfHatchGradientTest
          javac -d /tmp/musacad-mesh app/src/main/java/com/musa/cad/DxfHatchPattern.java tests/DxfHatchPatternTest.java
          java -cp /tmp/musacad-mesh DxfHatchPatternTest
          javac -d /tmp/musacad-mesh app/src/main/java/com/musa/cad/DxfPolyMesh.java app/src/main/java/com/musa/cad/DxfFace.java tests/DxfPolyMeshTest.java tests/DxfFaceTest.java
          java -cp /tmp/musacad-mesh DxfPolyMeshTest
          java -cp /tmp/musacad-mesh DxfFaceTest
          javac -d /tmp/musacad-mesh app/src/main/java/com/musa/cad/DxfViewport.java app/src/main/java/com/musa/cad/DxfViewportClip.java tests/DxfViewportTest.java tests/DxfViewportClipTest.java
          java -cp /tmp/musacad-mesh DxfViewportTest
          java -cp /tmp/musacad-mesh DxfViewportClipTest
          javac -d /tmp/musacad-mesh app/src/main/java/com/musa/cad/DxfCurves.java tests/DxfCurvesTest.java
          java -cp /tmp/musacad-mesh DxfCurvesTest
          javac -d /tmp/musacad-mesh app/src/main/java/com/musa/cad/DxfText.java app/src/main/java/com/musa/cad/DxfTextStyles.java app/src/main/java/com/musa/cad/DxfTextLayout.java tests/DxfTextTest.java tests/DxfTextStylesTest.java tests/DxfTextLayoutTest.java
          java -cp /tmp/musacad-mesh DxfTextTest
          java -cp /tmp/musacad-mesh DxfTextStylesTest
          java -cp /tmp/musacad-mesh DxfTextLayoutTest
          javac -d /tmp/musacad-mesh app/src/main/java/com/musa/cad/DxfColor.java app/src/main/java/com/musa/cad/DxfStyle.java app/src/main/java/com/musa/cad/DxfTransparency.java app/src/main/java/com/musa/cad/DxfDrawOrder.java app/src/main/java/com/musa/cad/DxfOcs.java app/src/main/java/com/musa/cad/DxfSpace.java app/src/main/java/com/musa/cad/DxfVisibility.java app/src/main/java/com/musa/cad/DxfBlocks.java tests/DxfBlocksTest.java tests/DxfExpansionLimitTest.java
          java -cp /tmp/musacad-mesh DxfBlocksTest
          java -cp /tmp/musacad-mesh DxfExpansionLimitTest
      - name: Fetch pinned LibreDWG for Android compile
        uses: actions/checkout@v4
        with:
          repository: LibreDWG/libredwg
          ref: 34f02f54b9aacb5708c1d3d2070efb3e4b2d8c43
          path: third_party/libredwg
      - name: Compile Android Java sources
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:compileDebugJavaWithJavac
      - name: Commit modern MESH support
        run: |
          git config user.name 'MusaCAD CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/musa/cad/DxfParser.java
          git commit -m 'Render modern MESH wireframes'
          git push origin HEAD:fix-1b-hatch-geometry

# retry after correcting the invalid-reference regression expectation
