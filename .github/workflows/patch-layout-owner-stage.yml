name: One-shot layout owner patch
# retry after updating the paper-layout owner regression fixture

on:
  push:
    branches: [ fix-1b-hatch-geometry ]
    paths: [ '.github/workflows/patch-layout-owner-stage.yml' ]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-shot layout owner workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-1b-hatch-geometry
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Patch layout owner resolution
        run: python3 .github/scripts/patch_layout_owner_stage.py
      - name: Test layout owners and cumulative regressions
        run: |
          rm -rf /tmp/musacad-layout-owner && mkdir -p /tmp/musacad-layout-owner
          javac -d /tmp/musacad-layout-owner app/src/main/java/com/musa/cad/DxfSpace.java tests/DxfSpaceTest.java
          java -cp /tmp/musacad-layout-owner DxfSpaceTest
          javac -d /tmp/musacad-layout-owner app/src/main/java/com/musa/cad/DxfColor.java app/src/main/java/com/musa/cad/DxfStyle.java app/src/main/java/com/musa/cad/DxfTransparency.java app/src/main/java/com/musa/cad/DxfDrawOrder.java app/src/main/java/com/musa/cad/DxfOcs.java app/src/main/java/com/musa/cad/DxfSpace.java app/src/main/java/com/musa/cad/DxfBlocks.java tests/DxfBlocksTest.java
          java -cp /tmp/musacad-layout-owner DxfBlocksTest
          javac -d /tmp/musacad-layout-owner app/src/main/java/com/musa/cad/DxfViewport.java tests/DxfViewportTest.java
          java -cp /tmp/musacad-layout-owner DxfViewportTest
          javac -d /tmp/musacad-layout-owner app/src/main/java/com/musa/cad/DxfHatchPattern.java tests/DxfHatchPatternTest.java
          java -cp /tmp/musacad-layout-owner DxfHatchPatternTest
          javac -d /tmp/musacad-layout-owner app/src/main/java/com/musa/cad/DxfText.java app/src/main/java/com/musa/cad/DxfTextStyles.java app/src/main/java/com/musa/cad/DxfTextLayout.java tests/DxfTextTest.java tests/DxfTextStylesTest.java tests/DxfTextLayoutTest.java
          java -cp /tmp/musacad-layout-owner DxfTextTest
          java -cp /tmp/musacad-layout-owner DxfTextStylesTest
          java -cp /tmp/musacad-layout-owner DxfTextLayoutTest
      - name: Fetch pinned LibreDWG for Android compile
        uses: actions/checkout@v4
        with:
          repository: LibreDWG/libredwg
          ref: 34f02f54b9aacb5708c1d3d2070efb3e4b2d8c43
          path: third_party/libredwg
      - name: Compile Android Java sources
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:compileDebugJavaWithJavac
      - name: Commit layout owner support
        run: |
          git config user.name 'MusaCAD CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/musa/cad/DxfBlocks.java app/src/main/java/com/musa/cad/DxfParser.java tests/DxfBlocksTest.java
          git commit -m 'Resolve paper layouts through owner handles'
          git push origin HEAD:fix-1b-hatch-geometry
