name: Gandalf production validation
on:
  push:
    branches: [main]
    paths:
      - 'server/ai-worker/**'
      - '.github/workflows/gandalf-production.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check && npm test
        working-directory: server/ai-worker
