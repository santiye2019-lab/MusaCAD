name: Gandalf production validation
on:
  push:
    branches: [main]
    paths:
      - 'server/ai-worker/**'
      - '.github/workflows/gandalf-production.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check && npm test
        working-directory: server/ai-worker
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: gandalf-production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy verified Gandalf Worker
        working-directory: server/ai-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@3 deploy src/index.js --name musacad-ai --compatibility-date 2026-09-01 --keep-vars
