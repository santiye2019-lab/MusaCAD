name: Isolated Qwen 24-hour developer pilot

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy isolated pilot or delete it
        required: true
        type: choice
        default: deploy
        options:
          - deploy
          - remove
      release_approved:
        description: "Final acceptance complete and APK creation explicitly approved"
        type: boolean
        required: false
        default: false
      build_pilot_apk:
        description: "Optional signed 24h APK; installing may replace your current MusaCAD"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: musacad-qwen-pilot
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.operation == 'deploy'
    runs-on: ubuntu-latest
    outputs:
      ai_url: ${{ steps.pilot_deploy.outputs.ai_url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
      MUSACAD_TRIAL_PUBLIC_KEY_PEM: ${{ secrets.MUSACAD_TRIAL_PUBLIC_KEY_PEM }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_AI_API_TOKEN"
          test -n "$MUSACAD_TRIAL_PUBLIC_KEY_PEM"
          if ! [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "::error::Cloudflare account ID is invalid"; exit 1
          fi
      - name: Live Qwen readiness probe (no deployment)
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/qwen-pilot-preflight.json <<'EOF'
          {"model":"@cf/qwen/qwen3.8-27b","messages":[{"role":"user","content":"Türkçe HAZIR yaz."}],"reasoning_effort":"low","max_completion_tokens":1536,"stream":false}
          EOF
          status="$(curl --silent --show-error --max-time 75             -o /tmp/qwen-pilot-preflight-response.json -w '%{http_code}'             -X POST -H "Authorization: Bearer $CLOUDFLARE_AI_API_TOKEN"             -H 'Content-Type: application/json'             --data-binary @/tmp/qwen-pilot-preflight.json             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/v1/chat/completions" || true)"
          if [ "$status" != 200 ]; then
            echo "::error::Cloudflare Qwen preflight HTTP $status; no deployment"; exit 1
          fi
          python3 - <<'PY'
          import json
          data=json.load(open("/tmp/qwen-pilot-preflight-response.json"))
          result=data.get("result") or data
          choices=result.get("choices") or []
          msg=choices[0].get("message",{}) if choices else {}
          content=msg.get("content")
          answer=content if isinstance(content,str) else (
              " ".join(p.get("text","") for p in content if isinstance(p,dict))
              if isinstance(content,list) else "")
          if not answer.strip(): raise SystemExit("Empty Qwen answer; no deployment.")
          print("Qwen readiness PASS (response redacted).")
          PY
      - name: Verify Worker test suite
        working-directory: server/ai-worker
        run: npm test
      - name: Deploy DIFFERENT Worker with expiring access
        id: pilot_deploy
        shell: bash
        working-directory: server/ai-worker
        run: |
          set -euo pipefail
          expiry_ms="$(($(date -u -d '+24 hours' +%s) * 1000))"
          expiry_utc="$(date -u -d "@$((expiry_ms / 1000))" +%Y-%m-%dT%H:%M:%SZ)"
          cat > wrangler.toml <<EOF
          name = "musacad-qwen-pilot"
          main = "src/index.js"
          compatibility_date = "2026-09-01"

          [vars]
          AI_PROVIDER = "cloudflare"
          CLOUDFLARE_AI_ACCOUNT_ID = "$CLOUDFLARE_ACCOUNT_ID"
          AI_MAX_OUTPUT_TOKENS = "3200"
          # Pilot only; stay below the Android client's 90-second socket budget.
          AI_UPSTREAM_TIMEOUT_MS = "72000"
          MUSACAD_PILOT_DEVELOPER_ONLY = "true"
          MUSACAD_PILOT_EXPIRES_AT_MS = "$expiry_ms"
          EOF
          npx --yes wrangler@latest deploy --name musacad-qwen-pilot             2>&1 | tee /tmp/qwen-pilot-deploy.log
          printf '%s' "$CLOUDFLARE_AI_API_TOKEN"             | npx --yes wrangler@latest secret put CLOUDFLARE_AI_API_TOKEN --name musacad-qwen-pilot >/dev/null
          printf '%s' "$MUSACAD_TRIAL_PUBLIC_KEY_PEM"             | npx --yes wrangler@latest secret put MUSACAD_AI_SESSION_PUBLIC_KEY_PEM --name musacad-qwen-pilot >/dev/null
          base="$(grep -Eo 'https://[A-Za-z0-9._-]+[.]workers[.]dev' /tmp/qwen-pilot-deploy.log | tail -1 || true)"
          if [ -z "$base" ] || [[ "$base" != https://musacad-qwen-pilot.*.workers.dev ]]; then
            echo "::error::Expected separate pilot Worker URL not found"; exit 1
          fi
          # Cloudflare may need a short time to propagate a new Worker and
          # newly uploaded secrets. Never weaken either safety assertion.
          health="000"
          denied="000"
          for attempt in $(seq 1 18); do
            health="$(curl -sS --connect-timeout 5 --max-time 12 -o /tmp/pilot-health.json -w '%{http_code}' "$base/health" 2>/dev/null || true)"
            denied="$(curl -sS --connect-timeout 5 --max-time 12 -o /tmp/pilot-deny.json -w '%{http_code}' \
              -X POST -H 'Content-Type: application/json' -d '{}' "$base/v1/analyze" 2>/dev/null || true)"
            echo "Readiness attempt $attempt/18: health HTTP ${health:-000}, unauthorized analyze HTTP ${denied:-000}"
            if [ "$health" = 200 ] && [ "$denied" = 401 ]; then
              break
            fi
            if [ "$attempt" -lt 18 ]; then sleep 5; fi
          done
          if [ "$health" != 200 ] || [ "$denied" != 401 ]; then
            echo "::error::Pilot readiness failed: health HTTP ${health:-000} (expected 200), unauthorized analyze HTTP ${denied:-000} (expected 401)"
            echo "::error::HTTP 000 indicates DNS/connectivity trouble; 403 may mean workers.dev access is disabled; 503 can mean missing or not-yet-propagated AI/session secrets."
            exit 1
          fi
          echo "ai_url=$base/v1/analyze" >> "$GITHUB_OUTPUT"
          {
            echo "## Qwen pilot available (no production Worker modified)"
            echo "- Pilot URL: $base/v1/analyze"
            echo "- Expires UTC: $expiry_utc (enforced at each analysis request)"
            echo "- Access: signed MAI2 developer session only"
            echo "- Model: Cloudflare Qwen 3.8 27B; quota/cost still applies"
            echo "- No user DWG was sent; no APK was built."
            echo "- To delete the Worker, rerun this workflow with operation=remove."
          } >> "$GITHUB_STEP_SUMMARY"

  remove:
    if: inputs.operation == 'remove'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Delete pilot only
        working-directory: server/ai-worker
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@latest delete --name musacad-qwen-pilot --force

  pilot-apk:
    needs: deploy
    if: inputs.operation == 'deploy' && inputs.build_pilot_apk == true && inputs.release_approved == true
    runs-on: ubuntu-latest
    env:
      MUSACAD_PRODUCTION_RELEASE: "true"
      MUSACAD_KEYSTORE_FILE: /tmp/musacad-pilot-release.jks
      MUSACAD_RELEASE_KEYSTORE_B64: ${{ secrets.MUSACAD_RELEASE_KEYSTORE_B64 }}
      MUSACAD_KEYSTORE_PASSWORD: ${{ secrets.MUSACAD_KEYSTORE_PASSWORD }}
      MUSACAD_KEY_ALIAS: ${{ secrets.MUSACAD_KEY_ALIAS }}
      MUSACAD_KEY_PASSWORD: ${{ secrets.MUSACAD_KEY_PASSWORD }}
      MUSACAD_TRIAL_API_URL: ${{ secrets.MUSACAD_TRIAL_API_URL }}
      MUSACAD_TRIAL_PUBLIC_KEY_PEM: ${{ secrets.MUSACAD_TRIAL_PUBLIC_KEY_PEM }}
      MUSACAD_AI_API_URL: ${{ needs.deploy.outputs.ai_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Confirm pilot endpoint and release credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in MUSACAD_RELEASE_KEYSTORE_B64 MUSACAD_KEYSTORE_PASSWORD MUSACAD_KEY_ALIAS MUSACAD_KEY_PASSWORD MUSACAD_TRIAL_API_URL MUSACAD_TRIAL_PUBLIC_KEY_PEM MUSACAD_AI_API_URL; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required signing or pilot value: $name"; exit 1
            fi
          done
          if [[ "$MUSACAD_AI_API_URL" != https://musacad-qwen-pilot.*.workers.dev/v1/analyze ]]; then
            echo "::error::Refusing APK with an unexpected AI host"; exit 1
          fi
          case "$MUSACAD_TRIAL_API_URL" in
            https://*/v1/trial/start) ;;
            *) echo "::error::Invalid license service URL"; exit 1 ;;
          esac
          echo "MUSACAD_AI_SESSION_URL=${MUSACAD_TRIAL_API_URL%/v1/trial/start}/v1/ai/session" >> "$GITHUB_ENV"
          printf '%s' "$MUSACAD_RELEASE_KEYSTORE_B64" | base64 -d > "$MUSACAD_KEYSTORE_FILE"
          chmod 600 "$MUSACAD_KEYSTORE_FILE"
          keytool -list -keystore "$MUSACAD_KEYSTORE_FILE" -storepass "$MUSACAD_KEYSTORE_PASSWORD" -alias "$MUSACAD_KEY_ALIAS" >/dev/null
      - uses: actions/checkout@v4
        with:
          repository: LibreDWG/libredwg
          ref: 34f02f54b9aacb5708c1d3d2070efb3e4b2d8c43
          path: third_party/libredwg
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build signed PILOT APK (not released)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleDirectRelease
          apk="app/build/outputs/apk/direct/release/app-direct-release.apk"
          test -s "$apk"
          cp "$apk" /tmp/MusaCAD-Qwen-pilot-24h.apk
          sha256sum /tmp/MusaCAD-Qwen-pilot-24h.apk > /tmp/MusaCAD-Qwen-pilot-24h.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: MusaCAD-Qwen-24h-PILOT-signed
          path: |
            /tmp/MusaCAD-Qwen-pilot-24h.apk
            /tmp/MusaCAD-Qwen-pilot-24h.sha256
          retention-days: 2
          if-no-files-found: error
      - name: Warn about installation
        shell: bash
        run: |
          {
            echo '## Signed Qwen PILOT APK – test only'
            echo '- This APK uses the same package ID as production MusaCAD.'
            echo '- Installing can replace your installed MusaCAD. Back up local data first.'
            echo '- Its Qwen endpoint expires 24h after pilot deployment, then returns denied.'
            echo '- Reinstall the stable APK when the test finishes.'
            echo '- Nothing was automatically installed or published.'
          } >> "$GITHUB_STEP_SUMMARY"
