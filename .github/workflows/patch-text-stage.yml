name: One-shot text renderer patch

on:
  push:
    branches: [ fix-1b-hatch-geometry ]
    paths: [ '.github/workflows/patch-text-stage.yml' ]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-shot text renderer workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-1b-hatch-geometry
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Patch TEXT and MTEXT rendering
        run: python3 .github/scripts/patch_text_stage.py
      - name: Test text decoding, styles and alignment
        run: |
          rm -rf /tmp/musacad-text-test && mkdir -p /tmp/musacad-text-test
          javac -d /tmp/musacad-text-test app/src/main/java/com/musa/cad/DxfText.java app/src/main/java/com/musa/cad/DxfTextStyles.java app/src/main/java/com/musa/cad/DxfTextLayout.java tests/DxfTextTest.java tests/DxfTextStylesTest.java tests/DxfTextLayoutTest.java
          java -cp /tmp/musacad-text-test DxfTextTest
          java -cp /tmp/musacad-text-test DxfTextStylesTest
          java -cp /tmp/musacad-text-test DxfTextLayoutTest
      - name: Test geometry regressions
        run: |
          javac -d /tmp/musacad-text-test app/src/main/java/com/musa/cad/DxfColor.java app/src/main/java/com/musa/cad/DxfStyle.java app/src/main/java/com/musa/cad/DxfOcs.java app/src/main/java/com/musa/cad/DxfBlocks.java tests/DxfOcsTest.java tests/DxfBlocksTest.java
          java -cp /tmp/musacad-text-test DxfOcsTest
          java -cp /tmp/musacad-text-test DxfBlocksTest
      - name: Fetch pinned LibreDWG for Android compile
        uses: actions/checkout@v4
        with:
          repository: LibreDWG/libredwg
          ref: 34f02f54b9aacb5708c1d3d2070efb3e4b2d8c43
          path: third_party/libredwg
      - name: Compile Android Java sources
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:compileDebugJavaWithJavac
      - name: Commit text renderer
        run: |
          git config user.name 'MusaCAD CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/musa/cad/DxfParser.java
          git commit -m 'Render DXF text styles and alignment'
          git push origin HEAD:fix-1b-hatch-geometry
