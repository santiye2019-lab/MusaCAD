name: One-shot viewport snap patch

on:
  push:
    branches: [ fix-1b-hatch-geometry ]
    paths: [ '.github/workflows/patch-viewport-snap-stage.yml' ]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-shot viewport snap workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-1b-hatch-geometry
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Patch snapping through viewport transforms
        run: python3 .github/scripts/patch_viewport_snap_stage.py
      - name: Test viewport clipping and previous renderer features
        run: |
          rm -rf /tmp/musacad-vpsnap && mkdir -p /tmp/musacad-vpsnap
          javac -d /tmp/musacad-vpsnap app/src/main/java/com/musa/cad/DxfViewport.java tests/DxfViewportTest.java
          java -cp /tmp/musacad-vpsnap DxfViewportTest
          javac -d /tmp/musacad-vpsnap app/src/main/java/com/musa/cad/DxfSpace.java tests/DxfSpaceTest.java
          java -cp /tmp/musacad-vpsnap DxfSpaceTest
          javac -d /tmp/musacad-vpsnap app/src/main/java/com/musa/cad/DxfColor.java app/src/main/java/com/musa/cad/DxfStyle.java app/src/main/java/com/musa/cad/DxfTransparency.java app/src/main/java/com/musa/cad/DxfLayerTable.java tests/DxfLayerTableTest.java
          java -cp /tmp/musacad-vpsnap DxfLayerTableTest
          javac -d /tmp/musacad-vpsnap app/src/main/java/com/musa/cad/DxfColor.java app/src/main/java/com/musa/cad/DxfStyle.java app/src/main/java/com/musa/cad/DxfTransparency.java app/src/main/java/com/musa/cad/DxfDrawOrder.java app/src/main/java/com/musa/cad/DxfOcs.java app/src/main/java/com/musa/cad/DxfSpace.java app/src/main/java/com/musa/cad/DxfBlocks.java tests/DxfBlocksTest.java
          java -cp /tmp/musacad-vpsnap DxfBlocksTest
          javac -d /tmp/musacad-vpsnap app/src/main/java/com/musa/cad/DxfHatchPattern.java tests/DxfHatchPatternTest.java
          java -cp /tmp/musacad-vpsnap DxfHatchPatternTest
          javac -d /tmp/musacad-vpsnap app/src/main/java/com/musa/cad/DxfText.java app/src/main/java/com/musa/cad/DxfTextStyles.java app/src/main/java/com/musa/cad/DxfTextLayout.java tests/DxfTextTest.java tests/DxfTextStylesTest.java tests/DxfTextLayoutTest.java
          java -cp /tmp/musacad-vpsnap DxfTextTest
          java -cp /tmp/musacad-vpsnap DxfTextStylesTest
          java -cp /tmp/musacad-vpsnap DxfTextLayoutTest
      - name: Fetch pinned LibreDWG for Android compile
        uses: actions/checkout@v4
        with:
          repository: LibreDWG/libredwg
          ref: 34f02f54b9aacb5708c1d3d2070efb3e4b2d8c43
          path: third_party/libredwg
      - name: Compile Android Java sources
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:compileDebugJavaWithJavac
      - name: Commit viewport snapping
        run: |
          git config user.name 'MusaCAD CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/musa/cad/DxfParser.java
          git commit -m 'Snap to visible geometry inside paper viewports'
          git push origin HEAD:fix-1b-hatch-geometry
