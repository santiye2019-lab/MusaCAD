name: One-shot viewport freeze patch

on:
  push:
    branches: [ fix-1b-hatch-geometry ]
    paths: [ '.github/workflows/patch-viewport-freeze-stage.yml' ]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-shot viewport freeze workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-1b-hatch-geometry
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Patch per-viewport frozen layers
        run: python3 .github/scripts/patch_viewport_freeze_stage.py
      - name: Test layer handles, viewports and cumulative regressions
        run: |
          rm -rf /tmp/musacad-vpfreeze && mkdir -p /tmp/musacad-vpfreeze
          javac -d /tmp/musacad-vpfreeze app/src/main/java/com/musa/cad/DxfColor.java app/src/main/java/com/musa/cad/DxfStyle.java app/src/main/java/com/musa/cad/DxfTransparency.java app/src/main/java/com/musa/cad/DxfLayerTable.java tests/DxfLayerTableTest.java
          java -cp /tmp/musacad-vpfreeze DxfLayerTableTest
          javac -d /tmp/musacad-vpfreeze app/src/main/java/com/musa/cad/DxfViewport.java tests/DxfViewportTest.java
          java -cp /tmp/musacad-vpfreeze DxfViewportTest
          javac -d /tmp/musacad-vpfreeze app/src/main/java/com/musa/cad/DxfSpace.java tests/DxfSpaceTest.java
          java -cp /tmp/musacad-vpfreeze DxfSpaceTest
          javac -d /tmp/musacad-vpfreeze app/src/main/java/com/musa/cad/DxfColor.java app/src/main/java/com/musa/cad/DxfStyle.java app/src/main/java/com/musa/cad/DxfTransparency.java app/src/main/java/com/musa/cad/DxfDrawOrder.java app/src/main/java/com/musa/cad/DxfOcs.java app/src/main/java/com/musa/cad/DxfSpace.java app/src/main/java/com/musa/cad/DxfBlocks.java tests/DxfBlocksTest.java
          java -cp /tmp/musacad-vpfreeze DxfBlocksTest
          javac -d /tmp/musacad-vpfreeze app/src/main/java/com/musa/cad/DxfHatchPattern.java tests/DxfHatchPatternTest.java
          java -cp /tmp/musacad-vpfreeze DxfHatchPatternTest
          javac -d /tmp/musacad-vpfreeze app/src/main/java/com/musa/cad/DxfText.java app/src/main/java/com/musa/cad/DxfTextStyles.java app/src/main/java/com/musa/cad/DxfTextLayout.java tests/DxfTextTest.java tests/DxfTextStylesTest.java tests/DxfTextLayoutTest.java
          java -cp /tmp/musacad-vpfreeze DxfTextTest
          java -cp /tmp/musacad-vpfreeze DxfTextStylesTest
          java -cp /tmp/musacad-vpfreeze DxfTextLayoutTest
      - name: Fetch pinned LibreDWG for Android compile
        uses: actions/checkout@v4
        with:
          repository: LibreDWG/libredwg
          ref: 34f02f54b9aacb5708c1d3d2070efb3e4b2d8c43
          path: third_party/libredwg
      - name: Compile Android Java sources
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:compileDebugJavaWithJavac
      - name: Commit viewport layer isolation
        run: |
          git config user.name 'MusaCAD CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/musa/cad/DxfParser.java
          git commit -m 'Honor layers frozen in individual viewports'
          git push origin HEAD:fix-1b-hatch-geometry
