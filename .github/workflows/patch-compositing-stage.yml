name: One-shot compositing patch

on:
  push:
    branches: [ fix-1b-hatch-geometry ]
    paths: [ '.github/workflows/patch-compositing-stage.yml' ]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-shot compositing workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-1b-hatch-geometry
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Patch transparency, SOLID fill and draw order
        run: python3 .github/scripts/patch_compositing_stage.py
      - name: Test transparency and draw order
        run: |
          rm -rf /tmp/musacad-composite-test && mkdir -p /tmp/musacad-composite-test
          javac -d /tmp/musacad-composite-test app/src/main/java/com/musa/cad/DxfColor.java app/src/main/java/com/musa/cad/DxfTransparency.java app/src/main/java/com/musa/cad/DxfDrawOrder.java tests/DxfTransparencyTest.java tests/DxfDrawOrderTest.java
          java -cp /tmp/musacad-composite-test DxfTransparencyTest
          java -cp /tmp/musacad-composite-test DxfDrawOrderTest
      - name: Test layer table and block inheritance
        run: |
          javac -d /tmp/musacad-composite-test app/src/main/java/com/musa/cad/DxfColor.java app/src/main/java/com/musa/cad/DxfStyle.java app/src/main/java/com/musa/cad/DxfTransparency.java app/src/main/java/com/musa/cad/DxfDrawOrder.java app/src/main/java/com/musa/cad/DxfLayerTable.java app/src/main/java/com/musa/cad/DxfOcs.java app/src/main/java/com/musa/cad/DxfBlocks.java tests/DxfLayerTableTest.java tests/DxfBlocksTest.java
          java -cp /tmp/musacad-composite-test DxfLayerTableTest
          java -cp /tmp/musacad-composite-test DxfBlocksTest
      - name: Test geometry regressions
        run: |
          javac -d /tmp/musacad-composite-test app/src/main/java/com/musa/cad/DxfHatchPattern.java tests/DxfHatchPatternTest.java
          java -cp /tmp/musacad-composite-test DxfHatchPatternTest
          javac -d /tmp/musacad-composite-test app/src/main/java/com/musa/cad/DxfOcs.java tests/DxfOcsTest.java
          java -cp /tmp/musacad-composite-test DxfOcsTest
      - name: Fetch pinned LibreDWG for Android compile
        uses: actions/checkout@v4
        with:
          repository: LibreDWG/libredwg
          ref: 34f02f54b9aacb5708c1d3d2070efb3e4b2d8c43
          path: third_party/libredwg
      - name: Compile Android Java sources
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:compileDebugJavaWithJavac
      - name: Commit compositing renderer
        run: |
          git config user.name 'MusaCAD CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/musa/cad/DxfParser.java app/src/main/java/com/musa/cad/DxfBlocks.java app/src/main/java/com/musa/cad/DxfLayerTable.java tests/DxfLayerTableTest.java tests/DxfBlocksTest.java .github/workflows/android.yml
          git commit -m 'Render transparency fills and DXF draw order'
          git push origin HEAD:fix-1b-hatch-geometry
