name: MusaCAD SHA-1 Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/musacad-sha1.yml'
      - 'debug-signing/musacad-debug.keystore'

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Show debug signing certificate SHA-1
        run: |
          test -f debug-signing/musacad-debug.keystore
          keytool -list -v -keystore debug-signing/musacad-debug.keystore -alias androiddebugkey -storepass android -keypass android | grep 'SHA1:'
