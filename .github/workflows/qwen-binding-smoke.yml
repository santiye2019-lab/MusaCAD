name: Cleanup temporary Qwen test Worker
on:
  push:
    branches: [test/cloudflare-qwen-binding-smoke]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Safely delete only named temporary worker via Cloudflare API
        shell: bash
        run: |
          set -euo pipefail
          name="musacad-qwen-smoke-37958927717"
          url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$name"
          code="$(curl --silent --show-error --max-time 25 \
            --request DELETE --output /tmp/musacad-qwen-cleanup-response.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$url" || true)"
          echo "Cleanup API status: HTTP $code"
          if [ "$code" = 404 ] || [ "$code" = 200 ] || [ "$code" = 204 ]; then
            echo "Temporary Worker absent or successfully deleted."
            exit 0
          fi
          python3 - <<'PY'
          import json
          try:
              data=json.load(open('/tmp/musacad-qwen-cleanup-response.json'))
              print('Cloudflare error codes:',[v.get('code') for v in data.get('errors',[])])
          except Exception: print('No readable Cloudflare cleanup error payload')
          PY
          echo "::error::Temporary Worker cleanup unconfirmed."
          exit 1
