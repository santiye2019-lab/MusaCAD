name: One-shot POINT style patch

on:
  push:
    branches: [ fix-1b-hatch-geometry ]
    paths: [ '.github/workflows/patch-point-style-stage.yml' ]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-shot POINT style workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-1b-hatch-geometry
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Patch POINT display styles
        run: python3 .github/scripts/patch_point_style_stage.py
      - name: Test POINT styles and cumulative renderer regressions
        run: |
          rm -rf /tmp/musacad-point && mkdir -p /tmp/musacad-point
          javac -d /tmp/musacad-point app/src/main/java/com/musa/cad/DxfPointStyle.java tests/DxfPointStyleTest.java
          java -cp /tmp/musacad-point DxfPointStyleTest
          javac -d /tmp/musacad-point app/src/main/java/com/musa/cad/DxfFace.java tests/DxfFaceTest.java
          java -cp /tmp/musacad-point DxfFaceTest
          javac -d /tmp/musacad-point app/src/main/java/com/musa/cad/DxfPolyMesh.java tests/DxfPolyMeshTest.java
          java -cp /tmp/musacad-point DxfPolyMeshTest
          javac -d /tmp/musacad-point app/src/main/java/com/musa/cad/DxfColor.java app/src/main/java/com/musa/cad/DxfStyle.java app/src/main/java/com/musa/cad/DxfLineTypes.java tests/DxfLineTypesTest.java
          java -cp /tmp/musacad-point DxfLineTypesTest
          javac -d /tmp/musacad-point app/src/main/java/com/musa/cad/DxfVisibility.java tests/DxfVisibilityTest.java
          java -cp /tmp/musacad-point DxfVisibilityTest
          javac -d /tmp/musacad-point app/src/main/java/com/musa/cad/DxfUnits.java tests/DxfUnitsTest.java
          java -cp /tmp/musacad-point DxfUnitsTest
          javac -d /tmp/musacad-point app/src/main/java/com/musa/cad/DxfSnapGeometry.java tests/DxfSnapGeometryTest.java
          java -cp /tmp/musacad-point DxfSnapGeometryTest
          javac -d /tmp/musacad-point app/src/main/java/com/musa/cad/DxfColor.java app/src/main/java/com/musa/cad/DxfStyle.java app/src/main/java/com/musa/cad/DxfTransparency.java app/src/main/java/com/musa/cad/DxfDrawOrder.java app/src/main/java/com/musa/cad/DxfOcs.java app/src/main/java/com/musa/cad/DxfSpace.java app/src/main/java/com/musa/cad/DxfVisibility.java app/src/main/java/com/musa/cad/DxfBlocks.java tests/DxfBlocksTest.java
          java -cp /tmp/musacad-point DxfBlocksTest
          javac -d /tmp/musacad-point app/src/main/java/com/musa/cad/DxfViewport.java tests/DxfViewportTest.java
          java -cp /tmp/musacad-point DxfViewportTest
          javac -d /tmp/musacad-point app/src/main/java/com/musa/cad/DxfHatchPattern.java tests/DxfHatchPatternTest.java
          java -cp /tmp/musacad-point DxfHatchPatternTest
          javac -d /tmp/musacad-point app/src/main/java/com/musa/cad/DxfText.java app/src/main/java/com/musa/cad/DxfTextStyles.java app/src/main/java/com/musa/cad/DxfTextLayout.java tests/DxfTextTest.java tests/DxfTextStylesTest.java tests/DxfTextLayoutTest.java
          java -cp /tmp/musacad-point DxfTextTest
          java -cp /tmp/musacad-point DxfTextStylesTest
          java -cp /tmp/musacad-point DxfTextLayoutTest
      - name: Fetch pinned LibreDWG for Android compile
        uses: actions/checkout@v4
        with:
          repository: LibreDWG/libredwg
          ref: 34f02f54b9aacb5708c1d3d2070efb3e4b2d8c43
          path: third_party/libredwg
      - name: Compile Android Java sources
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:compileDebugJavaWithJavac
      - name: Commit POINT style support
        run: |
          git config user.name 'MusaCAD CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/musa/cad/DxfParser.java
          git commit -m 'Honor DXF point display mode and size'
          git push origin HEAD:fix-1b-hatch-geometry
