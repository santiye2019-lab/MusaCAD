name: One-shot layer table patch

on:
  push:
    branches: [ fix-1b-hatch-geometry ]
    paths: [ '.github/workflows/patch-layer-stage.yml' ]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-shot layer table patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-1b-hatch-geometry
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Patch layer metadata into renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/musa/cad/DxfParser.java')
          s=p.read_text()
          reps=[]
          reps.append((
          '''        Map<String,Integer> layerColors=readLayerColors(lines);\n        DxfBlocks.Result expanded=DxfBlocks.expand(lines);\n        ArrayList<Entity> entities=new ArrayList<>();Set<String> layers=new HashSet<>();''',
          '''        DxfLayerTable.Table layerTable=DxfLayerTable.parse(lines);\n        Map<String,Integer> layerColors=layerTable.colors;\n        DxfBlocks.Result expanded=DxfBlocks.expand(lines);\n        ArrayList<Entity> entities=new ArrayList<>();\n        Set<String> layers=new HashSet<>(layerTable.names);\n        Set<String> visibleLayers=new HashSet<>(layerTable.visible);'''))
          reps.append((
          '''            entities.add(new LayerEntity(new Transformed(entity,item.transform),item.layer,color));layers.add(item.layer);\n        }\n        return finishEntities(entities,layers,skipped);''',
          '''            entities.add(new LayerEntity(new Transformed(entity,item.transform),item.layer,color));\n            if(layers.add(item.layer)&&!layerTable.contains(item.layer))visibleLayers.add(item.layer);\n        }\n        return finishEntities(entities,layers,visibleLayers,skipped);'''))
          reps.append((
          '''        final HashMap<String,StreamBlock> blocks=new HashMap<>();\n        final HashMap<String,Integer> layerColors=new HashMap<>();\n        final ArrayList<StreamNode> roots=new ArrayList<>();''',
          '''        final HashMap<String,StreamBlock> blocks=new HashMap<>();\n        final DxfLayerTable.Table layerTable=new DxfLayerTable.Table();\n        final ArrayList<StreamNode> roots=new ArrayList<>();'''))
          reps.append((
          '''        finishPending(context);\n        ArrayList<Entity> entities=new ArrayList<>();Set<String> layers=new HashSet<>();\n        StreamCounter counter=new StreamCounter();\n        expandStream(context.roots,new DxfBlocks.Transform(),"0",null,context.blocks,new HashSet<>(),entities,layers,counter,context);\n        return finishEntities(entities,layers,context.skipped);''',
          '''        finishPending(context);\n        context.layerTable.ensureDefaultLayer();\n        ArrayList<Entity> entities=new ArrayList<>();\n        Set<String> layers=new HashSet<>(context.layerTable.names);\n        Set<String> visibleLayers=new HashSet<>(context.layerTable.visible);\n        StreamCounter counter=new StreamCounter();\n        expandStream(context.roots,new DxfBlocks.Transform(),"0",null,context.blocks,new HashSet<>(),entities,layers,visibleLayers,counter,context);\n        return finishEntities(entities,layers,visibleLayers,context.skipped);'''))
          reps.append((
          '''        if("LAYER".equals(type)){\n            String layerName=DxfColor.key(r.text(2,"0"));\n            c.layerColors.put(layerName,DxfColor.layerArgb(r.integer(62,7),r.trueColor()));return;\n        }''',
          '''        if("TABLES".equals(c.section)&&"LAYER".equals(type)){\n            String layerName=r.text(2,"0");\n            c.layerTable.add(layerName,r.integer(62,7),r.integer(70,0),r.trueColor());return;\n        }'''))
          reps.append((
          '''                                     Map<String,StreamBlock> blocks,Set<String> stack,ArrayList<Entity> entities,Set<String> layers,\n                                     StreamCounter counter,StreamContext context)throws IOException{''',
          '''                                     Map<String,StreamBlock> blocks,Set<String> stack,ArrayList<Entity> entities,Set<String> layers,\n                                     Set<String> visibleLayers,StreamCounter counter,StreamContext context)throws IOException{'''))
          reps.append((
          '''                int color=DxfColor.argb(ref,context.layerColors);\n                entities.add(new LayerEntity(new Transformed(shape.entity,parent),layer,color));layers.add(layer);continue;''',
          '''                int color=DxfColor.argb(ref,context.layerTable.colors);\n                entities.add(new LayerEntity(new Transformed(shape.entity,parent),layer,color));\n                if(layers.add(layer)&&!context.layerTable.contains(layer))visibleLayers.add(layer);\n                continue;'''))
          reps.append((
          '''                expandStream(block.members,parent,layer,dimColor,blocks,stack,entities,layers,counter,context);''',
          '''                expandStream(block.members,parent,layer,dimColor,blocks,stack,entities,layers,visibleLayers,counter,context);'''))
          reps.append((
          '''            expandStream(block.members,transform,layer,insertColor,blocks,stack,entities,layers,counter,context);''',
          '''            expandStream(block.members,transform,layer,insertColor,blocks,stack,entities,layers,visibleLayers,counter,context);'''))
          reps.append((
          '''    private static Result finishEntities(ArrayList<Entity> entities,Set<String> layers,int skipped)throws IOException{''',
          '''    private static Result finishEntities(ArrayList<Entity> entities,Set<String> layers,Set<String> visibleLayers,int skipped)throws IOException{'''))
          reps.append((
          '''        return renderLayers(entities,m,layers,layers,skipped);''',
          '''        return renderLayers(entities,m,layers,visibleLayers,skipped);'''))
          for old,new in reps:
              count=s.count(old)
              if count!=1:
                  raise SystemExit(f'expected exactly one match, got {count}: {old[:80]!r}')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Test layer metadata
        run: |
          rm -rf /tmp/musacad-layer-test && mkdir -p /tmp/musacad-layer-test
          javac -d /tmp/musacad-layer-test app/src/main/java/com/musa/cad/DxfColor.java app/src/main/java/com/musa/cad/DxfLayerTable.java tests/DxfLayerTableTest.java
          java -cp /tmp/musacad-layer-test DxfLayerTableTest
      - name: Commit renderer patch
        run: |
          git config user.name 'MusaCAD CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/musa/cad/DxfParser.java
          git commit -m 'Read full DXF layer table and initial visibility'
          git push origin HEAD:fix-1b-hatch-geometry
