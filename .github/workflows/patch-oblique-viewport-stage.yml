name: One-shot oblique viewport patch

on:
  push:
    branches: [ fix-1b-hatch-geometry ]
    paths: [ '.github/workflows/patch-oblique-viewport-stage.yml' ]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-shot oblique viewport workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-1b-hatch-geometry
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Patch oblique viewport targets
        run: python3 .github/scripts/patch_oblique_viewport_stage.py
      - name: Test viewport and cumulative renderer regressions
        run: |
          rm -rf /tmp/musacad-oblique && mkdir -p /tmp/musacad-oblique
          javac -d /tmp/musacad-oblique app/src/main/java/com/musa/cad/DxfViewport.java tests/DxfViewportTest.java
          java -cp /tmp/musacad-oblique DxfViewportTest
          javac -d /tmp/musacad-oblique app/src/main/java/com/musa/cad/DxfOcs.java tests/DxfOcsTest.java
          java -cp /tmp/musacad-oblique DxfOcsTest
          javac -d /tmp/musacad-oblique app/src/main/java/com/musa/cad/DxfPolylineWidth.java tests/DxfPolylineWidthTest.java
          java -cp /tmp/musacad-oblique DxfPolylineWidthTest
          javac -d /tmp/musacad-oblique app/src/main/java/com/musa/cad/DxfCurves.java app/src/main/java/com/musa/cad/DxfDimStyles.java app/src/main/java/com/musa/cad/DxfLeader.java tests/DxfDimStylesTest.java tests/DxfLeaderTest.java
          java -cp /tmp/musacad-oblique DxfDimStylesTest
          java -cp /tmp/musacad-oblique DxfLeaderTest
          javac -d /tmp/musacad-oblique app/src/main/java/com/musa/cad/DxfInfiniteLine.java tests/DxfInfiniteLineTest.java
          java -cp /tmp/musacad-oblique DxfInfiniteLineTest
          javac -d /tmp/musacad-oblique app/src/main/java/com/musa/cad/DxfHatchPattern.java tests/DxfHatchPatternTest.java
          java -cp /tmp/musacad-oblique DxfHatchPatternTest
          javac -d /tmp/musacad-oblique app/src/main/java/com/musa/cad/DxfText.java app/src/main/java/com/musa/cad/DxfTextStyles.java app/src/main/java/com/musa/cad/DxfTextLayout.java tests/DxfTextTest.java tests/DxfTextStylesTest.java tests/DxfTextLayoutTest.java
          java -cp /tmp/musacad-oblique DxfTextTest
          java -cp /tmp/musacad-oblique DxfTextStylesTest
          java -cp /tmp/musacad-oblique DxfTextLayoutTest
          javac -d /tmp/musacad-oblique app/src/main/java/com/musa/cad/DxfColor.java app/src/main/java/com/musa/cad/DxfStyle.java app/src/main/java/com/musa/cad/DxfTransparency.java app/src/main/java/com/musa/cad/DxfDrawOrder.java app/src/main/java/com/musa/cad/DxfOcs.java app/src/main/java/com/musa/cad/DxfSpace.java app/src/main/java/com/musa/cad/DxfVisibility.java app/src/main/java/com/musa/cad/DxfBlocks.java tests/DxfBlocksTest.java
          java -cp /tmp/musacad-oblique DxfBlocksTest
      - name: Fetch pinned LibreDWG for Android compile
        uses: actions/checkout@v4
        with:
          repository: LibreDWG/libredwg
          ref: 34f02f54b9aacb5708c1d3d2070efb3e4b2d8c43
          path: third_party/libredwg
      - name: Compile Android Java sources
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:compileDebugJavaWithJavac
      - name: Commit oblique viewport parser support
        run: |
          git config user.name 'MusaCAD CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/musa/cad/DxfParser.java
          git commit -m 'Project oblique paper viewports with view targets'
          git push origin HEAD:fix-1b-hatch-geometry

# rerun with complete LEADER test dependencies
