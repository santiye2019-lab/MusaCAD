name: One-shot HATCH fill patch

on:
  push:
    branches: [ fix-1b-hatch-geometry ]
    paths: [ '.github/workflows/patch-hatch-stage.yml' ]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-shot HATCH fill workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-1b-hatch-geometry
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Patch HATCH rendering
        run: python3 .github/scripts/patch_hatch_stage.py
      - name: Test HATCH pattern geometry
        run: |
          rm -rf /tmp/musacad-hatch-test && mkdir -p /tmp/musacad-hatch-test
          javac -d /tmp/musacad-hatch-test app/src/main/java/com/musa/cad/DxfHatchPattern.java tests/DxfHatchPatternTest.java
          java -cp /tmp/musacad-hatch-test DxfHatchPatternTest
      - name: Test OCS and block regression
        run: |
          javac -d /tmp/musacad-hatch-test app/src/main/java/com/musa/cad/DxfColor.java app/src/main/java/com/musa/cad/DxfStyle.java app/src/main/java/com/musa/cad/DxfOcs.java app/src/main/java/com/musa/cad/DxfBlocks.java tests/DxfOcsTest.java tests/DxfBlocksTest.java
          java -cp /tmp/musacad-hatch-test DxfOcsTest
          java -cp /tmp/musacad-hatch-test DxfBlocksTest
      - name: Fetch pinned LibreDWG for Android compile
        uses: actions/checkout@v4
        with:
          repository: LibreDWG/libredwg
          ref: 34f02f54b9aacb5708c1d3d2070efb3e4b2d8c43
          path: third_party/libredwg
      - name: Compile Android Java sources
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:compileDebugJavaWithJavac
      - name: Commit HATCH renderer
        run: |
          git config user.name 'MusaCAD CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/musa/cad/DxfParser.java
          git commit -m 'Render solid and patterned HATCH fills'
          git push origin HEAD:fix-1b-hatch-geometry
