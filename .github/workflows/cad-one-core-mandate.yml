name: MusaCAD single CAD core architecture mandate

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'AGENTS.md'
      - 'docs/UNIFIED_CAD_ENGINE_POLICY.md'
      - 'docs/UNIFIED_CAD_ENGINE_INVENTORY.json'
      - 'tests/**'
      - 'core/native/**'
      - 'app/src/main/java/com/musa/cad/**'
      - 'app/src/main/cpp/**'
      - '.github/workflows/cad-one-core-mandate.yml'
      - '.github/workflows/cad-crossplatform-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  one-cad-engine:
    name: All CAD semantics use one engine — audit gate
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Enforce owner's all-platform one-CAD-engine rule and migration inventory
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_one_cad_engine_mandate.py' -v
          python3 -m unittest discover -s tests -p 'test_shared_core_portability_contract.py' -v
          python3 -m unittest discover -s tests -p 'test_core_migration_diff.py' -v
          python3 tests/check_core_migration_diff.py
      - name: Compile and test shared CAD core without Android or LibreDWG
        run: |
          set -euo pipefail
          cmake -S core/native -B /tmp/musacad-one-engine-core -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build /tmp/musacad-one-engine-core -j2
          ctest --test-dir /tmp/musacad-one-engine-core -C Debug --output-on-failure
