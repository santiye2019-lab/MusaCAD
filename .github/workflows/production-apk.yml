name: Production signed direct APK

on:
  workflow_dispatch:
    inputs:
      release_approved:
        description: "Final acceptance complete and APK creation explicitly approved"
        type: boolean
        required: true
        default: false
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_approved == true }}
    runs-on: ubuntu-latest
    env:
      MUSACAD_PRODUCTION_RELEASE: "true"
      MUSACAD_KEYSTORE_FILE: /tmp/musacad-release.jks
      MUSACAD_RELEASE_KEYSTORE_B64: ${{ secrets.MUSACAD_RELEASE_KEYSTORE_B64 }}
      MUSACAD_KEYSTORE_PASSWORD: ${{ secrets.MUSACAD_KEYSTORE_PASSWORD }}
      MUSACAD_KEY_ALIAS: ${{ secrets.MUSACAD_KEY_ALIAS }}
      MUSACAD_KEY_PASSWORD: ${{ secrets.MUSACAD_KEY_PASSWORD }}
      MUSACAD_TRIAL_API_URL: ${{ secrets.MUSACAD_TRIAL_API_URL }}
      MUSACAD_TRIAL_PUBLIC_KEY_PEM: ${{ secrets.MUSACAD_TRIAL_PUBLIC_KEY_PEM }}
      # Public Cloudflare endpoint, not an API key. Secrets stay on the server.
      # Never silently publish a production APK with missing Gandalf connectivity.
      MUSACAD_AI_API_URL: https://musacad-ai.musacad2019.workers.dev/v1/analyze

    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned LibreDWG source
        uses: actions/checkout@v4
        with:
          repository: LibreDWG/libredwg
          ref: 34f02f54b9aacb5708c1d3d2070efb3e4b2d8c43
          path: third_party/libredwg

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate production release inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in             MUSACAD_RELEASE_KEYSTORE_B64             MUSACAD_KEYSTORE_PASSWORD             MUSACAD_KEY_ALIAS             MUSACAD_KEY_PASSWORD             MUSACAD_TRIAL_API_URL             MUSACAD_TRIAL_PUBLIC_KEY_PEM; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required production secret: $name"
              exit 1
            fi
          done
          case "$MUSACAD_TRIAL_API_URL" in
            https://*) ;;
            *) echo "::error::MUSACAD_TRIAL_API_URL must be HTTPS"; exit 1 ;;
          esac
          # The trial URL is supplied privately by GitHub Actions; derive its
          # sibling AI session route. Never commit signing keys or real device IDs.
          if [ "$MUSACAD_TRIAL_API_URL" != "https://musacad-trial-api.musacad2019.workers.dev/v1/trial/start" ]; then
            echo "::error::Unexpected trial Worker host; update and verify the production configuration before building Cloud AI."
            exit 1
          fi
          SESSION_URL="${MUSACAD_TRIAL_API_URL%/v1/trial/start}/v1/ai/session"
          if [ "$MUSACAD_AI_API_URL" != "https://musacad-ai.musacad2019.workers.dev/v1/analyze" ]; then
            echo "::error::Unexpected AI Worker endpoint."
            exit 1
          fi
          echo "MUSACAD_AI_SESSION_URL=$SESSION_URL" >> "$GITHUB_ENV"

      - name: Prepare production signing keystore
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$MUSACAD_RELEASE_KEYSTORE_B64" | base64 -d > "$MUSACAD_KEYSTORE_FILE"
          chmod 600 "$MUSACAD_KEYSTORE_FILE"
          keytool -list             -keystore "$MUSACAD_KEYSTORE_FILE"             -storepass "$MUSACAD_KEYSTORE_PASSWORD"             -alias "$MUSACAD_KEY_ALIAS" >/dev/null

      - name: Probe production trial backend
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --max-time 20             --output /tmp/musacad-trial-probe.json             --write-out '%{http_code}'             --request POST             --header 'content-type: application/json'             --data '{"deviceId":"INVALID-PREFLIGHT-ID","packageName":"com.musa.cad","versionName":"production-build","versionCode":15}'             "$MUSACAD_TRIAL_API_URL")
          if [ "$status" != "403" ] && [ "$status" != "400" ]; then
            echo "::error::Trial backend probe returned HTTP $status; expected 400/403."
            cat /tmp/musacad-trial-probe.json || true
            exit 1
          fi

      - name: Verify Gandalf Cloud endpoints reject unauthenticated requests
        shell: bash
        run: |
          set -euo pipefail
          # These probes never use any user's real license ID or project data.
          SESSION_URL="${MUSACAD_TRIAL_API_URL%/v1/trial/start}/v1/ai/session"
          session_status="$(curl --fail-with-body --silent --show-error --max-time 20             --output /tmp/musacad-ai-session-probe.json --write-out '%{http_code}'             -X POST -H 'Content-Type: application/json'             --data '{"deviceId":"MC-00000000-00000000-00000000","packageName":"com.musa.cad","entitlementProof":""}'             "$SESSION_URL" || true)"
          if [ "$session_status" != "403" ] ||              ! jq -e '.message == "Active cloud-AI entitlement not found"' /tmp/musacad-ai-session-probe.json >/dev/null 2>&1; then
            echo "::error::The current license AI-session service did not reject an unlicensed test device as expected (HTTP $session_status)."
            exit 1
          fi
          AI_BASE="${MUSACAD_AI_API_URL%/v1/analyze}"
          health_status="$(curl --silent --show-error --max-time 20 --output /tmp/musacad-ai-health.json --write-out '%{http_code}' "$AI_BASE/health" || true)"
          if [ "$health_status" != "200" ] ||              ! jq -e '.status == "ok" and .service == "musacad-ai-worker"' /tmp/musacad-ai-health.json >/dev/null 2>&1; then
            echo "::error::Gandalf AI health check failed (HTTP $health_status)."
            exit 1
          fi
          gateway_status="$(curl --silent --show-error --max-time 20             --output /tmp/musacad-ai-denied.json --write-out '%{http_code}'             -X POST -H 'Content-Type: application/json' --data '{}'             "$MUSACAD_AI_API_URL" || true)"
          if [ "$gateway_status" != "401" ] ||              ! jq -e '.status == "denied"' /tmp/musacad-ai-denied.json >/dev/null 2>&1; then
            echo "::error::Gandalf AI gateway is not configured or did not deny an unauthenticated request (HTTP $gateway_status)."
            exit 1
          fi
          echo "PASS: Cloud AI and license session endpoints are available; authorization is enforced."

      - name: Build production signed direct APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleDirectRelease

          apk="app/build/outputs/apk/direct/release/app-direct-release.apk"
          test -s "$apk"

          apksigner="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$apksigner" ]; then
            "$apksigner" verify --verbose --print-certs "$apk"
          else
            jarsigner -verify "$apk"
          fi

          cp "$apk" /tmp/MusaCAD-v1.2.2-direct-production.apk
          sha256sum /tmp/MusaCAD-v1.2.2-direct-production.apk | tee /tmp/MusaCAD-v1.2.2-direct-production.sha256

          {
            echo "## MusaCAD production signed APK"
            echo "- Variant: directRelease"
            echo "- Version: 1.2.2 (17)"
            echo "- Production enforcement: enabled"
            echo "- Debuggable: false"
            echo "- Signing: production keystore"
            echo "- Trial backend: production HTTPS endpoint"
            echo "- Gandalf: local tools + Cloud AI (analyze/session routes verified)"
            echo "- SHA-256:"
            echo '  `'$(cut -d' ' -f1 /tmp/MusaCAD-v1.2.2-direct-production.sha256)'`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload production signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MusaCAD-production-direct-v1.2.2
          path: |
            /tmp/MusaCAD-v1.2.2-direct-production.apk
            /tmp/MusaCAD-v1.2.2-direct-production.sha256
          if-no-files-found: error
          retention-days: 14
