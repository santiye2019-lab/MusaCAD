name: MusaCAD fast CAD regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/**'
      - 'app/src/main/cpp/**'
      - 'core/native/**'
      - 'app/src/main/java/**'
      - 'docs/CAD_2026_PROGRESS.json'
      - 'docs/MUSACAD_CORE_COMPLETION_GATES.json'
      - 'docs/MUSACAD_AC1018_2D_INGEST_PROGRESS.json'
      - 'docs/AUTOCAD_2026_PARITY_MATRIX.json'
      - 'docs/AUTOCAD_2026_ACCEPTANCE_51.json'
      - 'docs/autocad2026_evidence/**'
      - 'docs/AUTOCAD_2026_COMMAND_CATALOG.json'
      - '.github/workflows/cad-fast-regression.yml'
  workflow_dispatch:

# Keep only the newest short feedback pass. This is NOT the full release gate.
concurrency:
  group: musacad-cad-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  targeted-cad:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check fixed 25-gate shared CAD core completion percentage
        run: python3 -m unittest discover -s tests -p 'test_core_completion_gates.py' -v
      - name: Verify AC1018 2D ingest milestone coverage and native evidence
        run: python3 -m unittest discover -s tests -p 'test_ac1018_2d_ingest_progress.py' -v
      - name: P0 data-loss gate - Back cancels project close
        run: python3 -m unittest discover -s tests -p 'test_p0_unsaved_project_back_cancel.py' -v
      - name: P0 LibreDWG independent functional oracle matrix and no-false-equivalence proof
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_dwg_libredwg_reference_matrix.py' -v
      - name: P0 first-party DWG CRC-16 standard golden vectors and failure safety
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -Icore/native/include \
            core/native/src/musacad_crc16.c core/native/tests/core_crc16_test.c \
            -o /tmp/musacad-crc16-host
          /tmp/musacad-crc16-host
      - name: P0 real AC1015 legacy DWG section locator read and fail-closed integrity
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -Icore/native/include \
            core/native/src/musacad_dwg_ac1015.c \
            core/native/src/musacad_crc16.c \
            core/native/src/musacad_dwg_regions.c \
            core/native/src/musacad_dwg_signature.c \
            core/native/src/musacad_bits.c \
            core/native/tests/core_dwg_ac1015_test.c \
            -o /tmp/musacad-ac1015-locators
          /tmp/musacad-ac1015-locators
      - name: P0 R2000 HEADER and CLASSES framed payload guard, sentinel and no-false-CRC proof
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -Icore/native/include \
            core/native/src/musacad_dwg_ac1015_frame.c \
            core/native/src/musacad_dwg_ac1015.c \
            core/native/src/musacad_crc16.c \
            core/native/src/musacad_dwg_regions.c \
            core/native/src/musacad_dwg_signature.c \
            core/native/src/musacad_bits.c \
            core/native/tests/core_dwg_ac1015_frame_test.c \
            -o /tmp/musacad-r2000-frame-host
          /tmp/musacad-r2000-frame-host
      - name: P0 original R2000 object handle map first-party parser, page CRC and rollback
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -Icore/native/include \
            core/native/src/musacad_dwg_ac1015_handles.c \
            core/native/src/musacad_dwg_ac1015.c \
            core/native/src/musacad_dwg_regions.c \
            core/native/src/musacad_dwg_signature.c \
            core/native/src/musacad_crc16.c \
            core/native/src/musacad_bits.c \
            core/native/tests/core_dwg_ac1015_handles_test.c \
            -o /tmp/musacad-ac1015-handles
          /tmp/musacad-ac1015-handles
      - name: P0 original R2000 MS object length, type and CRC parser
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -Icore/native/include \
            core/native/src/musacad_dwg_ac1015_object.c \
            core/native/src/musacad_dwg_ac1015_values.c \
            core/native/src/musacad_dwg_signature.c \
            core/native/src/musacad_crc16.c \
            core/native/src/musacad_bits.c \
            core/native/tests/core_dwg_ac1015_object_test.c \
            -o /tmp/musacad-ac1015-object
          /tmp/musacad-ac1015-object
      - name: P0 original R2000 coordinate codecs BS BL RD BD DD BT BE and fail-closed stream
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -Icore/native/include \
            core/native/src/musacad_dwg_ac1015_values.c \
            core/native/tests/core_dwg_ac1015_values_test.c \
            -o /tmp/musacad-ac1015-values
          /tmp/musacad-ac1015-values
      - name: P0 first-party R2000 LINE CIRCLE ARC fields with strict CRC boundary and reject-only failures
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -Icore/native/include \
            core/native/src/musacad_dwg_ac1015_line.c \
            core/native/src/musacad_dwg_ac1015_curve.c \
            core/native/src/musacad_dwg_ac1015_object.c \
            core/native/src/musacad_dwg_ac1015_values.c \
            core/native/src/musacad_dwg_signature.c \
            core/native/src/musacad_crc16.c \
            core/native/tests/core_dwg_ac1015_line_test.c \
            -o /tmp/musacad-ac1015-primitives
          /tmp/musacad-ac1015-primitives
      - name: P0 R2000 strict common self handle, no EED/graphics, color and LINE admission
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -Icore/native/include \
            core/native/src/musacad_dwg_ac1015_common.c \
            core/native/src/musacad_dwg_ac1015_handle_refs.c \
            core/native/src/musacad_dwg_ac1015_line.c \
            core/native/src/musacad_dwg_ac1015_object.c \
            core/native/src/musacad_dwg_ac1015_values.c \
            core/native/src/musacad_dwg_signature.c \
            core/native/src/musacad_crc16.c \
            core/native/tests/core_dwg_ac1015_common_test.c \
            -o /tmp/musacad-ac1015-common
          /tmp/musacad-ac1015-common
      - name: P0 original R2000 typed and relative H handles, zero padding and source integrity
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -Icore/native/include \
            core/native/src/musacad_dwg_ac1015_handle_refs.c \
            core/native/src/musacad_dwg_ac1015_values.c \
            core/native/src/musacad_dwg_ac1015_object.c \
            core/native/src/musacad_dwg_signature.c \
            core/native/src/musacad_crc16.c \
            core/native/tests/core_dwg_ac1015_handle_refs_test.c \
            -o /tmp/musacad-ac1015-hrefs
          /tmp/musacad-ac1015-hrefs
      - name: P0 first-party DWG candidate section spans, bounds and overlap rejections
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -Icore/native/include \
            core/native/src/musacad_dwg_regions.c core/native/tests/core_dwg_regions_test.c \
            -o /tmp/musacad-dwg-regions-fast
          /tmp/musacad-dwg-regions-fast
      - name: P0 native DWG signature identification across C and JVM
        run: |
          set -euo pipefail
          bash tests/run_dwg_signature_host.sh
      - name: P0 one portable C SHA-256 source integrity and byte-exact save guard
        run: |
          set -euo pipefail
          mkdir -p /tmp/musacad-source-sha
          javac -encoding UTF-8 -d /tmp/musacad-source-sha \
            app/src/main/java/com/musa/cad/CadSaveSourceIntegrity.java \
            tests/CadSaveSourceIntegrityTest.java \
            tests/CadSourceSha256NativeParityTest.java \
            tests/CadSourceSha256MissingCoreTest.java
          java -cp /tmp/musacad-source-sha CadSourceSha256MissingCoreTest
          bash tests/build_dxf_handle_jni_host.sh
          java -Djava.library.path=/tmp/musacad-dxf-handle-host -cp /tmp/musacad-source-sha CadSourceSha256NativeParityTest
          java -Djava.library.path=/tmp/musacad-dxf-handle-host -cp /tmp/musacad-source-sha CadSaveSourceIntegrityTest
      - name: P0 one native DXF section grammar, truncation and no-core acceptance
        run: |
          set -euo pipefail
          mkdir -p /tmp/musacad-native-sections
          javac -encoding UTF-8 -d /tmp/musacad-native-sections \
            app/src/main/java/com/musa/cad/DxfSectionGuard.java \
            tests/DxfSectionGuardTest.java \
            tests/DxfSectionGuardMissingCoreTest.java
          java -cp /tmp/musacad-native-sections DxfSectionGuardMissingCoreTest
          bash tests/build_dxf_handle_jni_host.sh
          java -Djava.library.path=/tmp/musacad-dxf-handle-host -cp /tmp/musacad-native-sections DxfSectionGuardTest
      - name: P0 native saved DXF group-5/105 identity set and absent-core rejection
        run: |
          set -euo pipefail
          mkdir -p /tmp/musacad-dxf-saved-handles
          javac -encoding UTF-8 -d /tmp/musacad-dxf-saved-handles \
            app/src/main/java/com/musa/cad/DxfSavedHandleSet.java \
            tests/DxfSavedHandleSetTest.java tests/DxfSavedHandleSetMissingCoreTest.java
          java -cp /tmp/musacad-dxf-saved-handles DxfSavedHandleSetMissingCoreTest
          bash tests/build_dxf_handle_jni_host.sh
          java -Djava.library.path=/tmp/musacad-dxf-handle-host -cp /tmp/musacad-dxf-saved-handles DxfSavedHandleSetTest
      - name: MC1032 own-engine v1-v2 lossless migration JNI and no-core proof
        run: |
          set -euo pipefail
          mkdir -p /tmp/musacad-mc1032-migrate-java
          javac -encoding UTF-8 -d /tmp/musacad-mc1032-migrate-java \
            app/src/main/java/com/musa/cad/Mc1032Native.java \
            app/src/main/java/com/musa/cad/Mc1032V2Native.java \
            app/src/main/java/com/musa/cad/Mc1032Migration.java \
            tests/Mc1032MigrationTest.java tests/Mc1032MigrationMissingCoreTest.java
          java -cp /tmp/musacad-mc1032-migrate-java Mc1032MigrationMissingCoreTest
          bash tests/build_mc1032_migrate_jni_host.sh
          java -Djava.library.path=/tmp/musacad-mc1032-migrate \
            -cp /tmp/musacad-mc1032-migrate-java Mc1032MigrationTest
      - name: MC1032 rev2 native layers 3D JNI and old-core refusal
        run: |
          set -euo pipefail
          mkdir -p /tmp/musacad-mc1032-v2-java
          javac -encoding UTF-8 -d /tmp/musacad-mc1032-v2-java \
            app/src/main/java/com/musa/cad/Mc1032V2Native.java \
            tests/Mc1032V2NativeTest.java tests/Mc1032V2MissingCoreTest.java
          java -cp /tmp/musacad-mc1032-v2-java Mc1032V2MissingCoreTest
          bash tests/build_mc1032_v2_jni_host.sh
          java -Djava.library.path=/tmp/musacad-mc1032-v2-host \
            -cp /tmp/musacad-mc1032-v2-java Mc1032V2NativeTest
      - name: MC1032 first-party binary JNI read/write, corruption and missing-core proof
        run: |
          set -euo pipefail
          mkdir -p /tmp/musacad-mc1032-java
          javac -encoding UTF-8 -d /tmp/musacad-mc1032-java \
            app/src/main/java/com/musa/cad/Mc1032Native.java \
            tests/Mc1032NativeTest.java tests/Mc1032MissingCoreTest.java
          java -cp /tmp/musacad-mc1032-java Mc1032MissingCoreTest
          bash tests/build_mc1032_jni_host.sh
          java -Djava.library.path=/tmp/musacad-mc1032-host \
            -cp /tmp/musacad-mc1032-java Mc1032NativeTest
      - name: P0 portable C DXF byte streaming and no-native fail-closed
        run: |
          set -euo pipefail
          mkdir -p /tmp/musacad-native-byte-lines
          javac -encoding UTF-8 -d /tmp/musacad-native-byte-lines \
            app/src/main/java/com/musa/cad/FileTransfer.java \
            app/src/main/java/com/musa/cad/DxfPortableLines.java \
            tests/DxfPortableLinesTest.java tests/DxfPortableLinesMissingCoreTest.java
          java -cp /tmp/musacad-native-byte-lines DxfPortableLinesMissingCoreTest
          bash tests/build_dxf_handle_jni_host.sh
          java -Djava.library.path=/tmp/musacad-dxf-handle-host -cp /tmp/musacad-native-byte-lines DxfPortableLinesTest
      - name: P0 seekable DXF source record reader uses one portable C framer
        run: |
          set -euo pipefail
          mkdir -p /tmp/musacad-stream-seek-native
          javac -encoding UTF-8 -d /tmp/musacad-stream-seek-native \
            app/src/main/java/com/musa/cad/FileTransfer.java \
            app/src/main/java/com/musa/cad/DxfColor.java \
            app/src/main/java/com/musa/cad/DxfLineStyle.java \
            app/src/main/java/com/musa/cad/DxfLineTypeParser.java \
            app/src/main/java/com/musa/cad/DxfTextStyle.java \
            app/src/main/java/com/musa/cad/DxfGroupCode.java \
            app/src/main/java/com/musa/cad/DxfPortableLines.java \
            app/src/main/java/com/musa/cad/DxfStream.java \
            app/src/main/java/com/musa/cad/DxfLayerState.java \
            app/src/main/java/com/musa/cad/DxfBlocks.java \
            tests/DxfStreamNativeSeekTest.java tests/DxfStreamMissingCoreTest.java
          java -cp /tmp/musacad-stream-seek-native DxfStreamMissingCoreTest
          bash tests/build_dxf_handle_jni_host.sh
          java -Djava.library.path=/tmp/musacad-dxf-handle-host -cp /tmp/musacad-stream-seek-native DxfStreamNativeSeekTest
      - name: P0 shared C group-code parser and missing-core fail-closed regression
        run: |
          set -euo pipefail
          mkdir -p /tmp/musacad-dxf-group-jni
          javac -encoding UTF-8 -d /tmp/musacad-dxf-group-jni \
            app/src/main/java/com/musa/cad/DxfGroupCode.java \
            tests/DxfGroupCodeTest.java \
            tests/DxfGroupCodeMissingCoreTest.java \
            tests/DxfGroupPairTest.java \
            tests/DxfGroupPairMissingCoreTest.java
          java -cp /tmp/musacad-dxf-group-jni DxfGroupCodeMissingCoreTest
          java -cp /tmp/musacad-dxf-group-jni DxfGroupPairMissingCoreTest
          bash tests/build_dxf_handle_jni_host.sh
          java -Djava.library.path=/tmp/musacad-dxf-handle-host -cp /tmp/musacad-dxf-group-jni DxfGroupCodeTest
          java -Djava.library.path=/tmp/musacad-dxf-handle-host -cp /tmp/musacad-dxf-group-jni DxfGroupPairTest
      - name: Enforce single portable CAD engine and Windows iOS test contracts
        run: |
          python3 -m unittest discover -s tests -p 'test_shared_core_portability_contract.py' -v
      - name: P1 3D gizmo C core and genuine Android JNI host math parity
        run: |
          set -euo pipefail
          bash tests/run_gizmo_native_host.sh
      - name: P1 3D UCS portable core, native JNI and JVM parity
        run: |
          set -euo pipefail
          bash tests/run_ucs_native_host.sh
      - name: P2 shared 3D face brightness via actual JNI and C native regressions
        run: |
          set -euo pipefail
          bash tests/run_face_light_native_host.sh
      - name: P2 indexed 3D topology native C / Android JNI and JVM oracle
        run: |
          set -euo pipefail
          bash tests/run_mesh_topology_native_host.sh
      - name: P2 authoritative native 3D surface area and centroid JNI parity
        run: |
          set -euo pipefail
          bash tests/run_mesh_surface_native_host.sh
      - name: P2 native signed mesh volume with independent topology admission and JNI parity
        run: |
          set -euo pipefail
          bash tests/run_mesh_mass_native_host.sh
      - name: P2 shared conservative 2D picking bounds via portable C and real JNI
        run: |
          set -euo pipefail
          bash tests/run_pick_bounds_native_host.sh
      - name: P0 first-party binary bit cursor bounds, rollback and canonical varints
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -Icore/native/include             core/native/src/musacad_bits.c core/native/tests/core_bits_test.c             -o /tmp/musacad-core-bits-fast
          /tmp/musacad-core-bits-fast
      - name: Shared C ABI 1 core, independent of Android/LibreDWG
        run: |
          set -euo pipefail
          cmake -S core/native -B /tmp/musacad-shared-core-fast -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build /tmp/musacad-shared-core-fast -j2
          ctest --test-dir /tmp/musacad-shared-core-fast -C Debug --output-on-failure
      - name: DWG audit and parity unit regressions
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_dwg_entity_identity_audit.py' -v
          python3 -m unittest discover -s tests -p 'test_dwg_polyline_chain_audit.py' -v
          python3 -m unittest discover -s tests -p 'test_dwg_polyface_topology_audit.py' -v
          python3 -m unittest discover -s tests -p 'test_dwg_layer_table_audit.py' -v
          python3 -m unittest discover -s tests -p 'test_dwg_block_reference_audit.py' -v
          python3 -m unittest discover -s tests -p 'test_dwg_layout_viewport_audit.py' -v
          python3 -m unittest discover -s tests -p 'test_native_preview_type_audit.py' -v
          python3 -m unittest discover -s tests -p 'test_native_modern_scene_guards.py' -v
          python3 -m unittest discover -s tests -p 'test_native_point_payload_guard.py' -v
      - name: Test private CAD first-paint color anomaly and opening-stage timings
        run: |
          set -euo pipefail
          mkdir -p /tmp/musacad-color-load
          javac -encoding UTF-8 -d /tmp/musacad-color-load \
            app/src/main/java/com/musa/cad/CadColorProfile.java \
            app/src/main/java/com/musa/cad/CadOpenTrace.java \
            tests/CadColorProfileTest.java \
            tests/CadOpenTraceTest.java
          java -cp /tmp/musacad-color-load CadColorProfileTest
          java -cp /tmp/musacad-color-load CadOpenTraceTest
      - name: Verified 3D-only mesh fallback via shared C ABI (never Java-only)
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_3d_only_dwg_opening_contract.py' -v
          bash tests/run_3d_admission_host.sh
      - name: Guard validated 3D-only DXF entry and private transient cleanup
        run: |
          python3 -m unittest discover -s tests -p 'test_3d_only_dxf_opening_contract.py' -v
      - name: Test XREF attach overlay and honest unresolved-reference inventory
        run: |
          bash tests/build_dxf_handle_jni_host.sh
          set -euo pipefail
          mkdir -p /tmp/musacad-xref-inventory
          javac -encoding UTF-8 -d /tmp/musacad-xref-inventory app/src/main/java/com/musa/cad/FileTransfer.java app/src/main/java/com/musa/cad/DxfColor.java app/src/main/java/com/musa/cad/DxfLineStyle.java app/src/main/java/com/musa/cad/DxfLineTypeParser.java app/src/main/java/com/musa/cad/DxfTextStyle.java app/src/main/java/com/musa/cad/DxfGroupCode.java app/src/main/java/com/musa/cad/DxfPortableLines.java app/src/main/java/com/musa/cad/DxfStream.java app/src/main/java/com/musa/cad/DxfLayerState.java app/src/main/java/com/musa/cad/DxfBlocks.java app/src/main/java/com/musa/cad/CadXrefSummary.java tests/DxfXrefInventoryTest.java
          java -Djava.library.path=/tmp/musacad-dxf-handle-host -cp /tmp/musacad-xref-inventory DxfXrefInventoryTest
      - name: Fast DXF INSERT/MINSERT geometry and material-count safety
        run: |
          bash tests/build_dxf_handle_jni_host.sh
          set -euo pipefail
          mkdir -p /tmp/musacad-block-tests
          javac -d /tmp/musacad-block-tests app/src/main/java/com/musa/cad/FileTransfer.java app/src/main/java/com/musa/cad/DxfColor.java app/src/main/java/com/musa/cad/DxfLineStyle.java app/src/main/java/com/musa/cad/DxfLineTypeParser.java app/src/main/java/com/musa/cad/DxfTextStyle.java app/src/main/java/com/musa/cad/DxfGroupCode.java app/src/main/java/com/musa/cad/DxfPortableLines.java app/src/main/java/com/musa/cad/DxfStream.java app/src/main/java/com/musa/cad/DxfLayerState.java app/src/main/java/com/musa/cad/DxfBlocks.java tests/DxfBlocksTest.java
          java -Djava.library.path=/tmp/musacad-dxf-handle-host -cp /tmp/musacad-block-tests DxfBlocksTest
      - name: Test conservative 2D CAD source selection prefilter
        run: |
          set -euo pipefail
          mkdir -p /tmp/musacad-pick-bounds
          javac -encoding UTF-8 -d /tmp/musacad-pick-bounds app/src/main/java/com/musa/cad/CadEdit.java app/src/main/java/com/musa/cad/CadPickBounds.java tests/CadPickBoundsTest.java
          java -cp /tmp/musacad-pick-bounds CadPickBoundsTest
      - name: Preserve CAD source discipline layer through 2D transforms
        run: |
          set -euo pipefail
          mkdir -p /tmp/musacad-layer-transform-tests
          javac -encoding UTF-8 -d /tmp/musacad-layer-transform-tests app/src/main/java/com/musa/cad/CadEdit.java tests/CadEditTransformTest.java
          java -cp /tmp/musacad-layer-transform-tests CadEditTransformTest
      - name: Fast exact ARC OFFSET shape and source layer regression
        run: |
          set -euo pipefail
          mkdir -p /tmp/musacad-arc-offset-tests
          javac -encoding UTF-8 -d /tmp/musacad-arc-offset-tests app/src/main/java/com/musa/cad/CadEdit.java tests/CadArcOffsetTest.java
          java -cp /tmp/musacad-arc-offset-tests CadArcOffsetTest
      - name: Fast safe straight POLYLINE offset with miter joins
        run: |
          set -euo pipefail
          mkdir -p /tmp/musacad-poly-offset-tests
          javac -encoding UTF-8 -d /tmp/musacad-poly-offset-tests app/src/main/java/com/musa/cad/CadEdit.java tests/CadPolylineOffsetTest.java
          java -cp /tmp/musacad-poly-offset-tests CadPolylineOffsetTest
      - name: Fast BREAK child identity, per-part editing and style safety
        run: |
          set -euo pipefail
          mkdir -p /tmp/musacad-break-children
          javac -encoding UTF-8 -d /tmp/musacad-break-children \
            app/src/main/java/com/musa/cad/CadEdit.java \
            app/src/main/java/com/musa/cad/DxfLineStyle.java \
            app/src/main/java/com/musa/cad/SourceRange.java \
            app/src/main/java/com/musa/cad/SourceReplacement.java \
            app/src/main/java/com/musa/cad/SourceEditSession.java \
            tests/SourceEditSessionTest.java
          java -cp /tmp/musacad-break-children SourceEditSessionTest
      - name: Fast BREAK DXF disk save and reopen styled LINE records
        run: |
          set -euo pipefail
          mkdir -p /tmp/musacad-break-dxf-reopen
