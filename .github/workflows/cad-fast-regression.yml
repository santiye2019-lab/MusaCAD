name: MusaCAD fast CAD regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/**'
      - 'app/src/main/cpp/**'
      - 'core/native/**'
      - 'app/src/main/java/**'
      - 'docs/CAD_2026_PROGRESS.json'
      - 'docs/AUTOCAD_2026_PARITY_MATRIX.json'
      - 'docs/AUTOCAD_2026_ACCEPTANCE_51.json'
      - 'docs/autocad2026_evidence/**'
      - 'docs/AUTOCAD_2026_COMMAND_CATALOG.json'
      - '.github/workflows/cad-fast-regression.yml'
  workflow_dispatch:

# Keep only the newest short feedback pass. This is NOT the full release gate.
concurrency:
  group: musacad-cad-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  targeted-cad:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Shared C ABI 1 core, independent of Android/LibreDWG
        run: |
          set -euo pipefail
          cmake -S core/native -B /tmp/musacad-shared-core-fast -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build /tmp/musacad-shared-core-fast -j2
          ctest --test-dir /tmp/musacad-shared-core-fast -C Debug --output-on-failure
      - name: DWG audit and parity unit regressions
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_dwg_entity_identity_audit.py' -v
          python3 -m unittest discover -s tests -p 'test_dwg_polyline_chain_audit.py' -v
          python3 -m unittest discover -s tests -p 'test_dwg_polyface_topology_audit.py' -v
          python3 -m unittest discover -s tests -p 'test_dwg_layer_table_audit.py' -v
          python3 -m unittest discover -s tests -p 'test_dwg_block_reference_audit.py' -v
          python3 -m unittest discover -s tests -p 'test_dwg_layout_viewport_audit.py' -v
          python3 -m unittest discover -s tests -p 'test_native_preview_type_audit.py' -v
          python3 -m unittest discover -s tests -p 'test_native_modern_scene_guards.py' -v
          python3 -m unittest discover -s tests -p 'test_native_point_payload_guard.py' -v
      - name: Fast DXF INSERT/MINSERT geometry and material-count safety
        run: |
          set -euo pipefail
          mkdir -p /tmp/musacad-block-tests
          javac -d /tmp/musacad-block-tests app/src/main/java/com/musa/cad/FileTransfer.java app/src/main/java/com/musa/cad/DxfColor.java app/src/main/java/com/musa/cad/DxfLineStyle.java app/src/main/java/com/musa/cad/DxfLineTypeParser.java app/src/main/java/com/musa/cad/DxfTextStyle.java app/src/main/java/com/musa/cad/DxfStream.java app/src/main/java/com/musa/cad/DxfLayerState.java app/src/main/java/com/musa/cad/DxfBlocks.java tests/DxfBlocksTest.java
          java -cp /tmp/musacad-block-tests DxfBlocksTest
      - name: Preserve CAD source discipline layer through 2D transforms
        run: |
          set -euo pipefail
          mkdir -p /tmp/musacad-layer-transform-tests
          javac -encoding UTF-8 -d /tmp/musacad-layer-transform-tests app/src/main/java/com/musa/cad/CadEdit.java tests/CadEditTransformTest.java
          java -cp /tmp/musacad-layer-transform-tests CadEditTransformTest
      - name: Fast exact ARC OFFSET shape and source layer regression
        run: |
          set -euo pipefail
          mkdir -p /tmp/musacad-arc-offset-tests
          javac -encoding UTF-8 -d /tmp/musacad-arc-offset-tests app/src/main/java/com/musa/cad/CadEdit.java tests/CadArcOffsetTest.java
          java -cp /tmp/musacad-arc-offset-tests CadArcOffsetTest
      - name: Fast safe straight POLYLINE offset with miter joins
        run: |
          set -euo pipefail
          mkdir -p /tmp/musacad-poly-offset-tests
          javac -encoding UTF-8 -d /tmp/musacad-poly-offset-tests app/src/main/java/com/musa/cad/CadEdit.java tests/CadPolylineOffsetTest.java
          java -cp /tmp/musacad-poly-offset-tests CadPolylineOffsetTest
      - name: Fast BREAK child identity, per-part editing and style safety
        run: |
          set -euo pipefail
          mkdir -p /tmp/musacad-break-children
          javac -encoding UTF-8 -d /tmp/musacad-break-children \
            app/src/main/java/com/musa/cad/CadEdit.java \
            app/src/main/java/com/musa/cad/DxfLineStyle.java \
            app/src/main/java/com/musa/cad/SourceRange.java \
            app/src/main/java/com/musa/cad/SourceReplacement.java \
            app/src/main/java/com/musa/cad/SourceEditSession.java \
            tests/SourceEditSessionTest.java
          java -cp /tmp/musacad-break-children SourceEditSessionTest
      - name: Fast BREAK DXF disk save and reopen styled LINE records
        run: |
          set -euo pipefail
          mkdir -p /tmp/musacad-break-dxf-reopen
          javac -encoding UTF-8 -d /tmp/musacad-break-dxf-reopen \
            app/src/main/java/com/musa/cad/CadEdit.java \
            app/src/main/java/com/musa/cad/DxfLineStyle.java \
            app/src/main/java/com/musa/cad/DxfNumber.java \
            app/src/main/java/com/musa/cad/SourceRange.java \
            app/src/main/java/com/musa/cad/SourceReplacement.java \
            app/src/main/java/com/musa/cad/SourceEditSession.java \
            app/src/main/java/com/musa/cad/DxfLineRecordWriter.java \
            app/src/main/java/com/musa/cad/DxfSourceHandlePlan.java \
            tests/DxfBreakLineSaveReopenTest.java
          java -cp /tmp/musacad-break-dxf-reopen DxfBreakLineSaveReopenTest
      - name: Fast DXF saved handles and HANDSEED collision proof
        run: |
          set -euo pipefail
          mkdir -p /tmp/musacad-dxf-handles
          javac -encoding UTF-8 -d /tmp/musacad-dxf-handles \
            app/src/main/java/com/musa/cad/CadEdit.java \
            app/src/main/java/com/musa/cad/DxfLineStyle.java \
            app/src/main/java/com/musa/cad/DxfNumber.java \
            app/src/main/java/com/musa/cad/SourceRange.java \
            app/src/main/java/com/musa/cad/SourceReplacement.java \
            app/src/main/java/com/musa/cad/DxfSourceHandlePlan.java \
            app/src/main/java/com/musa/cad/DxfLineRecordWriter.java \
            tests/DxfSourceHandlePlanTest.java
          java -cp /tmp/musacad-dxf-handles DxfSourceHandlePlanTest
      - name: BREAK2 exact original DXF source range deletion safety
        run: |
          set -euo pipefail
          mkdir -p /tmp/musacad-break-range-guard
          javac -encoding UTF-8 -d /tmp/musacad-break-range-guard \
            app/src/main/java/com/musa/cad/CadEdit.java \
            app/src/main/java/com/musa/cad/DxfLineStyle.java \
            app/src/main/java/com/musa/cad/SourceRange.java \
            app/src/main/java/com/musa/cad/SourceReplacement.java \
            app/src/main/java/com/musa/cad/DxfBreakSourceBoundaryGuard.java \
            app/src/main/java/com/musa/cad/SourceEditSession.java \
            tests/DxfBreakSourceBoundaryGuardTest.java
          java -cp /tmp/musacad-break-range-guard DxfBreakSourceBoundaryGuardTest
      - name: BREAK BYLAYER layer palette and relocated child visibility proof
        run: |
          set -euo pipefail
          mkdir -p /tmp/musacad-break-bylayer
          javac -encoding UTF-8 -d /tmp/musacad-break-bylayer \
            app/src/main/java/com/musa/cad/CadEdit.java \
            app/src/main/java/com/musa/cad/DxfColor.java \
            app/src/main/java/com/musa/cad/DxfLayerState.java \
            app/src/main/java/com/musa/cad/DxfLineStyle.java \
            app/src/main/java/com/musa/cad/SourceRange.java \
            app/src/main/java/com/musa/cad/SourceReplacement.java \
            app/src/main/java/com/musa/cad/DxfReplacementLayerStyle.java \
            tests/DxfReplacementLayerStyleTest.java
          java -cp /tmp/musacad-break-bylayer DxfReplacementLayerStyleTest
      - name: 2D DXF stage before SAF with structural and SHA-256 verification
        run: |
          set -euo pipefail
          mkdir -p /tmp/musacad-2d-safe-stage
          javac -encoding UTF-8 -d /tmp/musacad-2d-safe-stage \
            app/src/main/java/com/musa/cad/FileTransfer.java \
            app/src/main/java/com/musa/cad/CadSaveSourceIntegrity.java \
            app/src/main/java/com/musa/cad/DxfSourceHandlePlan.java \
            app/src/main/java/com/musa/cad/Dxf2dStructureVerifier.java \
            app/src/main/java/com/musa/cad/Dxf2dSafeSave.java \
            tests/Dxf2dSafeSaveTest.java
          java -cp /tmp/musacad-2d-safe-stage Dxf2dSafeSaveTest
      - name: DXF semantic readback of saved BREAK children
        run: |
          set -euo pipefail
          mkdir -p /tmp/musacad-saved-semantic
          javac -encoding UTF-8 -d /tmp/musacad-saved-semantic \
            app/src/main/java/com/musa/cad/CadEdit.java \
            app/src/main/java/com/musa/cad/DxfLineStyle.java \
            app/src/main/java/com/musa/cad/DxfNumber.java \
            app/src/main/java/com/musa/cad/FileTransfer.java \
            app/src/main/java/com/musa/cad/CadSaveSourceIntegrity.java \
            app/src/main/java/com/musa/cad/SourceRange.java \
            app/src/main/java/com/musa/cad/SourceReplacement.java \
            app/src/main/java/com/musa/cad/DxfSourceHandlePlan.java \
            app/src/main/java/com/musa/cad/DxfLineRecordWriter.java \
            app/src/main/java/com/musa/cad/Dxf2dStructureVerifier.java \
            app/src/main/java/com/musa/cad/Dxf2dSafeSave.java \
            app/src/main/java/com/musa/cad/Dxf2dSavedLineReopenProof.java \
            tests/Dxf2dSavedLineReopenProofTest.java
          java -cp /tmp/musacad-saved-semantic Dxf2dSavedLineReopenProofTest
      - name: Fast 3D open-surface area-weighted XYZ centroid
        run: |
          set -euo pipefail
          mkdir -p /tmp/musacad-surface-centroid-tests
          javac -encoding UTF-8 -d /tmp/musacad-surface-centroid-tests app/src/main/java/com/musa/cad/Cad3dSurfaceMetrics.java tests/Cad3dSurfaceMetricsTest.java
          java -cp /tmp/musacad-surface-centroid-tests Cad3dSurfaceMetricsTest
      - name: Android Canvas 3D camera to shared C matrix projection regression
        run: |
          set -euo pipefail
          mkdir -p /tmp/musacad-camera-projection-jvm
          javac -encoding UTF-8 -d /tmp/musacad-camera-projection-jvm \
            app/src/main/java/com/musa/cad/Cad3dLegacyCameraBridge.java \
            tests/Cad3dLegacyCameraBridgeTest.java
          java -cp /tmp/musacad-camera-projection-jvm Cad3dLegacyCameraBridgeTest
          echo 'Projection-only test; native picking, real DWG ID, and device acceptance remain pending.'
      - name: Optional Android 3D native mesh mass adapter preserves Java fallback
        run: |
          set -euo pipefail
          mkdir -p /tmp/musacad-native-mass-jvm
          javac -encoding UTF-8 -d /tmp/musacad-native-mass-jvm \
            app/src/main/java/com/musa/cad/Cad3dMeshTopology.java \
            app/src/main/java/com/musa/cad/Cad3dSignedVolume.java \
            app/src/main/java/com/musa/cad/Cad3dNativeMeshMass.java \
            tests/Cad3dNativeMeshMassTest.java
          java -cp /tmp/musacad-native-mass-jvm Cad3dNativeMeshMassTest
      - name: Optional Android 3D surface-area JNI adapter and JVM fallback tests
        run: |
          set -euo pipefail
          mkdir -p /tmp/musacad-native-surface-jvm
          javac -encoding UTF-8 -d /tmp/musacad-native-surface-jvm \
            app/src/main/java/com/musa/cad/Cad3dSurfaceMetrics.java \
            app/src/main/java/com/musa/cad/Cad3dNativeMeshSurface.java \
            tests/Cad3dNativeMeshSurfaceTest.java
          java -cp /tmp/musacad-native-surface-jvm Cad3dNativeMeshSurfaceTest
          JHOME="${JAVA_HOME_17_X64:-${JAVA_HOME:-}}"
          if [ -z "$JHOME" ]; then
            JHOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          fi
          cc -std=c11 -Wall -Wextra -Werror -fsyntax-only \
            -I "$JHOME/include" -I "$JHOME/include/linux" \
            -I core/native/include app/src/main/cpp/mesh_surface_jni.c
      - name: Polygonal EXTRUDE shell, volumes and DXF reopen parity
        run: |
          set -euo pipefail
          mkdir -p /tmp/musacad-extrude-tests
          javac -encoding UTF-8 -d /tmp/musacad-extrude-tests app/src/main/java/com/musa/cad/CadPrismBrep.java tests/CadPrismBrepTest.java
          java -cp /tmp/musacad-extrude-tests CadPrismBrepTest
          javac -encoding UTF-8 -d /tmp/musacad-extrude-tests app/src/main/java/com/musa/cad/FileTransfer.java app/src/main/java/com/musa/cad/DxfColor.java app/src/main/java/com/musa/cad/DxfLineStyle.java app/src/main/java/com/musa/cad/DxfLineTypeParser.java app/src/main/java/com/musa/cad/DxfTextStyle.java app/src/main/java/com/musa/cad/DxfStream.java app/src/main/java/com/musa/cad/DxfLayerState.java app/src/main/java/com/musa/cad/DxfBlocks.java app/src/main/java/com/musa/cad/AcisSatMesh.java app/src/main/java/com/musa/cad/Dxf3dMesh.java app/src/main/java/com/musa/cad/Cad3dMeshTopology.java app/src/main/java/com/musa/cad/Cad3dSignedVolume.java app/src/main/java/com/musa/cad/Cad3dSurfaceMetrics.java app/src/main/java/com/musa/cad/CadPrismBrep.java tests/CadPrismBrepRoundtripTest.java
          java -cp /tmp/musacad-extrude-tests CadPrismBrepRoundtripTest
      - name: Test bounded polygonal REVOLVE mesh and DXF reopen
        run: |
          set -euo pipefail
          mkdir -p /tmp/musacad-revolve-tests
          javac -encoding UTF-8 -d /tmp/musacad-revolve-tests app/src/main/java/com/musa/cad/FileTransfer.java app/src/main/java/com/musa/cad/DxfColor.java app/src/main/java/com/musa/cad/DxfLineStyle.java app/src/main/java/com/musa/cad/DxfLineTypeParser.java app/src/main/java/com/musa/cad/DxfTextStyle.java app/src/main/java/com/musa/cad/DxfStream.java app/src/main/java/com/musa/cad/DxfLayerState.java app/src/main/java/com/musa/cad/DxfBlocks.java app/src/main/java/com/musa/cad/AcisSatMesh.java app/src/main/java/com/musa/cad/Dxf3dMesh.java app/src/main/java/com/musa/cad/Cad3dMeshTopology.java app/src/main/java/com/musa/cad/Cad3dSignedVolume.java app/src/main/java/com/musa/cad/Cad3dSurfaceMetrics.java app/src/main/java/com/musa/cad/CadRevolveShell.java tests/CadRevolveShellTest.java tests/CadRevolveSectorTest.java
          java -cp /tmp/musacad-revolve-tests CadRevolveShellTest
          java -cp /tmp/musacad-revolve-tests CadRevolveSectorTest
      - name: Fast 3D INSERT/MINSERT Z-scale and nested elevation regression
        run: |
          set -euo pipefail
          mkdir -p /tmp/musacad-zinsert-tests
          javac -d /tmp/musacad-zinsert-tests app/src/main/java/com/musa/cad/FileTransfer.java app/src/main/java/com/musa/cad/DxfColor.java app/src/main/java/com/musa/cad/DxfLineStyle.java app/src/main/java/com/musa/cad/DxfLineTypeParser.java app/src/main/java/com/musa/cad/DxfTextStyle.java app/src/main/java/com/musa/cad/DxfStream.java app/src/main/java/com/musa/cad/DxfLayerState.java app/src/main/java/com/musa/cad/DxfBlocks.java app/src/main/java/com/musa/cad/AcisSatMesh.java app/src/main/java/com/musa/cad/Dxf3dMesh.java app/src/main/java/com/musa/cad/Dxf3dEditor.java tests/Dxf3dMeshTest.java
          javac -cp /tmp/musacad-zinsert-tests -d /tmp/musacad-zinsert-tests app/src/main/java/com/musa/cad/CadSaveSourceIntegrity.java app/src/main/java/com/musa/cad/Dxf3dSafeSave.java tests/Dxf3dSafeSaveTest.java
          java -cp /tmp/musacad-zinsert-tests Dxf3dMeshTest
          java -cp /tmp/musacad-zinsert-tests Dxf3dSafeSaveTest
          javac -encoding UTF-8 -cp /tmp/musacad-zinsert-tests -d /tmp/musacad-zinsert-tests \
            app/src/main/java/com/musa/cad/Cad3dDxfHandleIndex.java \
            tests/Cad3dDxfHandleIndexTest.java
          java -cp /tmp/musacad-zinsert-tests Cad3dDxfHandleIndexTest
          javac -encoding UTF-8 -cp /tmp/musacad-zinsert-tests -d /tmp/musacad-zinsert-tests \
            app/src/main/java/com/musa/cad/Cad3dDwgHandleCrosscheck.java \
            tests/Cad3dDwgHandleCrosscheckTest.java
          java -cp /tmp/musacad-zinsert-tests Cad3dDwgHandleCrosscheckTest
          javac -encoding UTF-8 -cp /tmp/musacad-zinsert-tests -d /tmp/musacad-zinsert-tests tests/DxfStreamEofTest.java
          java -cp /tmp/musacad-zinsert-tests DxfStreamEofTest
          javac -cp /tmp/musacad-zinsert-tests -d /tmp/musacad-zinsert-tests tests/Dxf3dSafeSaveIntegrationContractTest.java
          java -cp /tmp/musacad-zinsert-tests Dxf3dSafeSaveIntegrationContractTest
      - name: AutoCAD 2026 indexed command router recognition smoke
        run: |
          set -euo pipefail
          mkdir -p /tmp/musacad-autocad2026-router-smoke
          javac -d /tmp/musacad-autocad2026-router-smoke app/src/main/java/com/musa/cad/CadCommand.java tests/AutoCAD2026CommandRouterSmokeTest.java
          java -cp /tmp/musacad-autocad2026-router-smoke AutoCAD2026CommandRouterSmokeTest
          echo 'Parsing command names is NOT equivalent to working AutoCAD 2026 operations.'
      - name: CAD progress and AutoCAD 2026 parity claims audit
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_cad_progress_gate.py' -v
          python3 -m unittest discover -s tests -p 'test_autocad_2026_parity_gate.py' -v
          python3 -m unittest discover -s tests -p 'test_autocad_2026_51_acceptance.py' -v
          python3 -m unittest discover -s tests -p 'test_autocad_2026_readiness.py' -v
          python3 tests/autocad_2026_readiness.py
          python3 tests/autocad_2026_51_acceptance.py
          python3 -m unittest discover -s tests -p 'test_final_apk_hold_gate.py' -v
          python3 tests/autocad_2026_parity_gate.py
          cc -std=c11 -Wall -Wextra -Werror -I app/src/main/cpp tests/native_color_test.c -o /tmp/musa-fast-native-color
          /tmp/musa-fast-native-color
          cc -std=c11 -Wall -Wextra -Werror -I app/src/main/cpp tests/scene_coord_safety_test.c -lm -o /tmp/musa-fast-scene-safety
          /tmp/musa-fast-scene-safety
      - name: Mark full CI and final APK as independent required gates
        run: |
          echo "Fast CAD regression passed for this commit."
          echo "This is NOT Modern DWG end-to-end proof, Android build acceptance, or physical-device acceptance."
          echo "Every required module still needs its full CI pass before being counted done."
          echo "No APK is built or published by this workflow."
